<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Management V8.8</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981; --primary-hover: #059669;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #064e3b;
            --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Auth Screen */
        .login-screen { height: 100vh; display: grid; place-items: center; background: #f1f5f9; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: var(--primary); margin-bottom: 5px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--line); outline: none; }

        /* App Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.1rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout-btn { background: var(--danger); color: white; width: 100%; border-radius: 10px; padding: 12px; border: none; font-weight: 700; cursor: pointer; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        /* Notification Dropdown */
        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; color: var(--muted); }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg); }
        .notif-pane { display: none; position: absolute; top: 60px; right: 0; width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); z-index: 1000; overflow: hidden; }
        .notif-pane.active { display: block; }
        .notif-header { padding: 12px; background: var(--bg); font-weight: 800; font-size: 0.8rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
        .notif-item { padding: 12px; border-bottom: 1px solid var(--line); font-size: 0.8rem; line-height: 1.4; cursor: pointer; }
        .notif-item.urgent { border-left: 4px solid var(--danger); background: rgba(239, 68, 68, 0.05); }

        /* Dashboard & Panels */
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); text-align: center; }
        .stat-card h2 { margin: 5px 0 0; font-size: 1.8rem; font-weight: 800; }

        /* Buttons & Forms */
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--muted); font-size: 0.8rem; border-bottom: 2px solid var(--line); }
        td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(3px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 420px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none; }

        #toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; z-index: 3000; }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>
<div id="toast"></div>

<!-- Modal: Task -->
<div class="modal-overlay" id="modal-task">
    <div class="modal">
        <h2>New Task</h2>
        <div class="form-group"><label>Task Name</label><input type="text" id="f-t-title"></div>
        <div class="form-group"><label>Assign Staff</label><select id="f-t-user"></select></div>
        <div class="form-group"><label>Due Date</label><input type="date" id="f-t-date"></div>
        <div class="form-group"><label>Priority</label>
            <select id="f-t-pri"><option value="HIGH">Urgent</option><option value="MEDIUM" selected>Medium</option><option value="LOW">Low</option></select>
        </div>
        <button class="btn btn-primary" onclick="saveTask()" style="width:100%">Save Task</button>
        <button class="btn" onclick="closeModal('modal-task')" style="width:100%; background:none;">Cancel</button>
    </div>
</div>

<!-- Modal: User -->
<div class="modal-overlay" id="modal-user">
    <div class="modal">
        <h2>Add Staff Member</h2>
        <div class="form-group"><label>Full Name</label><input type="text" id="f-u-name"></div>
        <div class="form-group"><label>Login Email</label><input type="email" id="f-u-email"></div>
        <div class="form-group"><label>Password</label><input type="password" id="f-u-pass"></div>
        <div class="form-group"><label>WhatsApp (e.g. 91...)</label><input type="text" id="f-u-phone"></div>
        <div class="form-group"><label>Role</label>
            <select id="f-u-role"><option value="Pharmacist">Pharmacist</option><option value="Assistant">Assistant</option><option value="Admin">Admin/Manager</option></select>
        </div>
        <button class="btn btn-primary" onclick="saveUser()" style="width:100%">Create Account</button>
        <button class="btn" onclick="closeModal('modal-user')" style="width:100%; background:none;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. DATA STATE & CONFIG
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const STORAGE_KEY = "PHARMACY_V8_8_FINAL";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    users: [{id: 'u1', name: 'Admin', email: 'admin@pharmacy.local', password: '123', phone: '', role: 'Admin'}],
    masterTasks: [],
    recurringTasks: [], // Key fixed to match Apps Script
    notifications: [],
    session: null,
    settings: { darkMode: false, sync: true, view: 'dashboard' }
};

const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(state.settings.sync) syncCloud();
};

async function syncCloud() {
    const payload = {
        action: 'syncDatabase',
        database: {
            tasks: state.tasks,
            users: state.users,
            masterTasks: state.masterTasks,
            recurringTasks: state.recurringTasks,
            notifications: state.notifications
        }
    };
    try {
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    } catch(e) { console.warn("Cloud offline"); }
}

// ==========================================
// 2. AUTH & ENGINES
// ==========================================
function init() { if(state.session) runEngines(); render(); }

function runEngines() {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayStr = today.toDateString();
    let change = false;

    // Recurring
    state.recurringTasks.forEach(r => {
        if(r.lastRun !== todayStr) {
            state.tasks.unshift({ id: 'rt'+Date.now(), title: "[AUTO] "+r.title, userId: 'u1', status: 'TODO', date: new Date().toISOString().split('T')[0], priority: 'MEDIUM' });
            r.lastRun = todayStr;
            pushNotif("🔄 Recurring task added: " + r.title);
            change = true;
        }
    });

    // Overdue
    state.tasks.forEach(t => {
        if(t.status !== 'DONE' && t.date) {
            if(new Date(t.date) < today && t.lastAlerted !== todayStr) {
                pushNotif(`⚠️ OVERDUE: "${t.title}" is incomplete!`, 'urgent');
                t.lastAlerted = todayStr;
                change = true;
            }
        }
    });

    if(change) save();
}

function pushNotif(text, type = 'info') {
    state.notifications.unshift({ id: Date.now(), text, type, read: false, time: new Date().toLocaleTimeString() });
}

function handleLogin() {
    const email = document.getElementById('l-email').value;
    const pass = document.getElementById('l-pass').value;
    const user = state.users.find(u => u.email === email && u.password === pass);
    if(user) { state.session = user; save(); init(); } else alert("Login Failed");
}

function logout() {
    state.session = null;
    save();
    render();
}

// ==========================================
// 3. UI RENDERING
// ==========================================
function nav(v) { state.settings.view = v; save(); render(); }

function render() {
    const root = document.getElementById('app-root');
    if (!state.session) {
        root.innerHTML = `<div class="login-screen"><div class="login-card"><h1>💊 Pharmacy</h1><p>Task Management Login</p><input id="l-email" placeholder="Email" value="admin@pharmacy.local"><input id="l-pass" type="password" placeholder="Password" value="123"><button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button></div></div>`;
        return;
    }

    const unread = state.notifications.filter(n => !n.read).length;
    document.body.className = state.settings.darkMode ? 'dark' : '';
    
    root.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">PHARMACY MGMT</div>
                <nav class="nav-links">
                    <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-chart-line"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-check"></i> <span>Tasks</span></div>
                    <div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-user-friends"></i> <span>Staff</span></div>
                    <div class="nav-item ${state.settings.view==='master'?'active':''}" onclick="nav('master')"><i class="fas fa-copy"></i> <span>Templates</span></div>
                    <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer"><button class="logout-btn" onclick="logout()">LOGOUT</button></div>
            </aside>
            <main class="main-content">
                <header class="top-bar">
                    <h1 style="text-transform:capitalize">${state.settings.view}</h1>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <div class="notif-bell" onclick="toggleNotifs()">
                            <i class="fas fa-bell"></i>
                            ${unread ? `<span class="notif-badge">${unread}</span>` : ''}
                            <div class="notif-pane" id="notif-box">
                                <div class="notif-header">Notifications <span onclick="state.notifications=[];save();render();" style="cursor:pointer;color:var(--primary)">Clear</span></div>
                                ${state.notifications.map(n => `<div class="notif-item ${n.type==='urgent'?'urgent':''}">${n.text}</div>`).join('') || '<div class="notif-item">No alerts</div>'}
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="openTaskModal()">+ New Task</button>
                    </div>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>`;
    renderView();
}

function renderView() {
    const mount = document.getElementById('view-mount');
    const v = state.settings.view;

    if (v === 'dashboard') {
        const pending = state.tasks.filter(t => t.status !== 'DONE').length;
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><span>Active Tasks</span><h2>${pending}</h2></div>
                <div class="stat-card"><span>Staff</span><h2>${state.users.length}</h2></div>
                <div class="stat-card"><span>Templates</span><h2>${state.masterTasks.length}</h2></div>
                <div class="stat-card"><span>Sync</span><h2 style="font-size:1rem;color:var(--primary)">${state.settings.sync?'Online':'Local'}</h2></div>
            </div>
            <div class="panel"><h3>Quick Cloud Sync</h3><button class="btn btn-primary" onclick="syncCloud();alert('Sync Triggered');">Sync to Google Sheets Now</button></div>
        `;
    } 
    else if (v === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Task</th><th>Staff</th><th>Status</th><th>WhatsApp</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => {
                            const u = state.users.find(x => x.id === t.userId);
                            return `<tr>
                                <td>${t.title}</td>
                                <td>${u ? u.name : '-'}</td>
                                <td><button onclick="toggleTask('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                                <td>${t.status!=='DONE' && u?.phone ? `<button class="btn btn-whatsapp" onclick="wa('${u.phone}', '${t.title}')"><i class="fab fa-whatsapp"></i></button>` : '-'}</td>
                                <td><button onclick="delTask('${t.id}')" style="color:var(--danger);border:none;background:none;"><i class="fas fa-trash"></i></button></td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (v === 'staff') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;"><h3>Staff Accounts</h3><button class="btn btn-primary" onclick="document.getElementById('modal-user').classList.add('active')">+ Add Staff</button></div>
            <div class="panel">
                <table>
                    <thead><tr><th>Name</th><th>Role</th><th>WhatsApp</th><th>Action</th></tr></thead>
                    <tbody>${state.users.map(u => `<tr><td>${u.name}</td><td>${u.role}</td><td>${u.phone||'-'}</td><td><button class="btn" onclick="delUser('${u.id}')">Delete</button></td></tr>`).join('')}</tbody>
                </table>
            </div>`;
    }
    else if (v === 'master') {
        mount.innerHTML = `<div class="panel"><h3>Workflow Templates</h3><p class="muted">Templates logic integrated with Tasks.</p></div>`;
    }
    else if (v === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:500px;">
                <h3>System Settings</h3>
                <div class="form-group"><label>Display Name</label><input value="${state.session.name}" onchange="state.session.name=this.value;save();"></div>
                <div class="form-group"><label>New Password</label><input type="password" id="new-pw" placeholder="Leave blank to keep current"><button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="updatePw()">Update Password</button></div>
                <hr>
                <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="state.settings.darkMode=!state.settings.darkMode;save();render();">Toggle Dark Mode</button>
                <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="state.settings.sync=!state.settings.sync;save();render();">Sync: ${state.settings.sync?'ON':'OFF'}</button>
                <button class="btn btn-danger" style="width:100%" onclick="if(confirm('Wipe All?')) {localStorage.clear();location.reload();}">Factory Reset</button>
            </div>`;
    }
}

// ==========================================
// 4. ACTION FUNCTIONS
// ==========================================
function openTaskModal() {
    document.getElementById('f-t-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    document.getElementById('modal-task').classList.add('active');
}
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function toggleNotifs() { document.getElementById('notif-box').classList.toggle('active'); state.notifications.forEach(n=>n.read=true); }

function saveTask() {
    const title = document.getElementById('f-t-title').value;
    if(!title) return;
    state.tasks.unshift({ id: 't'+Date.now(), title, userId: document.getElementById('f-t-user').value, date: document.getElementById('f-t-date').value, priority: document.getElementById('f-t-pri').value, status: 'TODO' });
    save(); closeModal('modal-task'); render();
}

function saveUser() {
    const name = document.getElementById('f-u-name').value;
    const email = document.getElementById('f-u-email').value;
    const password = document.getElementById('f-u-pass').value;
    if(!name || !email || !password) return alert("Required fields missing");
    state.users.push({ id: 'u'+Date.now(), name, email, password, phone: document.getElementById('f-u-phone').value, role: document.getElementById('f-u-role').value });
    save(); closeModal('modal-user'); render();
}

function toggleTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) { t.status = t.status === 'DONE' ? 'TODO' : 'DONE'; save(); render(); }
}

function updatePw() {
    const pw = document.getElementById('new-pw').value;
    if(!pw) return;
    const idx = state.users.findIndex(u => u.id === state.session.id);
    state.users[idx].password = pw;
    state.session.password = pw;
    save(); alert("Password Updated");
}

function wa(phone, task) {
    const clean = phone.replace(/\D/g, '');
    window.open(`https://wa.me/${clean}?text=${encodeURIComponent('Hello, reminder for task: ' + task)}`, '_blank');
}

function delTask(id) { state.tasks = state.tasks.filter(t=>t.id!==id); save(); render(); }
function delUser(id) { if(id==='u1') return; state.users = state.users.filter(u=>u.id!==id); save(); render(); }

</script>
</body>
</html>
