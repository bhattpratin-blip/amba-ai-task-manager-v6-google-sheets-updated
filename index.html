<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V6.5</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f4f7fb; --sidebar: #1e293b; --card: #ffffff; --text: #1e293b;
            --primary: #4f46e5; --ai: #7c3aed; --line: #e2e8f0; --muted: #64748b;
            --success: #10b981; --danger: #ef4444; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --muted: #94a3b8;
        }

        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; transition: background 0.3s; }

        /* Sidebar Styling */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; transition: 0.3s; z-index: 100; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.2rem; font-weight: 800; border-bottom: 1px solid #334155; }
        .nav-group { padding: 15px 0; flex: 1; overflow-y: auto; }
        .nav-item { 
            padding: 12px 25px; display: flex; align-items: center; gap: 12px; 
            color: #cbd5e1; text-decoration: none; cursor: pointer; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 20px; border-top: 1px solid #334155; }

        /* Main Content */
        .main-content { margin-left: 260px; flex: 1; padding: 30px; min-width: 0; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
        .stat-card small { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
        .stat-card h3 { margin: 10px 0 0; font-size: 1.8rem; }

        /* UI Components */
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 20px; }
        button { 
            padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; 
            display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--line); color: var(--text); }
        .btn-ai { background: var(--ai); color: white; }
        
        input, select, textarea { 
            width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; 
            background: var(--card); color: var(--text); margin-top: 5px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; color: var(--muted); border-bottom: 2px solid var(--line); }
        td { padding: 12px; border-bottom: 1px solid var(--line); }

        .pill { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .high { background: #fee2e2; color: #b91c1c; }
        .done { background: #dcfce7; color: #15803d; }

        /* Modals */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
            display: none; place-items: center; z-index: 200; padding: 20px;
        }
        .modal-overlay.open { display: grid; }
        .modal { background: var(--card); width: 100%; max-width: 500px; border-radius: 15px; padding: 25px; }

        #toast { 
            position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; 
            background: #1e293b; color: white; border-radius: 8px; display: none; z-index: 300; 
        }

        @media (max-width: 900px) {
            .sidebar { width: 70px; }
            .sidebar span, .sidebar-header { display: none; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">AMBA AI V6.5</div>
        <div class="nav-group">
            <div class="nav-item active" onclick="setView('dashboard')"><span>📊 Dashboard</span></div>
            <div class="nav-item" onclick="setView('master')"><span>📚 Master Tasks</span></div>
            <div class="nav-item" onclick="setView('daily')"><span>📅 Daily Tasks</span></div>
            <div class="nav-item" onclick="setView('weekly')"><span>📆 Weekly Tasks</span></div>
            <div class="nav-item" onclick="setView('monthly')"><span>🗓 Monthly Tasks</span></div>
            <div class="nav-item" onclick="setView('employees')"><span>👥 Employees</span></div>
            <div class="nav-item" onclick="setView('reports')"><span>📈 Reports</span></div>
            <div class="nav-item" onclick="setView('settings')"><span>⚙️ Settings</span></div>
        </div>
        <div class="sidebar-footer">
            <div class="nav-item" onclick="handleLogout()"><span>🚪 Logout</span></div>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="main-content">
        <header>
            <h1 id="view-title">Dashboard</h1>
            <div style="display:flex; gap:10px;">
                <button class="btn-ai" onclick="openAI()">🤖 AI Assistant</button>
                <button class="btn-primary" onclick="openTaskModal()">+ New Task</button>
            </div>
        </header>

        <div id="content-area">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <!-- Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h2 id="modalTitle">Add New Task</h2>
            <form id="taskForm">
                <label>Title</label><input id="taskTitle" required>
                <label>Assign To</label><select id="taskAssign"></select>
                <label>Due Date</label><input type="date" id="taskDue">
                <label>Priority</label>
                <select id="taskPriority">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                </select>
                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button type="button" class="btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex:1">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // Database Initialization
        let db = JSON.parse(localStorage.getItem('amba_db')) || {
            tasks: [],
            users: [
                {id: 'u1', name: 'Admin', role: 'ADMIN', email: 'admin@amba.com'},
                {id: 'u2', name: 'Rahul', role: 'EMPLOYEE', email: 'rahul@amba.com'}
            ],
            config: { apiUrl: '', darkMode: false }
        };

        let currentView = 'dashboard';

        function saveDB() {
            localStorage.setItem('amba_db', JSON.stringify(db));
            refreshCurrentView();
        }

        // View Router
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event?.currentTarget?.classList?.add('active');
            
            const titleMap = {
                dashboard: '📊 Dashboard Overview',
                master: '📚 Master Task List',
                daily: '📅 Today\'s Tasks',
                weekly: '📆 This Week',
                monthly: '🗓 Monthly Schedule',
                employees: '👥 Employee Management',
                reports: '📈 Business Reports',
                settings: '⚙️ System Settings'
            };
            
            document.getElementById('view-title').textContent = titleMap[view];
            refreshCurrentView();
        }

        function refreshCurrentView() {
            const area = document.getElementById('content-area');
            const today = new Date().toISOString().split('T')[0];

            if (currentView === 'dashboard') {
                renderDashboard(area);
            } else if (currentView === 'master') {
                renderTable(area, db.tasks);
            } else if (currentView === 'daily') {
                const daily = db.tasks.filter(t => t.due === today);
                renderTable(area, daily, "No tasks for today.");
            } else if (currentView === 'weekly') {
                renderTable(area, db.tasks, "Weekly View (Filter logic can be added)");
            } else if (currentView === 'employees') {
                renderEmployees(area);
            } else if (currentView === 'settings') {
                renderSettings(area);
            } else {
                area.innerHTML = `<div class="card">This module is coming soon in V6.6</div>`;
            }
        }

        // Render Dashboard
        function renderDashboard(container) {
            const total = db.tasks.length;
            const completed = db.tasks.filter(t => t.status === 'DONE').length;
            
            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><small>TOTAL TASKS</small><h3>${total}</h3></div>
                    <div class="stat-card"><small>COMPLETED</small><h3>${completed}</h3></div>
                    <div class="stat-card"><small>ACTIVE STAFF</small><h3>${db.users.length}</h3></div>
                </div>
                <div class="card">
                    <h3>Recent Tasks</h3>
                    <div id="recent-tasks-list"></div>
                </div>
            `;
            renderTable(document.getElementById('recent-tasks-list'), db.tasks.slice(0, 5));
        }

        // Generic Table Renderer
        function renderTable(container, tasks, emptyMsg = "No tasks found.") {
            if (tasks.length === 0) {
                container.innerHTML = `<p style="padding:20px; color:var(--muted)">${emptyMsg}</p>`;
                return;
            }

            let html = `<table><thead><tr><th>Task</th><th>Assignee</th><th>Due</th><th>Priority</th><th>Status</th></tr></thead><tbody>`;
            tasks.forEach(t => {
                const user = db.users.find(u => u.id === t.userId)?.name || 'Unassigned';
                html += `
                    <tr>
                        <td><strong>${t.title}</strong></td>
                        <td>${user}</td>
                        <td>${t.due || '---'}</td>
                        <td><span class="pill ${t.priority.toLowerCase()}">${t.priority}</span></td>
                        <td><button onclick="toggleStatus('${t.id}')" class="btn-secondary">${t.status}</button></td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Employee Management
        function renderEmployees(container) {
            container.innerHTML = `
                <div class="card">
                    <h3>Add New Employee</h3>
                    <div style="display:flex; gap:10px;">
                        <input id="empName" placeholder="Name">
                        <input id="empEmail" placeholder="Email">
                        <button class="btn-primary" onclick="addEmployee()">Add</button>
                    </div>
                </div>
                <div class="card">
                    <h3>Current Staff</h3>
                    <table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
                    <tbody>${db.users.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td></tr>`).join('')}</tbody>
                    </table>
                </div>
            `;
        }

        // Settings
        function renderSettings(container) {
            container.innerHTML = `
                <div class="card">
                    <h3>Google Sheets API</h3>
                    <p>Enter your Apps Script URL for cloud sync.</p>
                    <input id="apiUrl" value="${db.config.apiUrl}" placeholder="https://script.google.com/...">
                    <button class="btn-primary" style="margin-top:10px" onclick="saveSettings()">Save Configuration</button>
                </div>
                <div class="card">
                    <h3>Appearance</h3>
                    <button class="btn-secondary" onclick="toggleDarkMode()">Toggle Dark Mode</button>
                </div>
            `;
        }

        // Task Logic
        function openTaskModal() {
            const select = document.getElementById('taskAssign');
            select.innerHTML = db.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            document.getElementById('taskModal').classList.add('open');
        }

        function closeModal() { document.getElementById('taskModal').classList.remove('open'); }

        document.getElementById('taskForm').onsubmit = (e) => {
            e.preventDefault();
            const newTask = {
                id: 't' + Date.now(),
                title: document.getElementById('taskTitle').value,
                userId: document.getElementById('taskAssign').value,
                due: document.getElementById('taskDue').value,
                priority: document.getElementById('taskPriority').value,
                status: 'TODO'
            };
            db.tasks.unshift(newTask);
            saveDB();
            closeModal();
            showToast("Task created successfully!");
        };

        function toggleStatus(id) {
            const task = db.tasks.find(t => t.id === id);
            task.status = task.status === 'TODO' ? 'DONE' : 'TODO';
            saveDB();
        }

        function addEmployee() {
            const name = document.getElementById('empName').value;
            const email = document.getElementById('empEmail').value;
            if(!name || !email) return;
            db.users.push({id: 'u'+Date.now(), name, email, role: 'EMPLOYEE'});
            saveDB();
            showToast("Employee added!");
        }

        function saveSettings() {
            db.config.apiUrl = document.getElementById('apiUrl').value;
            saveDB();
            showToast("Settings saved!");
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            db.config.darkMode = document.body.classList.contains('dark');
            saveDB();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function handleLogout() {
            if(confirm("Logout from Amba AI?")) location.reload();
        }

        // Initialize
        if(db.config.darkMode) document.body.classList.add('dark');
        setView('dashboard');
    </script>
</body>
</html>
