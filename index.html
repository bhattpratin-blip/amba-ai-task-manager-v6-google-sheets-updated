<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Management V8.7</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981; --primary-hover: #059669;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #064e3b;
            --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        /* Login Interface */
        .login-screen { height: 100vh; display: grid; place-items: center; background: #f1f5f9; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: var(--primary); margin-bottom: 5px; }
        .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 25px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--line); outline: none; }
        .login-card input:focus { border-color: var(--primary); }

        /* Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.1rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); letter-spacing: 1px; }
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout-btn { background: var(--danger); color: white; width: 100%; border-radius: 10px; padding: 12px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        /* Notifications */
        .top-right { display: flex; align-items: center; gap: 20px; }
        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; color: var(--muted); transition: 0.2s; }
        .notif-bell:hover { color: var(--primary); }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg); }
        .notif-pane { display: none; position: absolute; top: 70px; right: 30px; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); z-index: 1000; overflow: hidden; }
        .notif-pane.active { display: block; }
        .notif-header { padding: 15px; background: var(--bg); font-weight: 800; font-size: 0.85rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
        .notif-list { max-height: 300px; overflow-y: auto; }
        .notif-item { padding: 12px 15px; border-bottom: 1px solid var(--line); font-size: 0.8rem; line-height: 1.4; cursor: pointer; }
        .notif-item:hover { background: var(--bg); }
        .notif-item.unread { border-left: 3px solid var(--primary); background: rgba(16, 185, 129, 0.05); }
        .notif-item.urgent { border-left: 3px solid var(--danger); background: rgba(239, 68, 68, 0.05); }

        /* Panels */
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); text-align: center; }
        .stat-card span { font-size: 0.75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
        .stat-card h2 { margin: 10px 0 0; font-size: 1.8rem; font-weight: 800; }

        /* UI Elements */
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-high { background: #fee2e2; color: #b91c1c; }
        .badge-done { background: #dcfce7; color: #15803d; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--muted); font-size: 0.8rem; border-bottom: 2px solid var(--line); }
        td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(3px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 450px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-top: 0; margin-bottom: 20px; font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none; }

        #toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; z-index: 3000; box-shadow: var(--shadow); font-weight: 600; }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>
<div id="toast"></div>

<!-- Modal: New Task -->
<div class="modal-overlay" id="modal-task">
    <div class="modal">
        <h2>New Task Assignment</h2>
        <div class="form-group">
            <label>Task Description</label>
            <input type="text" id="f-task-title" placeholder="e.g., Weekly Inventory Check">
        </div>
        <div class="form-group">
            <label>Assigned Staff</label>
            <select id="f-task-user"></select>
        </div>
        <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="f-task-date">
        </div>
        <div class="form-group">
            <label>Priority</label>
            <select id="f-task-pri">
                <option value="HIGH">Urgent / High</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="LOW">Low</option>
            </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-primary" onclick="submitTask()" style="flex:1">Save Task</button>
            <button class="btn" onclick="closeModal('modal-task')" style="flex:1">Cancel</button>
        </div>
    </div>
</div>

<!-- Modal: New User -->
<div class="modal-overlay" id="modal-user">
    <div class="modal">
        <h2>Add Staff Member</h2>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="f-user-name" placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Login Email</label>
            <input type="email" id="f-user-email" placeholder="john@pharmacy.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="f-user-pass" placeholder="Enter Password">
        </div>
        <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="text" id="f-user-phone" placeholder="919876543210 (with country code)">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="f-user-role">
                <option value="Pharmacist">Pharmacist</option>
                <option value="Assistant">Assistant</option>
                <option value="Admin">Manager / Admin</option>
            </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-primary" onclick="submitUser()" style="flex:1">Create Account</button>
            <button class="btn" onclick="closeModal('modal-user')" style="flex:1">Cancel</button>
        </div>
    </div>
</div>

<!-- Modal: Master Template -->
<div class="modal-overlay" id="modal-master">
    <div class="modal">
        <h2>Create Workflow Template</h2>
        <div class="form-group">
            <label>Template Name</label>
            <input type="text" id="f-master-title" placeholder="e.g. Daily Fridge Temp">
        </div>
        <div class="form-group">
            <label>Default Priority</label>
            <select id="f-master-pri">
                <option value="HIGH">High</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="LOW">Low</option>
            </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-primary" onclick="submitMaster()" style="flex:1">Save Template</button>
            <button class="btn" onclick="closeModal('modal-master')" style="flex:1">Cancel</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. STATE & ENGINE
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const LOCAL_KEY = "PHARMACY_V8_7_FINAL";

let state = JSON.parse(localStorage.getItem(LOCAL_KEY)) || {
    tasks: [],
    users: [{id: 'u1', name: 'Admin User', email: 'admin@pharmacy.local', password: '123', phone: '', role: 'Admin'}],
    masterTasks: [],
    recurring: [],
    notifications: [],
    session: null,
    settings: { darkMode: false, sync: true, view: 'dashboard' }
};

const save = () => {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
    if(state.settings.sync) syncCloud();
};

async function syncCloud() {
    try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncDatabase', database: state }) }); } catch(e) {}
}

// ==========================================
// 2. AUTOMATION ENGINES
// ==========================================
function runEngines() {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayStr = today.toDateString();
    let change = false;

    // A. Recurring Engine
    state.recurring.forEach(r => {
        if (r.lastRun !== todayStr) {
            state.tasks.unshift({ 
                id: 'rt'+Date.now(), 
                title: "[AUTO] "+r.title, 
                userId: state.session ? state.session.id : 'u1', 
                status: 'TODO', 
                date: new Date().toISOString().split('T')[0], 
                priority: 'MEDIUM',
                lastAlerted: "" 
            });
            r.lastRun = todayStr;
            notify("🔄 Automation: Task generated - " + r.title);
            change = true;
        }
    });

    // B. Overdue Check
    state.tasks.forEach(t => {
        if (t.status !== 'DONE' && t.date) {
            if (new Date(t.date) < today && t.lastAlerted !== todayStr) {
                notify(`🚨 OVERDUE: "${t.title}" is incomplete!`, 'urgent');
                t.lastAlerted = todayStr;
                change = true;
            }
        }
    });

    if(change) save();
}

function notify(text, type = 'info') {
    state.notifications.unshift({ 
        id: Date.now(), 
        text, 
        type, 
        read: false, 
        time: new Date().toLocaleTimeString() 
    });
}

// ==========================================
// 3. UI RENDERING
// ==========================================
function init() {
    if(state.session) runEngines();
    render();
}

function handleLogin() {
    const e = document.getElementById('l-email').value;
    const p = document.getElementById('l-pass').value;
    const user = state.users.find(u => u.email === e && u.password === p);
    
    if(user) {
        state.session = user;
        save();
        init();
    } else {
        showToast("Invalid Login Credentials");
    }
}

function logout() {
    if(confirm("Are you sure you want to logout?")) {
        state.session = null;
        save();
        render();
    }
}

function render() {
    const root = document.getElementById('app-root');
    
    if (!state.session) {
        root.innerHTML = `
            <div class="login-screen">
                <div class="login-card">
                    <h1>💊 Pharmacy</h1>
                    <p>Task Management System</p>
                    <input type="email" id="l-email" placeholder="Email" value="admin@pharmacy.local">
                    <input type="password" id="l-pass" placeholder="Password" value="123">
                    <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button>
                    <p style="margin-top:20px; font-size:0.7rem; color:var(--muted)">Version 8.7 Stable Release</p>
                </div>
            </div>`;
        return;
    }

    const unread = state.notifications.filter(n => !n.read).length;
    document.body.className = state.settings.darkMode ? 'dark' : '';
    
    root.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">PHARMACY PRO</div>
                <nav class="nav-links">
                    <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-tasks"></i> <span>Tasks</span></div>
                    <div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-user-md"></i> <span>Staff Management</span></div>
                    <div class="nav-item ${state.settings.view==='master'?'active':''}" onclick="nav('master')"><i class="fas fa-file-invoice"></i> <span>Templates</span></div>
                    <div class="nav-item ${state.settings.view==='automation'?'active':''}" onclick="nav('automation')"><i class="fas fa-robot"></i> <span>Automation</span></div>
                    <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer">
                    <div style="font-size:0.7rem; color:#94a3b8; margin-bottom:10px;">User: ${state.session.name}</div>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-power-off"></i> <b>Logout</b>
                    </button>
                </div>
            </aside>
            <main class="main-content">
                <header class="top-bar">
                    <div style="display:flex; flex-direction:column;">
                        <h1 style="text-transform: capitalize; margin:0;">${state.settings.view}</h1>
                        <small class="muted">${new Date().toDateString()}</small>
                    </div>
                    <div class="top-right">
                        <div class="notif-bell" onclick="toggleNotifs()">
                            <i class="fas fa-bell"></i>
                            ${unread ? `<span class="notif-badge">${unread}</span>` : ''}
                            <div class="notif-pane" id="notif-box">
                                <div class="notif-header">
                                    <span>Notifications</span>
                                    <span style="color:var(--primary); cursor:pointer;" onclick="clearNotifs()">Clear All</span>
                                </div>
                                <div class="notif-list">
                                    ${state.notifications.map(n => `
                                        <div class="notif-item ${n.read?'':'unread'} ${n.type==='urgent'?'urgent':''}" onclick="markNotifRead(${n.id})">
                                            ${n.text}<br><small class="muted">${n.time}</small>
                                        </div>
                                    `).join('') || '<div class="notif-item muted">No unread alerts</div>'}
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="openTaskModal()">+ New Task</button>
                    </div>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>`;
    renderView();
}

function nav(v) { state.settings.view = v; save(); render(); }

// ==========================================
// 4. VIEW COMPONENTS
// ==========================================
function renderView() {
    const mount = document.getElementById('view-mount');
    const v = state.settings.view;

    if (v === 'dashboard') {
        const pending = state.tasks.filter(t=>t.status!=='DONE').length;
        const done = state.tasks.filter(t=>t.status==='DONE').length;
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><span>Active Tasks</span><h2>${pending}</h2></div>
                <div class="stat-card"><span>Completed</span><h2>${done}</h2></div>
                <div class="stat-card"><span>Incomplete Alerts</span><h2 style="color:var(--danger)">${state.notifications.filter(n=>n.type==='urgent').length}</h2></div>
                <div class="stat-card"><span>Efficiency</span><h2>${state.tasks.length ? Math.round((done/state.tasks.length)*100) : 0}%</h2></div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 350px; gap:25px;">
                <div class="panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3>Today's Critical Tasks</h3>
                        <button class="btn" onclick="nav('tasks')" style="font-size:0.7rem;">View All</button>
                    </div>
                    <table>
                        <thead><tr><th>Task Description</th><th>Priority</th><th>Action</th></tr></thead>
                        <tbody>
                            ${state.tasks.filter(t=>t.status!=='DONE').slice(0,6).map(t => `
                                <tr>
                                    <td><b>${t.title}</b></td>
                                    <td><span class="badge ${t.priority==='HIGH'?'badge-high':''}">${t.priority}</span></td>
                                    <td><button class="btn btn-primary" style="padding:5px 10px; font-size:0.7rem;" onclick="toggleTask('${t.id}')">Complete</button></td>
                                </tr>
                            `).join('') || '<tr><td colspan="3" class="muted">No pending tasks for today.</td></tr>'}
                        </tbody>
                    </table>
                </div>
                <div class="panel">
                    <h3>Quick Cloud Sync</h3>
                    <p class="muted" style="font-size:0.8rem;">Manually sync your local data to the Google Sheets backend.</p>
                    <button class="btn btn-primary" style="width:100%" onclick="syncCloudManually()">
                        <i class="fas fa-cloud-upload-alt"></i> Sync with Sheets
                    </button>
                    <hr style="margin:20px 0; border:none; border-top:1px solid var(--line);">
                    <h3>Staff Performance</h3>
                    ${state.users.slice(0,3).map(u => `
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.8rem;">
                            <span>${u.name}</span>
                            <b>${state.tasks.filter(t=>t.userId===u.id && t.status==='DONE').length} Completed</b>
                        </div>
                    `).join('')}
                </div>
            </div>`;
    }
    else if (v === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Task Detail</th><th>Assigned To</th><th>Status</th><th>Notify</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => {
                            const u = state.users.find(x => x.id === t.userId);
                            return `<tr>
                                <td style="${t.status==='DONE'?'text-decoration:line-through; color:var(--muted)':''}; font-weight:600;">${t.title}</td>
                                <td>${u ? u.name : 'Unassigned'}</td>
                                <td><button onclick="toggleTask('${t.id}')" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">${t.status==='DONE'?'✅':'⭕'}</button></td>
                                <td>${t.status!=='DONE' && u && u.phone ? `<button class="btn btn-whatsapp" onclick="waReminder('${u.phone}', '${t.title}')"><i class="fab fa-whatsapp"></i> Notify</button>` : '-'}</td>
                                <td><button class="btn" style="color:var(--danger)" onclick="deleteTask('${t.id}')"><i class="fas fa-trash"></i></button></td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (v === 'staff') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>User Accounts & Permissions</h3>
                <button class="btn btn-primary" onclick="document.getElementById('modal-user').classList.add('active')">+ Add Member</button>
            </div>
            <div class="panel">
                <table>
                    <thead><tr><th>Name</th><th>Email / Login</th><th>Role</th><th>Active Tasks</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.users.map(u => `
                            <tr>
                                <td><b>${u.name}</b></td>
                                <td>${u.email}</td>
                                <td>${u.role}</td>
                                <td>${state.tasks.filter(t=>t.userId===u.id && t.status!=='DONE').length}</td>
                                <td><button class="btn" style="color:var(--danger)" onclick="deleteUser('${u.id}')">${u.id==='u1'?'':'Delete'}</button></td>
                            </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (v === 'master') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Task Templates</h3>
                <button class="btn btn-primary" onclick="document.getElementById('modal-master').classList.add('active')">+ New Template</button>
            </div>
            <div class="panel">
                <table>
                    <thead><tr><th>Workflow Name</th><th>Default Priority</th><th>Usage</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.masterTasks.map(m => `
                            <tr>
                                <td><b>${m.title}</b></td>
                                <td>${m.priority}</td>
                                <td>${m.usage || 0} times</td>
                                <td>
                                    <button class="btn btn-primary" style="padding:5px 10px; font-size:0.7rem;" onclick="applyMaster('${m.id}')">Apply</button>
                                    <button class="btn" style="color:var(--danger)" onclick="deleteMaster('${m.id}')"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (v === 'automation') {
        mount.innerHTML = `
            <div class="panel">
                <h3>Scheduled Automations</h3>
                <p class="muted">Add tasks that should automatically appear every single day.</p>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <input type="text" id="ar-title" placeholder="e.g., Morning Fridge Temp Audit" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--line);">
                    <button class="btn btn-primary" onclick="addAutomation()">Create Automation</button>
                </div>
                ${state.recurring.map(r => `
                    <div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid var(--line);">
                        <span>🔄 <b>${r.title}</b> (Daily)</span>
                        <button class="btn" style="color:var(--danger)" onclick="deleteAutomation('${r.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('') || '<p class="muted">No automated tasks configured.</p>'}
            </div>`;
    }
    else if (v === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:500px;">
                <h3>System Configuration</h3>
                <div class="form-group">
                    <label>Pharmacy Name / User</label>
                    <input type="text" id="s-name" value="${state.session.name}" onchange="updateProfile('name', this.value)">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <span>Google Sheets Cloud Sync</span>
                    <button class="btn btn-primary" style="font-size:0.7rem;" onclick="state.settings.sync=!state.settings.sync; save(); render();">
                        ${state.settings.sync?'ENABLED':'DISABLED'}
                    </button>
                </div>
                <button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="state.settings.darkMode=!state.settings.darkMode; save(); render();">Toggle Dark Mode</button>
                <button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="exportExcel()">Export Tasks (Excel)</button>
                
                <hr style="margin:25px 0; border:none; border-top:1px solid var(--line);">
                <h3>Security</h3>
                <div class="form-group">
                    <label>Reset Account Password</label>
                    <input type="password" id="s-pass" placeholder="Enter new password">
                </div>
                <button class="btn btn-danger" style="width:100%; margin-bottom:10px;" onclick="updateProfile('password', document.getElementById('s-pass').value)">Update Password</button>
                
                <hr style="margin:25px 0; border:none; border-top:1px solid var(--line);">
                <button class="btn-danger btn" style="width:100%" onclick="resetSystem()">Factory Reset (Delete Everything)</button>
            </div>`;
    }
}

// ==========================================
// 5. CORE LOGIC FUNCTIONS
// ==========================================
function openTaskModal() {
    document.getElementById('f-task-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    document.getElementById('modal-task').classList.add('active');
}
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function toggleNotifs() { document.getElementById('notif-box').classList.toggle('active'); }

function submitTask() {
    const title = document.getElementById('f-task-title').value;
    if(!title) return;
    state.tasks.unshift({
        id: 't'+Date.now(),
        title,
        userId: document.getElementById('f-task-user').value,
        date: document.getElementById('f-task-date').value,
        priority: document.getElementById('f-task-pri').value,
        status: 'TODO',
        lastAlerted: ""
    });
    save(); closeModal('modal-task'); render();
}

function submitUser() {
    const name = document.getElementById('f-user-name').value;
    const email = document.getElementById('f-user-email').value;
    const password = document.getElementById('f-user-pass').value;
    const phone = document.getElementById('f-user-phone').value;
    const role = document.getElementById('f-user-role').value;
    if(!name || !email || !password) return alert("Fill all required fields");
    state.users.push({ id: 'u'+Date.now(), name, email, password, phone, role });
    save(); closeModal('modal-user'); render();
}

function toggleTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) { t.status = t.status === 'DONE' ? 'TODO' : 'DONE'; save(); render(); }
}

function deleteTask(id) { if(confirm("Delete Task?")) { state.tasks = state.tasks.filter(t=>t.id!==id); save(); render(); } }
function deleteUser(id) { if(id==='u1') return; if(confirm("Delete User?")) { state.users = state.users.filter(u=>u.id!==id); save(); render(); } }

function submitMaster() {
    const title = document.getElementById('f-master-title').value;
    const priority = document.getElementById('f-master-pri').value;
    if(!title) return;
    state.masterTasks.push({ id: 'm'+Date.now(), title, priority, usage: 0 });
    save(); closeModal('modal-master'); render();
}

function applyMaster(id) {
    const m = state.masterTasks.find(x => x.id === id);
    m.usage = (m.usage || 0) + 1;
    state.tasks.unshift({ id: 't'+Date.now(), title: m.title, userId: state.session.id, date: new Date().toISOString().split('T')[0], priority: m.priority, status: 'TODO', lastAlerted: "" });
    save(); nav('tasks'); showToast("Workflow Applied");
}

function deleteMaster(id) { if(confirm("Delete Template?")) { state.masterTasks = state.masterTasks.filter(m=>m.id!==id); save(); render(); } }

function addAutomation() {
    const title = document.getElementById('ar-title').value;
    if(!title) return;
    state.recurring.push({ id: 'r'+Date.now(), title, lastRun: '' });
    save(); render();
}

function deleteAutomation(id) { state.recurring = state.recurring.filter(r=>r.id!==id); save(); render(); }

function waReminder(phone, task) {
    if(!phone) return alert("No phone number saved for this user");
    const clean = phone.replace(/\D/g, '');
    const msg = encodeURIComponent(`🚨 *Pharmacy Task Reminder*\n\nHello, the task: *"${task}"* is still incomplete. Please finish it as soon as possible.`);
    window.open(`https://wa.me/${clean}?text=${msg}`, '_blank');
}

function updateProfile(key, val) {
    if(!val) return;
    state.session[key] = val;
    const idx = state.users.findIndex(u => u.id === state.session.id);
    state.users[idx][key] = val;
    save(); showToast("Updated Successfully");
}

function markNotifRead(id) {
    const n = state.notifications.find(x => x.id === id);
    if(n) n.read = true;
    save(); render();
}

function clearNotifs() { state.notifications = []; save(); render(); }

async function syncCloudManually() {
    showToast("☁️ Syncing with Cloud...");
    try {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncDatabase', database: state }) });
        showToast("✅ Cloud Sync Success");
    } catch(e) { showToast("❌ Sync Error"); }
}

function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function resetSystem() { if(confirm("WIPE ALL DATA?")) { localStorage.clear(); location.reload(); } }

function exportExcel() {
    const ws = XLSX.utils.json_to_sheet(state.tasks);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Tasks");
    XLSX.writeFile(wb, "Pharmacy_V8_7_Report.xlsx");
}
</script>
