<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V7 | Pro</title>
    <!-- External Dependencies -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #1e293b;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
            --muted: #94a3b8; --line: #334155; --sidebar: #020617;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Layout Structure */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid #334155; letter-spacing: 1px; }
        .sidebar-header span { color: var(--primary); }
        
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--primary); color: white; }
        .nav-item i { width: 20px; text-align: center; font-size: 1.1rem; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        
        /* Top Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-shrink: 0; }
        .page-title h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        .page-title p { margin: 5px 0 0; color: var(--muted); font-size: 0.85rem; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; }
        .stat-info span { font-size: 0.75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-info h2 { margin: 5px 0 0; font-size: 1.7rem; font-weight: 800; }
        .stat-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* Dashboard Grid */
        .content-grid { display: grid; grid-template-columns: 1fr 380px; gap: 25px; }
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .panel-header h3 { margin: 0; font-size: 1.1rem; }

        /* Tables */
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--muted); font-size: 0.8rem; font-weight: 700; border-bottom: 2px solid var(--line); text-transform: uppercase; }
        td { padding: 15px 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .bg-high { background: #fee2e2; color: #b91c1c; }
        .bg-med { background: #fef3c7; color: #b45309; }
        .bg-low { background: #dcfce7; color: #15803d; }
        .bg-done { background: #e0e7ff; color: #4338ca; }

        /* AI Sidebar */
        .ai-chat { display: flex; flex-direction: column; height: 500px; }
        .chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; max-width: 85%; position: relative; }
        .msg.bot { background: var(--bg); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input { display: flex; gap: 10px; padding-top: 15px; border-top: 1px solid var(--line); }
        .chat-input input { flex: 1; padding: 10px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; place-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal h2 { margin-top: 0; font-size: 1.4rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }

        /* Buttons */
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
        .btn-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--muted); border: 1px solid var(--line); cursor: pointer; }
        .btn-icon:hover { color: var(--primary); border-color: var(--primary); }

        /* Progress Bar */
        .progress-container { width: 100%; background: var(--bg); height: 8px; border-radius: 10px; margin-top: 5px; }
        .progress-bar { height: 100%; background: var(--primary); border-radius: 10px; }

        @media (max-width: 1100px) {
            .content-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .sidebar { width: 80px; }
            .sidebar span, .sidebar-header b { display: none; }
            .nav-item { justify-content: center; }
            .nav-item i { margin: 0; font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div id="app-shell"></div>

<!-- Create Task Modal -->
<div class="modal-overlay" id="modal-task">
    <div class="modal">
        <h2>Create New Task</h2>
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="f-task-title" placeholder="e.g. Website Maintenance">
        </div>
        <div class="form-group">
            <label>Assigned To</label>
            <select id="f-task-assignee"></select>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div class="form-group">
                <label>Priority</label>
                <select id="f-task-priority">
                    <option value="HIGH">High</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="LOW">Low</option>
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="f-task-date">
            </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-secondary" style="flex:1" onclick="closeModals()">Cancel</button>
            <button class="btn btn-primary" style="flex:1" onclick="submitTask()">Save Task</button>
        </div>
    </div>
</div>

<!-- Employee Modal -->
<div class="modal-overlay" id="modal-emp">
    <div class="modal">
        <h2>Add New Employee</h2>
        <div class="form-group">
            <label>Employee Name</label>
            <input type="text" id="f-emp-name" placeholder="Enter full name">
        </div>
        <div class="form-group">
            <label>Role</label>
            <input type="text" id="f-emp-role" placeholder="e.g. Senior Developer">
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-secondary" style="flex:1" onclick="closeModals()">Cancel</button>
            <button class="btn btn-primary" style="flex:1" onclick="submitEmployee()">Add Employee</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// DATA & STATE MANAGEMENT
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const LOCAL_KEY = "AMBA_V7_FINAL";

let state = JSON.parse(localStorage.getItem(LOCAL_KEY)) || {
    tasks: [],
    employees: [{id: 'e1', name: 'Admin User', role: 'Manager'}],
    masterTasks: [
        {id: 'm1', title: 'Weekly Server Check', priority: 'HIGH'},
        {id: 'm2', title: 'Monthly Payroll', priority: 'MEDIUM'}
    ],
    recurringTasks: [],
    notifications: [],
    view: 'dashboard',
    darkMode: false
};

const saveState = () => {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
    syncWithCloud();
};

async function syncWithCloud() {
    try {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncDatabase', database: state }) });
    } catch(e) { console.warn("Offline: Data saved locally only."); }
}

// ==========================================
// CORE RENDERING ENGINE
// ==========================================
function render() {
    const shell = document.getElementById('app-shell');
    document.body.className = state.darkMode ? 'dark' : '';

    shell.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">AMBA <b>AI</b> <span>V7</span></div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')">
                        <i class="fas fa-grid-2"></i> <span>Dashboard</span>
                    </div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')">
                        <i class="fas fa-list-check"></i> <span>Task List</span>
                    </div>
                    <div class="nav-item ${state.view==='master'?'active':''}" onclick="nav('master')">
                        <i class="fas fa-layer-group"></i> <span>Master Tasks</span>
                    </div>
                    <div class="nav-item ${state.view==='recurring'?'active':''}" onclick="nav('recurring')">
                        <i class="fas fa-arrows-rotate"></i> <span>Recurring</span>
                    </div>
                    <div class="nav-item ${state.view==='employees'?'active':''}" onclick="nav('employees')">
                        <i class="fas fa-user-tie"></i> <span>Employees</span>
                    </div>
                    <div class="nav-item ${state.view==='reports'?'active':''}" onclick="nav('reports')">
                        <i class="fas fa-chart-line"></i> <span>Reports</span>
                    </div>
                    <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;">
                    <div class="nav-item" onclick="toggleTheme()">
                        <i class="fas fa-circle-half-stroke"></i> <span>Theme</span>
                    </div>
                    <div class="nav-item" onclick="exportData()">
                        <i class="fas fa-file-excel"></i> <span>Export Excel</span>
                    </div>
                </nav>
            </aside>

            <main class="main-content">
                <header class="top-bar">
                    <div class="page-title">
                        <h1>${getViewTitle()}</h1>
                        <p>${new Date().toDateString()}</p>
                    </div>
                    <div style="display:flex; gap:12px;">
                        <button class="btn btn-primary" onclick="openTaskModal()">
                            <i class="fas fa-plus"></i> New Task
                        </button>
                    </div>
                </header>

                <div id="view-mount"></div>
            </main>
        </div>
    `;
    renderActiveView();
}

function nav(v) { state.view = v; render(); }
function toggleTheme() { state.darkMode = !state.darkMode; render(); }

function getViewTitle() {
    const titles = { dashboard: 'Overview', tasks: 'Task Management', master: 'Master Templates', employees: 'Team Directory', reports: 'Performance Analytics', recurring: 'Scheduled Automation' };
    return titles[state.view] || 'Amba AI';
}

// ==========================================
// VIEW: DASHBOARD
// ==========================================
function renderActiveView() {
    const mount = document.getElementById('view-mount');
    
    if (state.view === 'dashboard') {
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info"><span>Total Projects</span><h2>${state.tasks.length}</h2></div>
                    <div class="stat-icon" style="background:#e0e7ff; color:#4338ca;"><i class="fas fa-briefcase"></i></div>
                </div>
                <div class="stat-card">
                    <div class="stat-info"><span>In Progress</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                    <div class="stat-icon" style="background:#fef3c7; color:#b45309;"><i class="fas fa-spinner"></i></div>
                </div>
                <div class="stat-card">
                    <div class="stat-info"><span>Completed</span><h2>${state.tasks.filter(t=>t.status==='DONE').length}</h2></div>
                    <div class="stat-icon" style="background:#dcfce7; color:#15803d;"><i class="fas fa-circle-check"></i></div>
                </div>
                <div class="stat-card">
                    <div class="stat-info"><span>Team Size</span><h2>${state.employees.length}</h2></div>
                    <div class="stat-icon" style="background:#fce7f3; color:#be185d;"><i class="fas fa-users"></i></div>
                </div>
            </div>

            <div class="content-grid">
                <div class="panel">
                    <div class="panel-header"><h3>Recent Activity</h3><button class="btn-secondary btn" onclick="nav('tasks')">View All</button></div>
                    <div class="table-container">
                        <table>
                            <thead><tr><th>Task</th><th>Assignee</th><th>Priority</th><th>Action</th></tr></thead>
                            <tbody>${renderTaskRows(state.tasks.slice(0, 8))}</tbody>
                        </table>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-header"><h3>AI Copilot</h3></div>
                    <div class="ai-chat">
                        <div class="chat-window" id="chat-win">
                            <div class="msg bot">Ready to assist. Try: "Assign server check to Rahul tomorrow"</div>
                        </div>
                        <div class="chat-input">
                            <input type="text" id="ai-in" placeholder="Command AI..." onkeypress="if(event.key==='Enter') handleAI()">
                            <button class="btn-primary btn" onclick="handleAI()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    } 
    else if (state.view === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <div class="panel-header">
                    <input type="text" placeholder="Search tasks..." class="btn-secondary btn" style="width:300px" oninput="filterTasks(this.value)">
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Status</th><th>Task Detail</th><th>Priority</th><th>Due Date</th><th>Actions</th></tr></thead>
                        <tbody id="task-body">${renderTaskRows(state.tasks)}</tbody>
                    </table>
                </div>
            </div>
        `;
    }
    else if (state.view === 'employees') {
        mount.innerHTML = `
            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px;">
                ${state.employees.map(e => {
                    const count = state.tasks.filter(t => t.userId === e.id && t.status !== 'DONE').length;
                    return `
                    <div class="panel">
                        <div style="display:flex; gap:15px; align-items:center;">
                            <div style="width:50px; height:50px; border-radius:50%; background:var(--primary); color:white; display:grid; place-items:center; font-weight:800;">${e.name[0]}</div>
                            <div><h3 style="margin:0">${e.name}</h3><small class="muted">${e.role}</small></div>
                        </div>
                        <div style="margin-top:20px;">
                            <div style="display:flex; justify-content:space-between; font-size:0.8rem; font-weight:700;"><span>Workload</span><span>${count} Active</span></div>
                            <div class="progress-container"><div class="progress-bar" style="width:${Math.min(count*20, 100)}%; background:${count > 4 ? 'var(--danger)' : 'var(--success)'}"></div></div>
                        </div>
                        <button class="btn btn-secondary" style="width:100%; margin-top:15px;" onclick="deleteEmployee('${e.id}')">Remove Member</button>
                    </div>`;
                }).join('')}
                <div class="panel" style="display:grid; place-items:center; border:2px dashed var(--line); cursor:pointer;" onclick="openEmpModal()">
                    <div style="text-align:center;"><i class="fas fa-plus" style="font-size:1.5rem; color:var(--muted)"></i><p>Add Member</p></div>
                </div>
            </div>
        `;
    }
    else if (state.view === 'reports') {
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info"><span>Total Efficiency</span><h2>${calculateEfficiency()}%</h2></div>
                </div>
            </div>
            <div class="panel">
                <h3>Employee Productivity</h3>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Employee</th><th>Completed</th><th>Pending</th><th>Progress</th></tr></thead>
                        <tbody>
                            ${state.employees.map(e => {
                                const done = state.tasks.filter(t => t.userId === e.id && t.status === 'DONE').length;
                                const pending = state.tasks.filter(t => t.userId === e.id && t.status !== 'DONE').length;
                                const perc = (done + pending) === 0 ? 0 : Math.round((done / (done + pending)) * 100);
                                return `<tr>
                                    <td><b>${e.name}</b></td>
                                    <td style="color:var(--success)">${done}</td>
                                    <td style="color:var(--danger)">${pending}</td>
                                    <td><div class="progress-container" style="width:150px"><div class="progress-bar" style="width:${perc}%"></div></div></td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }
    else if (state.view === 'master') {
        mount.innerHTML = `
            <div class="panel">
                <div class="panel-header"><h3>Task Templates</h3><button class="btn btn-primary" onclick="addMasterTemplate()">+ Create Template</button></div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Template Name</th><th>Default Priority</th><th>Action</th></tr></thead>
                        <tbody>
                            ${state.masterTasks.map(m => `
                                <tr>
                                    <td><b>${m.title}</b></td>
                                    <td><span class="badge bg-${m.priority.toLowerCase().slice(0,3)}">${m.priority}</span></td>
                                    <td><button class="btn btn-primary" onclick="applyTemplate('${m.id}')">Use Template</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }
    else if (state.view === 'recurring') {
        mount.innerHTML = `
            <div class="panel">
                <div class="panel-header"><h3>Automated Schedules</h3></div>
                <div class="form-group" style="display:flex; gap:10px;">
                    <input type="text" id="rec-title" placeholder="Recurring Task Title">
                    <select id="rec-freq"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option></select>
                    <button class="btn btn-primary" onclick="submitRecurring()">Schedule</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Task</th><th>Frequency</th><th>Last Run</th><th>Action</th></tr></thead>
                        <tbody>
                            ${state.recurringTasks.map(r => `
                                <tr>
                                    <td><b>${r.title}</b></td>
                                    <td><span class="badge bg-done">${r.frequency}</span></td>
                                    <td>${r.lastRun || 'Never'}</td>
                                    <td><button class="btn-icon" onclick="deleteRecurring('${r.id}')"><i class="fas fa-trash"></i></button></td>
                                </tr>
                            `).join('') || '<tr><td colspan="4" class="muted" style="text-align:center">No recurring tasks set.</td></tr>'}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }
}

// ==========================================
// LOGIC: TASKS
// ==========================================
function renderTaskRows(arr) {
    return arr.map(t => {
        const emp = state.employees.find(e => e.id === t.userId);
        return `
        <tr>
            <td><input type="checkbox" ${t.status==='DONE'?'checked':''} onclick="toggleTask('${t.id}')"></td>
            <td>
                <span style="${t.status==='DONE'?'text-decoration:line-through; color:var(--muted)':''}; font-weight:600;">${t.title}</span><br>
                <small class="muted">${emp ? emp.name : 'Unassigned'}</small>
            </td>
            <td><span class="badge bg-${t.priority.toLowerCase().slice(0,3)}">${t.priority}</span></td>
            <td><i class="far fa-calendar-alt" style="margin-right:5px"></i> ${t.date || 'TBD'}</td>
            <td>
                <button class="btn-icon" onclick="deleteTask('${t.id}')"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`;
    }).join('');
}

function openTaskModal() {
    const sel = document.getElementById('f-task-assignee');
    sel.innerHTML = state.employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    document.getElementById('modal-task').classList.add('active');
}

function submitTask() {
    const title = document.getElementById('f-task-title').value;
    if (!title) return;
    state.tasks.unshift({
        id: 't' + Date.now(),
        title,
        userId: document.getElementById('f-task-assignee').value,
        priority: document.getElementById('f-task-priority').value,
        date: document.getElementById('f-task-date').value,
        status: 'TODO'
    });
    saveState(); closeModals(); render();
}

function toggleTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
    saveState(); render();
}

function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveState(); render();
}

// ==========================================
// LOGIC: EMPLOYEES
// ==========================================
function openEmpModal() { document.getElementById('modal-emp').classList.add('active'); }
function submitEmployee() {
    const name = document.getElementById('f-emp-name').value;
    const role = document.getElementById('f-emp-role').value;
    if(!name) return;
    state.employees.push({ id: 'e' + Date.now(), name, role });
    saveState(); closeModals(); render();
}
function deleteEmployee(id) {
    state.employees = state.employees.filter(e => e.id !== id);
    saveState(); render();
}

// ==========================================
// LOGIC: MASTER & RECURRING
// ==========================================
function applyTemplate(id) {
    const m = state.masterTasks.find(x => x.id === id);
    state.tasks.unshift({
        id: 't' + Date.now(),
        title: m.title,
        userId: 'e1',
        priority: m.priority,
        date: new Date().toISOString().split('T')[0],
        status: 'TODO'
    });
    saveState(); nav('tasks');
}

function submitRecurring() {
    const title = document.getElementById('rec-title').value;
    const freq = document.getElementById('rec-freq').value;
    if(!title) return;
    state.recurringTasks.push({ id: 'r'+Date.now(), title, frequency: freq, lastRun: null });
    saveState(); render();
}

function runRecurringEngine() {
    const today = new Date().toDateString();
    let updated = false;
    state.recurringTasks.forEach(r => {
        if (r.lastRun !== today) {
            state.tasks.unshift({
                id: 'tr' + Date.now() + Math.random(),
                title: "[AUTO] " + r.title,
                userId: 'e1',
                priority: 'MEDIUM',
                date: new Date().toISOString().split('T')[0],
                status: 'TODO'
            });
            r.lastRun = today;
            updated = true;
        }
    });
    if(updated) saveState();
}

// ==========================================
// AI ENGINE
// ==========================================
function handleAI() {
    const input = document.getElementById('ai-in');
    const win = document.getElementById('chat-win');
    if(!input.value) return;

    const cmd = input.value.toLowerCase();
    win.innerHTML += `<div class="msg user">${input.value}</div>`;
    
    let resp = "I'm not sure how to help with that. Try 'add task [name]'";
    
    if (cmd.includes("add task") || cmd.includes("create")) {
        const title = cmd.replace("add task", "").replace("create", "").trim();
        state.tasks.unshift({ id: 'tai'+Date.now(), title, userId: 'e1', priority: 'MEDIUM', status: 'TODO', date: new Date().toISOString().split('T')[0]});
        resp = `Done! Created task: <b>${title}</b>`;
        saveState();
    } else if (cmd.includes("status")) {
        resp = `You have ${state.tasks.filter(t=>t.status!=='DONE').length} pending tasks.`;
    }

    setTimeout(() => {
        win.innerHTML += `<div class="msg bot">${resp}</div>`;
        win.scrollTop = win.scrollHeight;
    }, 600);
    input.value = '';
}

// ==========================================
// UTILS
// ==========================================
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }
function calculateEfficiency() {
    const done = state.tasks.filter(t => t.status === 'DONE').length;
    return state.tasks.length === 0 ? 0 : Math.round((done / state.tasks.length) * 100);
}
function exportData() {
    const ws = XLSX.utils.json_to_sheet(state.tasks);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Tasks");
    XLSX.writeFile(wb, "Amba_V7_Report.xlsx");
}

// Initialize
runRecurringEngine();
render();
</script>
