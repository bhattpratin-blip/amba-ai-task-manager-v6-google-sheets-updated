<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Management v9.5 PRO</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #10b981; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; --m: #64748b; --l: #e2e8f0; --s: #064e3b; --d: #ef4444; --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        body { margin: 0; background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; overflow: hidden; background-size: cover; background-position: center; transition: 0.3s; }
        .auth-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: linear-gradient(135deg, #10b981 0%, #064e3b 100%); position: fixed; inset: 0; z-index: 9999; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
        .app-container { display: flex; height: 100vh; width: 100vw; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); }
        .sidebar { width: 260px; background: var(--s); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .nav-links { flex: 1; padding: 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--p); color: white; }
        .main-content { flex: 1; padding: 25px; overflow-y: auto; }
        .panel { background: var(--c); border-radius: 16px; border: 1px solid var(--l); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--c); padding: 15px; border-radius: 12px; border: 1px solid var(--l); text-align: center; }
        .btn { padding: 10px 15px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-p { background: var(--p); color: white; }
        .btn-danger { background: var(--d); color: white; }
        .btn-wa { background: #25d366; color: white; padding: 5px 8px; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--l); }
        .notif-bell { position: relative; cursor: pointer; font-size: 1.2rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--d); color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--c); padding: 25px; border-radius: 20px; width: 400px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--l); outline: none; }
        #toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; z-index: 3000; }
    </style>
</head>
<body onload="init()">
<div id="app-root"></div>
<div id="toast"></div>

<!-- Modal Templates -->
<div class="modal-overlay" id="modal-task">
    <div class="modal"><h2>Assign Task</h2><input id="f-t-title" placeholder="Description"><select id="f-t-user"></select><input type="date" id="f-t-date"><button class="btn btn-p" style="width:100%" onclick="saveTask()">Save Task</button><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal('modal-task')">Cancel</button></div>
</div>
<div class="modal-overlay" id="modal-user">
    <div class="modal"><h2>Add Staff</h2><input id="f-u-name" placeholder="Name"><input id="f-u-email" placeholder="Email"><input id="f-u-pass" type="password" placeholder="Password"><input id="f-u-phone" placeholder="WhatsApp (91...)"><button class="btn btn-p" style="width:100%" onclick="saveUser()">Create</button><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal('modal-user')">Cancel</button></div>
</div>

<script>
    const API_URL = "PASTE_YOUR_SCRIPT_URL_HERE"; 
    const STORAGE_KEY = "PHARMACY_V9_5_MASTER";
    const RECOVERY_KEY = "PHARMA2024";

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        tasks: [], users: [], masterTasks: [], recurringTasks: [], notifications: [], session: null, settings: { darkMode: false, sync: true, view: 'dashboard', wallpaper: '' }
    };

    const save = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if(state.settings.sync && state.session) {
            fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'syncDatabase', database: state }) });
        }
    };

    // --- AUTOMATION & NOTIFICATION ENGINE ---
    function runEngines() {
        const todayStr = new Date().toDateString();
        let changed = false;

        // 1. Recurring Task Generator
        state.recurringTasks.forEach(r => {
            if (r.lastRun !== todayStr) {
                state.tasks.unshift({ id: 'rt'+Date.now(), title: "[AUTO] "+r.title, userId: state.session.id, status: 'TODO', date: new Date().toISOString().split('T')[0] });
                r.lastRun = todayStr;
                state.notifications.unshift({ id: Date.now(), text: "🔄 Daily task generated: " + r.title, read: false, time: new Date().toLocaleTimeString() });
                changed = true;
            }
        });

        // 2. Overdue Check
        const now = new Date();
        now.setHours(0,0,0,0);
        state.tasks.forEach(t => {
            if (t.status !== 'DONE' && t.date && new Date(t.date) < now && t.lastAlerted !== todayStr) {
                state.notifications.unshift({ id: Date.now()+1, text: "🚨 OVERDUE: " + t.title, read: false, time: new Date().toLocaleTimeString() });
                t.lastAlerted = todayStr;
                changed = true;
            }
        });

        if(changed) save();
    }

    function init() {
        if(state.session) runEngines();
        if(state.settings.wallpaper) document.body.style.backgroundImage = `url(${state.settings.wallpaper})`;
        render();
    }

    // --- AUTH ---
    function handleSetup() {
        const u = { id: 'u1', name: document.getElementById('s-name').value, email: document.getElementById('s-email').value, password: document.getElementById('s-pass').value, role: 'Admin' };
        state.users.push(u); state.session = u; save(); init();
    }
    function handleLogin() {
        const u = state.users.find(x => x.email === document.getElementById('l-email').value && x.password === document.getElementById('l-pass').value);
        if(u) { state.session = u; save(); init(); } else alert("Access Denied");
    }
    function handleForgot() {
        const u = state.users.find(x => x.email === prompt("Email:"));
        if(u && prompt("Recovery Key:") === RECOVERY_KEY) { u.password = prompt("New Pass:"); save(); alert("Success"); }
    }

    // --- NAVIGATION ---
    function nav(v) { state.settings.view = v; render(); }

    function render() {
        const root = document.getElementById('app-root');
        if (state.users.length === 0) {
            root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>🛡️ System Setup</h1><input id="s-name" placeholder="Admin Name"><input id="s-email" placeholder="Admin Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleSetup()">Initialize</button></div></div>`;
            return;
        }
        if (!state.session) {
            root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>💊 Pharmacy Login</h1><input id="l-email" placeholder="Email"><input id="l-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleLogin()">Login</button><p onclick="handleForgot()" style="cursor:pointer;font-size:0.8rem;margin-top:10px">Forgot Password?</p></div></div>`;
            return;
        }

        const unread = state.notifications.filter(n => !n.read).length;
        root.innerHTML = `
            <div class="app-container">
                <aside class="sidebar">
                    <div class="sidebar-profile">
                        <img src="${state.session.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="profile-img"><br>
                        <b>${state.session.name}</b>
                    </div>
                    <nav class="nav-links">
                        <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
                        <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list"></i> Tasks</div>
                        <div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-users"></i> Staff</div>
                        <div class="nav-item ${state.settings.view==='templates'?'active':''}" onclick="nav('templates')"><i class="fas fa-copy"></i> Templates</div>
                        <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> Settings</div>
                    </nav>
                    <div style="padding:20px"><button class="btn btn-danger" style="width:100%" onclick="state.session=null;save();render();">Logout</button></div>
                </aside>
                <main class="main-content">
                    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
                        <h1 style="text-transform:uppercase">${state.settings.view}</h1>
                        <div style="display:flex; gap:15px; align-items:center">
                            <div class="notif-bell" onclick="nav('dashboard')"><i class="fas fa-bell"></i>${unread ? `<span class="notif-badge">${unread}</span>` : ''}</div>
                            <button class="btn btn-p" onclick="openTaskModal()">+ New Task</button>
                        </div>
                    </header>
                    <div id="view-mount"></div>
                </main>
            </div>`;
        renderView();
    }

    function renderView() {
        const mount = document.getElementById('view-mount');
        const v = state.settings.view;
        if(v === 'dashboard') {
            mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><span>Pending</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                <div class="stat-card"><span>Staff</span><h2>${state.users.length}</h2></div>
                <div class="stat-card"><span>Templates</span><h2>${state.masterTasks.length}</h2></div>
                <div class="stat-card"><span>Sync</span><p>${state.settings.sync?'ON':'OFF'}</p></div>
            </div>
            <div class="panel"><h3>Notifications</h3>
                ${state.notifications.slice(0,5).map(n => `<div style="padding:10px; border-bottom:1px solid var(--l); ${n.read?'opacity:0.5':''}"><b>${n.text}</b><br><small>${n.time}</small></div>`).join('') || 'No alerts'}
                <button class="btn" style="margin-top:10px" onclick="state.notifications=[];save();render();">Clear All</button>
            </div>`;
        } else if(v === 'tasks') {
            mount.innerHTML = `<div class="panel"><table><thead><tr><th>Task</th><th>Staff</th><th>Action</th></tr></thead><tbody>
            ${state.tasks.map(t => `<tr><td>${t.title}<br><small>${t.date || ''}</small></td><td>${state.users.find(u=>u.id===t.userId)?.name || '-'}</td><td>
            <button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button>
            ${t.status!=='DONE' && state.users.find(u=>u.id===t.userId)?.phone ? `<button class="btn-wa" onclick="wa('${state.users.find(u=>u.id===t.userId).phone}','${t.title}')"><i class="fab fa-whatsapp"></i></button>` : ''}
            <button onclick="delTask('${t.id}')" style="color:red;background:none;border:none"><i class="fas fa-trash"></i></button></td></tr>`).join('')}
            </tbody></table></div>`;
        } else if(v === 'staff') {
            mount.innerHTML = `<button class="btn btn-p" style="margin-bottom:15px" onclick="openModal('modal-user')">+ Add Staff</button><div class="panel"><table><thead><tr><th>Name</th><th>Phone</th><th>Action</th></tr></thead><tbody>
            ${state.users.map(u => `<tr><td>${u.name}</td><td>${u.phone||'-'}</td><td><button onclick="delUser('${u.id}')" style="color:red;background:none;border:none"><i class="fas fa-trash"></i></button></td></tr>`).join('')}
            </tbody></table></div>`;
        } else if(v === 'templates') {
            mount.innerHTML = `
            <div class="panel"><h3>Daily Automations (Recurring)</h3>
                <input id="rec-title" placeholder="Daily Task Name"><button class="btn btn-p" onclick="addRec()">Add Daily</button>
                ${state.recurringTasks.map(r => `<div style="padding:10px; border-bottom:1px solid var(--l)">🔄 ${r.title} <button onclick="delRec('${r.id}')" style="float:right;color:red;background:none;border:none"><i class="fas fa-times"></i></button></div>`).join('')}
            </div>
            <div class="panel"><h3>Master Templates</h3>
                <input id="mas-title" placeholder="Template Name"><button class="btn btn-p" onclick="addMas()">Create Template</button>
                ${state.masterTasks.map(m => `<div style="padding:10px; border-bottom:1px solid var(--l)">📄 ${m.title} <button class="btn btn-p" style="float:right;padding:2px 8px" onclick="applyMas('${m.id}')">Apply</button></div>`).join('')}
            </div>`;
        } else if(v === 'settings') {
            mount.innerHTML = `<div class="panel"><h3>Customization</h3>
                <label>Wallpaper URL</label><input id="w-url" value="${state.settings.wallpaper
