<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Manager V8.5</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981; --primary-hover: #059669;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #064e3b;
            --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        /* Login Screen */
        .login-screen { height: 100vh; display: grid; place-items: center; background: #f1f5f9; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: var(--primary); margin: 0 0 10px; font-size: 1.5rem; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--line); }

        /* Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.1rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--line); }
        tr:hover { background: rgba(0,0,0,0.02); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; box-shadow: var(--shadow); }
        .modal input, .modal select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h2>Add New Task</h2>
        <input type="text" id="f-title" placeholder="Task details...">
        <select id="f-emp"></select>
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">Save Task</button>
        <button onclick="closeModal('task-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- Employee Modal -->
<div class="modal-overlay" id="emp-modal">
    <div class="modal">
        <h2>Add Employee</h2>
        <input type="text" id="fe-name" placeholder="Full Name">
        <input type="text" id="fe-phone" placeholder="WhatsApp Number (e.g. 919876543210)">
        <input type="text" id="fe-role" placeholder="Role (e.g. Pharmacist)">
        <button class="btn btn-primary" onclick="addEmployee()" style="width:100%">Save Employee</button>
        <button onclick="closeModal('emp-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. DATA STATE
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const STORAGE_KEY = "PHARMACY_MANAGER_V8_5";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    employees: [{id: 'e1', name: 'Pharmacist Admin', phone: '', role: 'Admin'}],
    session: null,
    settings: { darkMode: false, syncEnabled: true },
    view: 'dashboard'
};

const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(state.settings.syncEnabled) syncCloud();
};

async function syncCloud() {
    try {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncDatabase', database: state }) });
    } catch(e) { console.warn("Sync Offline"); }
}

// ==========================================
// 2. AUTHENTICATION & NAV
// ==========================================
function init() { render(); }

function handleLogin() {
    const user = document.getElementById('log-user').value;
    const pass = document.getElementById('log-pass').value;
    if(user === "admin" && pass === "123") {
        state.session = "admin";
        save(); render();
    } else alert("Invalid Login");
}

function logout() {
    state.session = null;
    save(); render();
}

function nav(v) { state.view = v; render(); }

// ==========================================
// 3. UI RENDERING
// ==========================================
function render() {
    const root = document.getElementById('app-root');

    if (!state.session) {
        root.innerHTML = `
            <div class="login-screen">
                <div class="login-card">
                    <h1>Pharmacy Task Manager</h1>
                    <input type="text" id="log-user" placeholder="User (admin)" value="admin">
                    <input type="password" id="log-pass" placeholder="Password (123)" value="123">
                    <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button>
                </div>
            </div>`;
        return;
    }

    document.body.className = state.settings.darkMode ? 'dark' : '';
    root.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">PHARMACY MANAGER</div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-tasks"></i> <span>Task List</span></div>
                    <div class="nav-item ${state.view==='team'?'active':''}" onclick="nav('team')"><i class="fas fa-users"></i> <span>Employees</span></div>
                    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer">
                    <button class="btn-danger btn" style="width:100%" onclick="logout()">Logout</button>
                </div>
            </aside>
            <main class="main-content">
                <header class="top-bar">
                    <h1>${state.view.toUpperCase()}</h1>
                    <button class="btn btn-primary" onclick="showTaskModal()">+ New Task</button>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>
    `;
    renderView();
}

function renderView() {
    const mount = document.getElementById('view-mount');
    
    if (state.view === 'dashboard') {
        const pending = state.tasks.filter(t=>t.status!=='DONE').length;
        mount.innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div class="panel"><h2>${pending}</h2><p>Pending Tasks</p></div>
                <div class="panel"><h2>${state.employees.length}</h2><p>Team Members</p></div>
            </div>
            <div class="panel"><h3>Quick Sync</h3><button class="btn btn-primary" onclick="syncCloud()">Sync Now with Google Sheet</button></div>
        `;
    } 
    else if (state.view === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Task</th><th>Assigned To</th><th>Status</th><th>Notify</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => {
                            const emp = state.employees.find(e => e.id === t.empId);
                            return `
                            <tr>
                                <td>${t.title}</td>
                                <td>${emp ? emp.name : 'Unassigned'}</td>
                                <td><button class="btn" onclick="toggleTask('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                                <td>
                                    ${t.status!=='DONE' && emp && emp.phone ? 
                                    `<button class="btn btn-whatsapp" onclick="sendWhatsApp('${emp.phone}', '${t.title}')"><i class="fab fa-whatsapp"></i></button>` : '-'}
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (state.view === 'team') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Employee List</h3>
                <button class="btn btn-primary" onclick="showEmpModal()">+ Add Employee</button>
            </div>
            <div class="panel">
                <table>
                    <thead><tr><th>Name</th><th>Role</th><th>WhatsApp</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.employees.map(e => `
                            <tr>
                                <td>${e.name}</td>
                                <td>${e.role}</td>
                                <td>${e.phone || 'N/A'}</td>
                                <td><button class="btn-danger btn" style="padding:5px" onclick="deleteEmp('${e.id}')">Delete</button></td>
                            </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (state.view === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:400px;">
                <h3>System Settings</h3>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <span>Google Sheets Sync</span>
                    <button class="btn btn-primary" onclick="state.settings.syncEnabled = !state.settings.syncEnabled; save(); render();">
                        ${state.settings.syncEnabled ? 'ENABLED' : 'DISABLED'}
                    </button>
                </div>
                <button class="btn btn-primary" style="width:100%" onclick="state.settings.darkMode = !state.settings.darkMode; save(); render();">Toggle Dark Mode</button>
            </div>`;
    }
}

// ==========================================
// 4. LOGIC FUNCTIONS
// ==========================================
function showTaskModal() {
    document.getElementById('f-emp').innerHTML = state.employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    document.getElementById('task-modal').classList.add('active');
}
function showEmpModal() { document.getElementById('emp-modal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function addTask() {
    const title = document.getElementById('f-title').value;
    const empId = document.getElementById('f-emp').value;
    if(!title) return;
    state.tasks.unshift({ id: 't'+Date.now(), title, empId, status: 'TODO' });
    save(); closeModal('task-modal'); render();
}

function addEmployee() {
    const name = document.getElementById('fe-name').value;
    const phone = document.getElementById('fe-phone').value;
    const role = document.getElementById('fe-role').value;
    if(!name) return;
    state.employees.push({ id: 'e'+Date.now(), name, phone, role });
    save(); closeModal('emp-modal'); render();
}

function deleteEmp(id) {
    state.employees = state.employees.filter(e => e.id !== id);
    save(); render();
}

function toggleTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) { t.status = t.status === 'DONE' ? 'TODO' : 'DONE'; save(); render(); }
}

function sendWhatsApp(phone, task) {
    const msg = encodeURIComponent(`Hello, your task "${task}" is still incomplete. Please finish it as soon as possible.`);
    window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}
</script>
</body>
</html>
