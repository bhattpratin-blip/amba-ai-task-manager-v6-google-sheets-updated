<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI V7.0 | Business Intelligence</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div style="padding: 25px; font-size: 1.4rem; font-weight: 800; color: #6366f1;">AMBA V7.0</div>
        <div style="padding: 10px;">
            <div onclick="setView('dashboard')" class="nav-item">📊 Dashboard</div>
            <div onclick="setView('master')" class="nav-item">📚 Task Manager</div>
            <div onclick="setView('employees')" class="nav-item">👥 Team & Workload</div>
            <div onclick="setView('reports')" class="nav-item">📈 Reports</div>
            <div onclick="setView('settings')" class="nav-item">⚙️ Settings</div>
        </div>
    </nav>

    <main class="main-content">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <div>
                <h1 id="view-title" style="margin:0;">Dashboard</h1>
                <div class="sync-indicator"><span class="dot online"></span> Cloud Synced</div>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="globalSearch" placeholder="Quick search..." oninput="refreshCurrentView()" style="padding:10px; border-radius:8px; border:1px solid #ddd;">
                <button class="btn-ai" onclick="toggleAI()">🤖 AI Assistant</button>
                <button class="btn-primary" onclick="openTaskModal()">+ New Task</button>
            </div>
        </header>

        <div id="content-area"></div>
    </main>

    <!-- Task Modal -->
    <div id="taskModal" class="modal-overlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; place-items:center; z-index:2000;">
        <div style="background:white; padding:30px; border-radius:15px; width:450px; box-shadow:var(--shadow);">
            <h2 id="modalTitle">Create Task</h2>
            <form id="taskForm">
                <input type="hidden" id="editId">
                <label>Task Title</label><input type="text" id="tTitle" required style="width:100%; padding:10px; margin:8px 0;">
                <label>Category/Dept</label>
                <select id="tDept" style="width:100%; padding:10px; margin:8px 0;">
                    <option>Pharmacy</option><option>Admin</option><option>Cleaning</option><option>IT/Maintenance</option>
                </select>
                <label>Assign To</label><select id="tAssign" style="width:100%; padding:10px; margin:8px 0;"></select>
                <label>Due Date</label><input type="date" id="tDue" style="width:100%; padding:10px; margin:8px 0;">
                <label>Priority</label>
                <select id="tPri" style="width:100%; padding:10px; margin:8px 0;">
                    <option>LOW</option><option selected>MEDIUM</option><option>HIGH</option>
                </select>
                <div style="margin-top:15px; display:flex; gap:10px;">
                    <button type="button" onclick="closeTaskModal()" style="flex:1;">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex:1;">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('amba_v7_db')) || {
            tasks: [],
            users: [
                {id:'u1', name:'Admin', phone:'910000000000', role:'ADMIN'},
                {id:'u2', name:'Rahul', phone:'919999999999', role:'EMPLOYEE'},
                {id:'u3', name:'Amit', phone:'918888888888', role:'EMPLOYEE'}
            ]
        };

        let currentView = 'dashboard';

        function save() { 
            localStorage.setItem('amba_v7_db', JSON.stringify(db)); 
            refreshCurrentView(); 
        }

        function setView(v) { 
            currentView = v; 
            document.getElementById('view-title').innerText = v.charAt(0).toUpperCase() + v.slice(1);
            refreshCurrentView(); 
        }

        function refreshCurrentView() {
            const area = document.getElementById('content-area');
            const search = document.getElementById('globalSearch').value.toLowerCase();
            let tasks = db.tasks.filter(t => t.title.toLowerCase().includes(search));

            if(currentView === 'dashboard') renderDashboard(area, tasks);
            else if(currentView === 'master') renderMaster(area, tasks);
            else if(currentView === 'employees') renderEmployees(area, tasks);
        }

        function renderDashboard(area, tasks) {
            const completed = tasks.filter(t => t.status === 'DONE').length;
            const pending = tasks.length - completed;

            area.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><h3>${tasks.length}</h3><small>Total Tasks</small></div>
                    <div class="stat-card" style="border-color:var(--warning)"><h3>${pending}</h3><small>Pending</small></div>
                    <div class="stat-card" style="border-color:var(--success)"><h3>${completed}</h3><small>Completed</small></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div class="task-table-container" style="padding:20px;">
                        <h3>Live Workload (Team Performance)</h3>
                        <div id="workload-bars"></div>
                    </div>
                    <div class="task-table-container" style="padding:20px;">
                        <h3>Priority Alerts</h3>
                        <div id="priority-list"></div>
                    </div>
                </div>
            `;
            renderWorkload();
        }

        function renderWorkload() {
            const bars = document.getElementById('workload-bars');
            bars.innerHTML = db.users.map(u => {
                const userTasks = db.tasks.filter(t => t.userId === u.id);
                const done = userTasks.filter(t => t.status === 'DONE').length;
                const perc = userTasks.length ? Math.round((done/userTasks.length)*100) : 0;
                return `
                    <div class="workload-item">
                        <div style="display:flex; justify-content:space-between;"><small>${u.name}</small><small>${perc}%</small></div>
                        <div class="bar-bg"><div class="bar-fill" style="width:${perc}%"></div></div>
                    </div>
                `;
            }).join('');
        }

        function renderMaster(area, tasks) {
            area.innerHTML = `
                <div class="task-table-container">
                    <table>
                        <thead><tr><th>Task</th><th>Dept</th><th>Assignee</th><th>Due</th><th>Priority</th><th>Action</th></tr></thead>
                        <tbody>${tasks.map(t => {
                            const u = db.users.find(x => x.id === t.userId);
                            return `
                            <tr>
                                <td><strong>${t.title}</strong></td>
                                <td><span class="pill">${t.dept || 'General'}</span></td>
                                <td>${u?.name}</td>
                                <td>${t.due || '---'}</td>
                                <td><span class="pill ${t.priority.toLowerCase()}">${t.priority}</span></td>
                                <td>
                                    <button class="btn-whatsapp" onclick="sendWA('${t.id}')">📲 Send</button>
                                    <button onclick="toggleTask('${t.id}')">✅</button>
                                </td>
                            </tr>`;
                        }).join('')}</tbody>
                    </table>
                </div>
            `;
        }

        function sendWA(id) {
            const t = db.tasks.find(x => x.id === id);
            const u = db.users.find(x => x.id === t.userId);
            const msg = `*Amba AI Task Alert*%0A*Task:* ${t.title}%0A*Due:* ${t.due}%0A*Priority:* ${t.priority}%0A*Please update status once completed.*`;
            window.open(`https://wa.me/${u.phone}?text=${msg}`);
        }

        function openTaskModal() {
            document.getElementById('tAssign').innerHTML = db.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            document.getElementById('taskModal').style.display = 'grid';
        }

        function closeTaskModal() { document.getElementById('taskModal').style.display = 'none'; }

        document.getElementById('taskForm').onsubmit = (e) => {
            e.preventDefault();
            db.tasks.unshift({
                id: 't'+Date.now(),
                title: document.getElementById('tTitle').value,
                dept: document.getElementById('tDept').value,
                userId: document.getElementById('tAssign').value,
                due: document.getElementById('tDue').value,
                priority: document.getElementById('tPri').value,
                status: 'TODO'
            });
            save(); closeTaskModal();
        };

        function toggleTask(id) {
            const t = db.tasks.find(x => x.id === id);
            t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
            save();
        }

        // Init
        setView('dashboard');
    </script>
</body>
</html>
