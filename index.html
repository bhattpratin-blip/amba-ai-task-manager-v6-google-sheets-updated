<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Manager (Cloud Sync)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --blue-accent: #0056b3; --bg: #ffffff; --text: #333333;
            --light-blue: #f0f7ff; --green: #28a745; --red: #d93025;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Login */
        #login-screen {
            position: fixed; inset: 0; background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box { width: 90%; max-width: 360px; text-align: center; border: 1px solid #eee; padding: 30px; border-radius: 16px; box-shadow: var(--shadow); }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        
        /* Sidebar */
        .sidebar {
            width: 260px; background: #fff; border-right: 1px solid #edf2f7;
            display: flex; flex-direction: column; position: fixed; height: 100vh; transition: 0.3s;
        }
        .sidebar-header { padding: 25px; font-weight: 800; font-size: 1.1rem; color: var(--blue-accent); border-bottom: 1px solid #f7fafc; }
        .nav-item { padding: 14px 25px; color: #4a5568; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; }
        .nav-item:hover, .nav-item.active { background: var(--light-blue); color: var(--blue-accent); font-weight: 600; }
        
        /* Main */
        .main { margin-left: 260px; flex: 1; padding: 30px; max-width: 1100px; }
        .header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .sync-status { font-size: 0.75rem; color: #718096; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e0; }
        .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

        /* Task Cards */
        .task-list { display: flex; flex-direction: column; gap: 15px; }
        .task-item {
            background: white; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .task-info h4 { margin: 0; font-size: 1rem; color: #2d3748; }
        .task-info p { margin: 5px 0 0; font-size: 0.85rem; color: #718096; }
        
        /* Tapping Circle */
        .circle-check {
            width: 40px; height: 40px; border: 2.5px solid #cbd5e0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .circle-check.checked { border-color: var(--green); background: var(--green); color: white; }
        .circle-check.mandatory { border: none; background: #f7fafc; color: #a0aec0; cursor: default; }

        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .btn-blue { background: var(--blue-accent); color: white; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2d3748; color: white; padding: 12px 25px; border-radius: 50px; display: none; font-size: 0.9rem; z-index: 10000; }

        @media (max-width: 850px) {
            .sidebar { width: 0; overflow: hidden; }
            .main { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--blue-accent); margin-bottom: 5px;">Pharmacy Manager</h2>
            <p style="color: #718096; font-size: 0.9rem; margin-bottom: 25px;">Sign in to sync tasks</p>
            <input type="text" id="username" placeholder="Employee ID (e.g. P001)">
            <input type="password" id="password" placeholder="Password">
            <button class="btn btn-blue" style="width: 100%; margin-top: 15px;" onclick="attemptLogin()">Sign In</button>
            <div id="login-loader" style="display:none; margin-top:10px; font-size:0.8rem; color:var(--blue-accent);">Connecting to Cloud...</div>
        </div>
    </div>

    <!-- Sidebar -->
    <nav class="sidebar" id="app-sidebar" style="display: none;">
        <div class="sidebar-header">PHARMACY V1.0</div>
        <div class="nav-group">
            <div class="nav-item active" onclick="setView('home')">🏠 Home Screen</div>
            <div class="nav-item" onclick="setView('history')">📜 Audit Timeline</div>
            <div id="admin-tools" style="display: none;">
                <div style="padding: 20px 25px 10px; font-size: 0.7rem; color: #a0aec0; font-weight: 700;">ADMINISTRATION</div>
                <div class="nav-item" onclick="setView('staff')">👥 Staff List</div>
                <div class="nav-item" onclick="setView('excel')">📥 Excel Import</div>
            </div>
            <div id="hod-tools" style="display: none;">
                <div style="padding: 20px 25px 10px; font-size: 0.7rem; color: #a0aec0; font-weight: 700;">HOD OVERSIGHT</div>
                <div class="nav-item" onclick="setView('reports')">📊 View Reports</div>
                <div class="nav-item" onclick="setView('close-day')" style="color: var(--red);">🔒 Close Day</div>
            </div>
        </div>
        <div class="nav-item" onclick="logout()" style="margin-top: auto; border-top: 1px solid #f7fafc;">🚪 Sign Out</div>
    </nav>

    <main class="main" id="app-main" style="display: none;">
        <div class="header">
            <h2 id="view-title">Home</h2>
            <div class="sync-status"><span class="dot" id="sync-dot"></span> <span id="sync-text">Local Mode</span></div>
        </div>
        <div id="view-container"></div>
    </main>

    <div id="toast"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzj-8D5NIf5qH2CRcYzFo25HhrHP0Zk3wUCGKkh_ChpUjUovaQJQFXCDrpfVbHYikFQ/exec";
        
        let db = JSON.parse(localStorage.getItem('pharmacy_db')) || {
            users: [
                {id: 'P001', name: 'Rohan Joshi', role: 'STAFF', onLeave: false},
                {id: 'P002', name: 'Kevin', role: 'ADMIN', onLeave: false},
                {id: 'P003', name: 'Amit Patel', role: 'HOD', onLeave: false}
            ],
            tasks: [
                {id: 't1', title: 'Refrigerator Temperature', desc: 'Check fridge is 2-8°C', primary: 'P001', backup: 'P002', type: 'TICK'},
                {id: 't2', title: 'Cash Counter Cleaning', desc: 'Sanitize all surfaces', primary: 'P001', backup: 'P002', type: 'TICK'},
                {id: 't3', title: 'Wear ID Card', desc: 'Mandatory uniform rule', primary: 'P001', backup: 'P002', type: 'MANDATORY'}
            ],
            logs: [],
            lastSync: null
        };

        let currentUser = null;
        let cloudReady = false;

        // --- Cloud Sync Logic ---
        async function apiPost(payload) {
            try {
                const r = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                return await r.json();
            } catch (e) {
                console.error("Sync Error:", e);
                return { success: false };
            }
        }

        async function syncWithCloud() {
            document.getElementById('sync-text').innerText = "Syncing...";
            const res = await apiPost({ action: "syncDatabase", database: db });
            if (res.success) {
                document.getElementById('sync-dot').classList.add('online');
                document.getElementById('sync-text').innerText = "Cloud Synced";
                db.lastSync = new Date().getTime();
                cloudReady = true;
                localStorage.setItem('pharmacy_db', JSON.stringify(db));
            } else {
                document.getElementById('sync-dot').classList.remove('online');
                document.getElementById('sync-text').innerText = "Offline (Local)";
            }
        }

        async function loadFromCloud() {
            try {
                const r = await fetch(API_URL);
                const remote = await r.json();
                if (remote && remote.tasks) {
                    db = remote;
                    localStorage.setItem('pharmacy_db', JSON.stringify(db));
                    cloudReady = true;
                }
            } catch(e) { console.warn("Cloud load failed, using local."); }
        }

        // --- Auth ---
        async function attemptLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const user = db.users.find(x => x.id === u && p === "123");

            if (user) {
                document.getElementById('login-loader').style.display = 'block';
                await loadFromCloud(); // Get latest data before opening
                
                currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-sidebar').style.display = 'flex';
                document.getElementById('app-main').style.display = 'block';
                
                if(user.role === 'ADMIN' || user.role === 'HOD') document.getElementById('admin-tools').style.display = 'block';
                if(user.role === 'HOD') document.getElementById('hod-tools').style.display = 'block';
                
                setView('home');
                syncWithCloud();
            } else {
                alert("Invalid Credentials");
            }
        }

        function logout() { location.reload(); }

        // --- View Engine ---
        function setView(v) {
            const container = document.getElementById('view-container');
            const today = new Date().toLocaleDateString();
            document.getElementById('view-title').innerText = v.charAt(0).toUpperCase() + v.slice(1);

            if (v === 'home') {
                const myTasks = db.tasks.filter(t => {
                    const primary = db.users.find(u => u.id === t.primary);
                    return primary.onLeave ? t.backup === currentUser.id : t.primary === currentUser.id;
                });
                const doneCount = db.logs.filter(l => l.date === today && l.userId === currentUser.id).length;

                container.innerHTML = `
                    <div style="background:var(--light-blue); padding:20px; border-radius:12px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <h3 style="margin:0; color:var(--blue-accent);">Today's Progress</h3>
                            <p style="margin:5px 0 0; font-size:0.9rem;">${doneCount} of ${myTasks.length} tasks completed</p>
                        </div>
                        <button class="btn ${currentUser.onLeave ? 'btn-blue' : ''}" style="background:${currentUser.onLeave ? '' : '#fff'}; color:${currentUser.onLeave ? '' : 'var(--red)'}; border:${currentUser.onLeave ? '' : '1px solid var(--red)'}" onclick="toggleLeave()">
                            ${currentUser.onLeave ? 'Return from Leave' : 'Mark On Leave'}
                        </button>
                    </div>

                    <div class="task-list">
                        ${myTasks.map(t => {
                            const done = db.logs.find(l => l.taskId === t.id && l.date === today);
                            const isMandatory = t.type === 'MANDATORY';
                            return `
                                <div class="task-item">
                                    <div class="task-info">
                                        <h4>${t.title}</h4>
                                        <p>${t.desc}</p>
                                    </div>
                                    <div class="circle-check ${done ? 'checked' : ''} ${isMandatory ? 'mandatory' : ''}" 
                                         onclick="tickTask('${t.id}', ${isMandatory})">
                                        ${isMandatory ? 'ℹ️' : (done ? '✔' : '○')}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } else if (v === 'history') {
                container.innerHTML = `<h3>Activity Audit</h3><div class="task-list">
                    ${db.logs.filter(l => l.userId === currentUser.id).reverse().map(l => `
                        <div class="task-item"><div><b>${l.action}</b><br><small>${l.date} | ${l.time}</small></div></div>
                    `).join('')}
                </div>`;
            }
        }

        // --- Actions ---
        function tickTask(id, isMandatory) {
            if (isMandatory || new Date().getHours() >= 22) return;
            const today = new Date().toLocaleDateString();
            if (db.logs.find(l => l.taskId === id && l.date === today)) return;

            const t = db.tasks.find(x => x.id === id);
            db.logs.push({ taskId: id, action: `Ticked: ${t.title}`, userId: currentUser.id, date: today, time: new Date().toLocaleTimeString() });
            save(); setView('home'); syncWithCloud();
            toast("Task Marked Complete");
        }

        function toggleLeave() {
            currentUser.onLeave = !currentUser.onLeave;
            db.logs.push({ action: currentUser.onLeave ? "Marked On Leave" : "Returned from Leave", userId: currentUser.id, date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString() });
            save(); setView('home'); syncWithCloud();
        }

        function toast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

    </script>
</body>
</html>
