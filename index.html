<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V6.7</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --sidebar: #0f172a; --card: #ffffff; --text: #1e293b;
            --primary: #6366f1; --ai: #8b5cf6; --line: #e2e8f0; --muted: #64748b;
            --success: #10b981; --danger: #f43f5e; --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        body.dark {
            --bg: #020617; --card: #1e293b; --text: #f1f5f9; --line: #334155; --muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; transition: 0.3s; }
        .sidebar-header { padding: 25px; font-weight: 800; font-size: 1.2rem; background: rgba(255,255,255,0.05); text-align: center; color: var(--primary); }
        .nav-group { padding: 10px 0; flex: 1; }
        .nav-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; color: #94a3b8; text-decoration: none; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.1); color: white; border-left-color: var(--primary); }

        /* Content */
        .main-content { margin-left: 260px; flex: 1; padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 20px; }
        .search-bar { flex: 1; max-width: 400px; position: relative; }
        .search-bar input { padding: 10px 15px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--text); width: 100%; }

        /* Stats & Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: var(--primary); opacity: 0.3; }
        .stat-card h3 { margin: 5px 0; font-size: 1.8rem; }

        /* Table & Tasks */
        .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: var(--muted); font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--line); }
        td { padding: 15px; border-bottom: 1px solid var(--line); }
        
        .pill { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .high { background: #fee2e2; color: #ef4444; }
        .medium { background: #fef3c7; color: #f59e0b; }
        .low { background: #dcfce7; color: #10b981; }
        .overdue { color: var(--danger); font-weight: bold; }

        /* AI Chat Box */
        #ai-drawer { position: fixed; right: -400px; top: 0; width: 380px; height: 100vh; background: var(--card); box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: 0.3s; z-index: 200; padding: 20px; display: flex; flex-direction: column; }
        #ai-drawer.open { right: 0; }
        .chat-msgs { flex: 1; overflow-y: auto; margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; font-size: 0.9rem; }
        .msg.bot { background: var(--line); align-self: flex-start; }
        .msg.user { background: var(--ai); color: white; align-self: flex-end; }

        /* Buttons */
        button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ai { background: var(--ai); color: white; }
        .btn-danger { background: #fee2e2; color: #ef4444; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; place-items: center; z-index: 300; }
        .modal-overlay.open { display: grid; }
        .modal { background: var(--card); width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">AMBA AI v6.7</div>
        <div class="nav-group">
            <div class="nav-item active" onclick="setView('dashboard')">📊 Dashboard</div>
            <div class="nav-item" onclick="setView('master')">📚 Master Tasks</div>
            <div class="nav-item" onclick="setView('daily')">📅 Daily Tasks</div>
            <div class="nav-item" onclick="setView('weekly')">📆 Weekly Tasks</div>
            <div class="nav-item" onclick="setView('employees')">👥 Employees</div>
            <div class="nav-item" onclick="setView('reports')">📈 Reports</div>
            <div class="nav-item" onclick="setView('settings')">⚙️ Settings</div>
        </div>
    </nav>

    <main class="main-content">
        <header>
            <div class="search-bar">
                <input type="text" id="globalSearch" placeholder="Search tasks or employees..." oninput="refreshCurrentView()">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-ai" onclick="toggleAI()">🤖 AI Assistant</button>
                <button class="btn-primary" onclick="openTaskModal()">+ New Task</button>
            </div>
        </header>

        <div id="content-area"></div>
    </main>

    <!-- AI Drawer -->
    <div id="ai-drawer">
        <h3>🤖 Amba AI Assistant</h3>
        <div class="chat-msgs" id="chatMsgs">
            <div class="msg bot">Hello! I can help you create tasks or find information. Try: "Create task Clean Office tomorrow"</div>
        </div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="aiInput" placeholder="Type command...">
            <button class="btn-ai" onclick="processAI()">Send</button>
        </div>
        <button class="btn-danger" style="margin-top:10px;" onclick="toggleAI()">Close</button>
    </div>

    <!-- Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h2 id="modalTitle">New Task</h2>
            <form id="taskForm">
                <input type="hidden" id="editId">
                <label>Task Title</label><input id="tTitle" required>
                <label>Assignee</label><select id="tAssign"></select>
                <label>Due Date</label><input type="date" id="tDue">
                <label>Priority</label>
                <select id="tPri">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                </select>
                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button type="button" class="btn-secondary" style="flex:1" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex:1">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let db = JSON.parse(localStorage.getItem('amba_v6_db')) || {
            tasks: [],
            users: [{id:'u1', name:'Admin', role:'ADMIN'}, {id:'u2', name:'Rahul', role:'EMPLOYEE'}],
            config: { darkMode: false }
        };

        let currentView = 'dashboard';

        function save() { 
            localStorage.setItem('amba_v6_db', JSON.stringify(db)); 
            refreshCurrentView(); 
        }

        function setView(v) {
            currentView = v;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            event?.currentTarget?.classList.add('active');
            refreshCurrentView();
        }

        function refreshCurrentView() {
            const area = document.getElementById('content-area');
            const search = document.getElementById('globalSearch').value.toLowerCase();
            let filteredTasks = db.tasks.filter(t => t.title.toLowerCase().includes(search));

            if (currentView === 'dashboard') renderDashboard(area, filteredTasks);
            else if (currentView === 'master') renderTable(area, filteredTasks, "All Tasks");
            else if (currentView === 'daily') {
                const today = new Date().toISOString().split('T')[0];
                renderTable(area, filteredTasks.filter(t => t.due === today), "Today's Tasks");
            }
            else if (currentView === 'employees') renderEmployees(area);
            else if (currentView === 'reports') renderReports(area);
            else if (currentView === 'settings') renderSettings(area);
        }

        function renderDashboard(container, tasks) {
            const overdue = tasks.filter(t => t.due < new Date().toISOString().split('T')[0] && t.status !== 'DONE').length;
            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><small>Total</small><h3>${tasks.length}</h3></div>
                    <div class="stat-card"><small>Pending</small><h3>${tasks.filter(t=>t.status!=='DONE').length}</h3></div>
                    <div class="stat-card" style="color:var(--danger)"><small>Overdue</small><h3>${overdue}</h3></div>
                    <div class="stat-card" style="color:var(--success)"><small>Completed</small><h3>${tasks.filter(t=>t.status==='DONE').length}</h3></div>
                </div>
                <div class="card"><h3>Recent Tasks</h3><div id="recent-list"></div></div>
            `;
            renderTable(document.getElementById('recent-list'), tasks.slice(0, 5));
        }

        function renderTable(container, tasks, title = "") {
            const today = new Date().toISOString().split('T')[0];
            let html = `<h3>${title}</h3><table><thead><tr><th>Task</th><th>Assignee</th><th>Due Date</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
            
            tasks.forEach(t => {
                const isOverdue = t.due < today && t.status !== 'DONE';
                const userName = db.users.find(u => u.id === t.userId)?.name || 'Unassigned';
                html += `
                    <tr>
                        <td><strong>${t.title}</strong></td>
                        <td>${userName}</td>
                        <td class="${isOverdue ? 'overdue' : ''}">${t.due || 'None'} ${isOverdue ? '⚠️' : ''}</td>
                        <td><span class="pill ${t.priority.toLowerCase()}">${t.priority}</span></td>
                        <td><button onclick="toggleTask('${t.id}')" class="btn-secondary">${t.status}</button></td>
                        <td>
                            <button onclick="editTask('${t.id}')" style="background:none; cursor:pointer">✏️</button>
                            <button onclick="deleteTask('${t.id}')" style="background:none; cursor:pointer">🗑️</button>
                        </td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderReports(container) {
            container.innerHTML = `
                <div class="card">
                    <h3>Data Export</h3>
                    <p>Download your entire task database as an Excel file for backup or reporting.</p>
                    <button class="btn-primary" onclick="exportExcel()">📥 Export to Excel (.xlsx)</button>
                </div>
            `;
        }

        function renderSettings(container) {
            container.innerHTML = `
                <div class="card">
                    <h3>System</h3>
                    <button class="btn-secondary" onclick="toggleDark()">🌓 Toggle Dark Mode</button>
                    <button class="btn-danger" style="margin-left:10px" onclick="clearData()">⚠️ Clear All Data</button>
                </div>
            `;
        }

        function renderEmployees(area) {
            area.innerHTML = `
                <div class="card">
                    <h3>Team Members</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr auto; gap:10px; margin-bottom:20px;">
                        <input id="en" placeholder="Full Name"> <input id="ee" placeholder="Email">
                        <button class="btn-primary" onclick="addEmp()">Add Employee</button>
                    </div>
                    <table><thead><tr><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
                    <tbody>${db.users.map(u => `<tr><td>${u.name}</td><td>${u.email || 'N/A'}</td><td><button onclick="delEmp('${u.id}')">Remove</button></td></tr>`).join('')}</tbody></table>
                </div>`;
        }

        // Logic Functions
        function toggleAI() { document.getElementById('ai-drawer').classList.toggle('open'); }
        
        function processAI() {
            const input = document.getElementById('aiInput').value;
            if(!input) return;
            addChat(input, 'user');
            const cmd = input.toLowerCase();
            
            if(cmd.includes('create task')) {
                const title = input.replace(/create task/i, '').split('for')[0].trim();
                const newTask = { id: 't'+Date.now(), title, userId: 'u1', due: new Date().toISOString().split('T')[0], priority: 'MEDIUM', status: 'TODO' };
                db.tasks.unshift(newTask);
                save();
                addChat(`Created task: "${title}"`, 'bot');
            } else if(cmd.includes('show')) {
                setView('master');
                addChat("Switched to Master view to show tasks.", 'bot');
            } else {
                addChat("I'm not sure how to do that yet. Try 'Create task [name]'", 'bot');
            }
            document.getElementById('aiInput').value = '';
        }

        function addChat(txt, type) {
            const chat = document.getElementById('chatMsgs');
            chat.innerHTML += `<div class="msg ${type}">${txt}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function openTaskModal(id = null) {
            const uSelect = document.getElementById('tAssign');
            uSelect.innerHTML = db.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            if(id) {
                const t = db.tasks.find(x => x.id === id);
                document.getElementById('editId').value = id;
                document.getElementById('tTitle').value = t.title;
                document.getElementById('tDue').value = t.due;
                document.getElementById('tPri').value = t.priority;
                document.getElementById('tAssign').value = t.userId;
            } else {
                document.getElementById('taskForm').reset();
                document.getElementById('editId').value = '';
            }
            document.getElementById('taskModal').classList.add('open');
        }

        function closeTaskModal() { document.getElementById('taskModal').classList.remove('open'); }

        document.getElementById('taskForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                title: document.getElementById('tTitle').value,
                due: document.getElementById('tDue').value,
                priority: document.getElementById('tPri').value,
                userId: document.getElementById('tAssign').value,
                status: 'TODO'
            };

            if(id) {
                const idx = db.tasks.findIndex(t => t.id === id);
                db.tasks[idx] = { ...db.tasks[idx], ...data };
            } else {
                db.tasks.unshift({ id: 't'+Date.now(), ...data });
            }
            save(); closeTaskModal(); showToast("Success!");
        };

        function deleteTask(id) { if(confirm("Delete task?")) { db.tasks = db.tasks.filter(t => t.id !== id); save(); } }
        function toggleTask(id) { 
            const t = db.tasks.find(x => x.id === id); 
            t.status = t.status === 'TODO' ? 'DONE' : 'TODO'; 
            save(); 
        }

        function exportExcel() {
            const worksheet = XLSX.utils.json_to_sheet(db.tasks);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Tasks");
            XLSX.writeFile(workbook, "Amba_Task_Report.xlsx");
        }

        function toggleDark() { 
            document.body.classList.toggle('dark'); 
            db.config.darkMode = document.body.classList.contains('dark');
            save();
        }

        function showToast(m) { 
            const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; 
            setTimeout(() => t.style.display = 'none', 3000); 
        }

        // Initialize
        if(db.config.darkMode) document.body.classList.add('dark');
        setView('dashboard');
    </script>
</body>
</html>
