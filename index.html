<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V7.1 | Professional</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #1e293b;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
            --muted: #94a3b8; --line: #334155; --sidebar: #020617;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        /* Layout Structure */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid #334155; }
        .sidebar-header span { color: var(--primary); }
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .nav-item i { width: 20px; text-align: center; }

        .sidebar-footer { padding: 15px; border-top: 1px solid #334155; }
        .logout-btn { background: #dc2626; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border-radius: 8px; padding: 12px; border: none; font-weight: 700; cursor: pointer; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        
        /* Top Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .top-right { display: flex; align-items: center; gap: 20px; }

        /* Notification System */
        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; color: var(--muted); }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg); }
        .notif-dropdown { display: none; position: absolute; top: 70px; right: 30px; width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); z-index: 1000; max-height: 400px; overflow-y: auto; }
        .notif-dropdown.active { display: block; }
        .notif-header { padding: 15px; border-bottom: 1px solid var(--line); font-weight: 800; display: flex; justify-content: space-between; }
        .notif-item { padding: 12px 15px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
        .notif-item.unread { background: rgba(79, 70, 229, 0.05); }

        /* Components */
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); display: flex; justify-content: space-between; }
        
        /* UI Elements */
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .bg-high { background: #fee2e2; color: #b91c1c; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; }

        @media (max-width: 1000px) {
            .sidebar { width: 70px; }
            .sidebar span, .sidebar-header, .sidebar-footer b { display: none; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body onload="init()">

<div id="app-shell"></div>

<!-- Create Task Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h2>New Task</h2>
        <input type="text" id="f-title" placeholder="What needs to be done?" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid var(--line);">
        <select id="f-pri" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid var(--line);">
            <option value="HIGH">High Priority</option>
            <option value="MEDIUM" selected>Medium Priority</option>
            <option value="LOW">Low Priority</option>
        </select>
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">Create Task</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. DATA STATE
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const STORE_KEY = "AMBA_V7_PRO";

let state = JSON.parse(localStorage.getItem(STORE_KEY)) || {
    tasks: [],
    notifications: [],
    recurring: [],
    settings: { userName: "Admin", apiSync: true, darkMode: false },
    view: 'dashboard'
};

const save = () => {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    if(state.settings.apiSync) sync();
};

async function sync() {
    try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncDatabase', database: state }) }); } catch(e){}
}

// ==========================================
// 2. RENDERING ENGINE
// ==========================================
function init() {
    render();
    checkAutoNotifications();
}

function render() {
    const shell = document.getElementById('app-shell');
    document.body.className = state.settings.darkMode ? 'dark' : '';
    
    const unreadCount = state.notifications.filter(n => !n.read).length;

    shell.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">AMBA <span>AI</span></div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list"></i> <span>Tasks</span></div>
                    <div class="nav-item ${state.view==='recurring'?'active':''}" onclick="nav('recurring')"><i class="fas fa-sync"></i> <span>Recurring</span></div>
                    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer">
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> <b>Logout</b>
                    </button>
                </div>
            </aside>

            <main class="main-content">
                <header class="top-bar">
                    <h2>${state.view.toUpperCase()}</h2>
                    <div class="top-right">
                        <div class="notif-bell" onclick="toggleNotifs()">
                            <i class="fas fa-bell"></i>
                            ${unreadCount > 0 ? `<span class="notif-badge">${unreadCount}</span>` : ''}
                        </div>
                        <div class="notif-dropdown" id="notif-box">
                            <div class="notif-header">Notifications <span onclick="clearNotifs()" style="cursor:pointer; color:var(--primary); font-size:0.7rem;">Clear All</span></div>
                            <div id="notif-list">
                                ${state.notifications.length ? state.notifications.map(n => `
                                    <div class="notif-item ${n.read?'':'unread'}">${n.text}</div>
                                `).join('') : '<div class="notif-item">No notifications</div>'}
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="showModal()"><i class="fas fa-plus"></i> New Task</button>
                    </div>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>
    `;
    renderView();
}

function nav(v) { state.view = v; render(); }

// ==========================================
// 3. VIEWS
// ==========================================
function renderView() {
    const mount = document.getElementById('view-mount');
    
    if (state.view === 'dashboard') {
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div><span>PENDING</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div><i class="fas fa-clock" style="color:var(--warning)"></i></div>
                <div class="stat-card"><div><span>COMPLETED</span><h2>${state.tasks.filter(t=>t.status==='DONE').length}</h2></div><i class="fas fa-check-circle" style="color:var(--success)"></i></div>
            </div>
            <div class="panel">
                <h3>Recent Tasks</h3>
                ${state.tasks.slice(0, 5).map(t => `
                    <div style="padding:10px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between;">
                        <span>${t.title}</span> <span class="badge bg-high">${t.priority}</span>
                    </div>
                `).join('')}
            </div>
        `;
    }
    else if (state.view === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="text-align:left; color:var(--muted); font-size:0.8rem;"><th>TASK</th><th>PRIORITY</th><th>STATUS</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => `
                            <tr>
                                <td style="padding:15px 0;">${t.title}</td>
                                <td><span class="badge bg-high">${t.priority}</span></td>
                                <td><button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    else if (state.view === 'recurring') {
        mount.innerHTML = `
            <div class="panel">
                <h3>Add Recurring Automation</h3>
                <input type="text" id="rec-title" placeholder="Daily Task Name" style="padding:10px; border:1px solid var(--line); border-radius:8px;">
                <button class="btn btn-primary" onclick="addRecurring()">Save Schedule</button>
                <hr style="margin:20px 0; border:none; border-top:1px solid var(--line);">
                ${state.recurring.map(r => `<div style="padding:10px;">🔄 ${r.title} (Every 24h)</div>`).join('')}
            </div>
        `;
    }
    else if (state.view === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:500px;">
                <h3>User Settings</h3>
                <div style="margin-bottom:20px;">
                    <label>User Name</label>
                    <input type="text" value="${state.settings.userName}" onchange="updateSet('userName', this.value)" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);">
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                    <span>Dark Mode</span>
                    <button class="btn btn-secondary" onclick="state.settings.darkMode = !state.settings.darkMode; save(); render();">Toggle</button>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                    <span>Google Sheets Sync</span>
                    <button class="btn btn-secondary" onclick="state.settings.apiSync = !state.settings.apiSync; save(); render();">${state.settings.apiSync ? 'ON' : 'OFF'}</button>
                </div>
                <hr>
                <button class="btn btn-danger" style="width:100%;" onclick="resetSystem()">Reset System (Wipe Data)</button>
            </div>
        `;
    }
}

// ==========================================
// 4. FUNCTIONALITY
// ==========================================
function logout() {
    if(confirm("Are you sure you want to logout?")) {
        localStorage.removeItem(STORE_KEY);
        location.reload();
    }
}

function checkAutoNotifications() {
    const today = new Date().toDateString();
    let updated = false;

    // Check Recurring Tasks
    state.recurring.forEach(r => {
        if(r.lastRun !== today) {
            state.tasks.unshift({ id: 'rt'+Date.now(), title: "[AUTO] "+r.title, priority: 'MEDIUM', status: 'TODO' });
            state.notifications.unshift({ text: "📅 Generated recurring task: "+r.title, read: false });
            r.lastRun = today;
            updated = true;
        }
    });

    if(updated) { save(); render(); }
}

function toggleNotifs() { document.getElementById('notif-box').classList.toggle('active'); }
function clearNotifs() { state.notifications = []; save(); render(); }

function showModal() { document.getElementById('task-modal').classList.add('active'); }
function closeModal() { document.getElementById('task-modal').classList.remove('active'); }

function addTask() {
    const t = document.getElementById('f-title').value;
    if(!t) return;
    state.tasks.unshift({ id: 't'+Date.now(), title: t, priority: document.getElementById('f-pri').value, status: 'TODO' });
    state.notifications.unshift({ text: "🚀 New task created: " + t, read: false });
    save(); closeModal(); render();
}

function toggleDone(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) {
        t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
        if(t.status === 'DONE') state.notifications.unshift({ text: "🎉 Task completed: " + t.title, read: false });
        save(); render();
    }
}

function addRecurring() {
    const t = document.getElementById('rec-title').value;
    if(!t) return;
    state.recurring.push({ id: 'r'+Date.now(), title: t, lastRun: "" });
    save(); render();
}

function updateSet(k, v) { state.settings[k] = v; save(); }

function resetSystem() {
    if(confirm("This will permanently delete all tasks and local settings. Continue?")) {
        localStorage.clear();
        location.reload();
    }
}
</script>
</body>
</html>
