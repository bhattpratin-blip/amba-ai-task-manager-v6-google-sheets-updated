<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V6 - Google Sheets</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root{--bg:#f4f7fb;--card:#fff;--text:#18212f;--muted:#6b7280;--line:#e5e7eb;--primary:#4f46e5;--ai:#7c3aed;--danger:#dc2626;--shadow:0 10px 30px #00000012}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body.dark{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155}
        button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.ai-btn{background:var(--ai);color:#fff}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
        input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}textarea{min-height:95px;resize:vertical}
        .login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:var(--card);padding:32px;border-radius:20px;box-shadow:var(--shadow)}.login-card h1{text-align:center}.login-card p{text-align:center;color:var(--muted)}.group{margin:14px 0}.group label{display:block;font-weight:700;margin-bottom:6px}.demo{background:var(--bg);padding:14px;border-radius:12px;color:var(--muted);font-size:13px;margin-top:18px}
        .shell{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{margin:0}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
        .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.stat,.panel,.task{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:28px;margin-top:8px}
        .grid{display:grid;grid-template-columns:1fr 370px;gap:18px}.panel{padding:18px}.toolbar{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:16px}.tasks{display:grid;gap:14px}.task{padding:18px}.task-head{display:flex;justify-content:space-between;gap:15px}.task h3{margin:0 0 8px}.task p{color:var(--muted);white-space:pre-wrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.pill{border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.high{background:#fee2e2;color:#991b1b}.medium{background:#fef3c7;color:#92400e}.low{background:#dcfce7;color:#166534}.status{background:#e0e7ff;color:#3730a3}.empty{text-align:center;padding:45px;color:var(--muted)}
        .ai-panel{background:linear-gradient(135deg,#ede9fe,#f5f3ff);color:#312e81;border:1px solid #ddd6fe}.dark .ai-panel{background:#312e81;color:#ede9fe}.ai-panel h2{margin-top:0}.ai-chat{height:230px;overflow:auto;background:var(--card);border-radius:12px;padding:12px;margin:12px 0;color:var(--text)}.msg{padding:9px 11px;border-radius:10px;margin:7px 0;max-width:95%;font-size:14px}.msg.user{background:#e0e7ff;margin-left:auto}.msg.ai{background:#f3f4f6}.dark .msg.ai{background:#334155}.ai-input{display:flex;gap:8px}
        .upload-box{border:2px dashed #a78bfa;border-radius:14px;padding:18px;background:#faf5ff}.dark .upload-box{background:#312e81}.upload-box h2{margin-top:0}.upload-row{display:flex;gap:10px;align-items:center}.upload-row input{flex:1}.sample{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}.allocation{display:grid;gap:10px}.employee-card{border:1px solid var(--line);border-radius:12px;padding:13px}.employee-card h3{margin:0 0 8px}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}
        .notice{position:relative}.menu{display:none;position:absolute;right:0;top:48px;width:350px;max-width:calc(100vw - 25px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:10}.menu.open{display:block}.menu-head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.notice-item{padding:12px;border-bottom:1px solid var(--line);font-size:14px}.notice-item.unread{background:#eef2ff}.notice-item small{display:block;color:var(--muted);margin-top:4px}
        .modal-bg{display:none;position:fixed;inset:0;background:#0008;place-items:center;padding:20px;z-index:20}.modal-bg.open{display:grid}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.admin-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}
        .layout{display:flex;min-height:100vh}.sidebar{width:260px;background:#1e293b;color:#fff;padding:20px}.sidebar h2{margin:0 0 20px;text-align:center}.sidebar a{display:block;padding:12px 15px;margin:8px 0;color:white;text-decoration:none;border-radius:10px;transition:.3s}.sidebar a:hover{background:#4f46e5}.content{flex:1;padding:20px;background:var(--bg)}
        #toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 17px;border-radius:10px;z-index:99;display:none}
        @media(max-width:1100px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:750px){.top,.task-head{flex-direction:column;align-items:flex-start}.stats,.toolbar,.admin-form{grid-template-columns:1fr}.upload-row{flex-direction:column;align-items:stretch}.actions{width:100%}.actions button{flex:1}.layout{flex-direction:column}.sidebar{width:100%}}
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzj-8D5NIf5qH2CRcYzFo25HhrHP0Zk3wUCGKkh_ChpUjUovaQJQFXCDrpfVbHYikFQ/exec";
const DB = "amba_ai_task_manager_v6", SESSION = "amba_ai_session_v6", REMEMBER = "amba_ai_remember_v6";

let db = JSON.parse(localStorage.getItem(DB)) || {
    users: [
        {id:"u1", name:"Admin", email:"admin@amba.local", password:"Admin@123", role:"ADMIN"},
        {id:"u2", name:"Rahul", email:"rahul@amba.local", password:"Employee@123", role:"EMPLOYEE"}
    ],
    tasks: [],
    notifications: []
};

let session = JSON.parse(localStorage.getItem(SESSION) || sessionStorage.getItem(SESSION) || "null");
let editing = null, deleting = null, cloudReady = false;

const app = document.getElementById('app');
const user = () => db.users.find(x => x.id === session?.userId);

function localSave() { localStorage.setItem(DB, JSON.stringify(db)); }
function save() { localSave(); }

function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2600);
}

function esc(x) { let d = document.createElement("div"); d.textContent = x ?? ""; return d.innerHTML; }
function dateText(d) { return d ? new Date(d + "T00:00:00").toLocaleDateString("en-IN") : "No due date"; }

function renderLogin() {
    app.innerHTML = `
    <main class="login">
        <section class="login-card">
            <h1>🤖 Amba AI Task Manager</h1>
            <p>Smart task management with Excel work allocation</p>
            <form id="loginForm">
                <div class="group"><label>Email</label><input id="email" type="email" required></div>
                <div class="group"><label>Password</label><input id="password" type="password" required></div>
                <button class="primary" style="width:100%">Login</button>
            </form>
            <div class="demo"><b>Admin:</b> admin@amba.local / Admin@123</div>
        </section>
    </main>`;
    
    document.getElementById('loginForm').onsubmit = e => {
        e.preventDefault();
        const emailVal = document.getElementById('email').value.toLowerCase();
        const passVal = document.getElementById('password').value;
        let x = db.users.find(u => u.email.toLowerCase() === emailVal && u.password === passVal);
        if (!x) return toast("Invalid login");
        session = { userId: x.id };
        sessionStorage.setItem(SESSION, JSON.stringify(session));
        renderApp();
    };
}

function renderApp() {
    let u = user();
    if (!u) return renderLogin();

    app.innerHTML = `
    <div class="layout">
        <div class="sidebar">
            <h2>🏥 Amba AI</h2>
            <a href="#" class="nav-link" data-page="dashboard">📊 Dashboard</a>
            <a href="#" class="nav-link" data-page="employees">👥 Employees</a>
            <a href="#" class="nav-link" data-page="reports">📈 Reports</a>
            <hr>
            <a href="#" id="logoutSide">🚪 Logout</a>
        </div>
        <div class="content">
            <header class="top">
                <div><h1>Dashboard</h1><div class="muted">Welcome ${esc(u.name)}</div></div>
                <div class="actions">
                    <button class="primary" id="addBtn">+ Add Task</button>
                    <button class="secondary" id="logoutBtn">Logout</button>
                </div>
            </header>
            
            <section class="stats">
                <div class="stat"><span>Total</span><strong id="total">0</strong></div>
                <div class="stat"><span>Done</span><strong id="done">0</strong></div>
                <div class="stat"><span>Pending</span><strong id="pending">0</strong></div>
            </section>

            <div class="grid">
                <section class="panel">
                    <div id="tasks" class="tasks"></div>
                </section>
                <aside class="panel ai-panel">
                    <h2>🤖 AI Assistant</h2>
                    <div id="chat" class="ai-chat"></div>
                    <div class="ai-input">
                        <input id="aiText" placeholder="Ask something...">
                        <button class="ai-btn" id="askAI">Ask</button>
                    </div>
                </aside>
            </div>
        </div>
    </div>
    
    <!-- Modals -->
    <div id="taskModal" class="modal-bg">
        <div class="modal">
            <h2>Task Details</h2>
            <form id="taskForm">
                <div class="group"><label>Title</label><input id="title" required></div>
                <div class="group"><label>Priority</label><select id="pri"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div>
                <div class="modal-actions">
                    <button type="button" class="secondary" onclick="document.getElementById('taskModal').classList.remove('open')">Cancel</button>
                    <button class="primary">Save</button>
                </div>
            </form>
        </div>
    </div>`;

    bindEvents();
    renderTasks();
}

function bindEvents() {
    // Logout buttons
    const doLogout = () => { sessionStorage.clear(); location.reload(); };
    document.getElementById('logoutBtn').onclick = doLogout;
    document.getElementById('logoutSide').onclick = doLogout;

    // Modal
    document.getElementById('addBtn').onclick = () => document.getElementById('taskModal').classList.add('open');
    document.getElementById('taskForm').onsubmit = (e) => {
        e.preventDefault();
        const newTask = {
            id: "t" + Date.now(),
            title: document.getElementById('title').value,
            priority: document.getElementById('pri').value,
            status: "TODO",
            assignedTo: session.userId
        };
        db.tasks.unshift(newTask);
        save();
        document.getElementById('taskModal').classList.remove('open');
        renderTasks();
        toast("Task added!");
    };

    // Sidebar navigation
    document.querySelectorAll('.nav-link').forEach(link => {
        link.onclick = (e) => {
            e.preventDefault();
            toast("Navigating to " + e.target.dataset.page);
        };
    });
}

function renderTasks() {
    const taskContainer = document.getElementById('tasks');
    const u = user();
    const myTasks = db.tasks.filter(t => t.assignedTo === u.id);
    
    document.getElementById('total').textContent = myTasks.length;
    document.getElementById('done').textContent = myTasks.filter(t => t.status === "DONE").length;
    document.getElementById('pending').textContent = myTasks.filter(t => t.status !== "DONE").length;

    taskContainer.innerHTML = myTasks.length ? myTasks.map(t => `
        <div class="task">
            <h3>${esc(t.title)}</h3>
            <span class="pill ${t.priority.toLowerCase()}">${t.priority}</span>
        </div>
    `).join('') : '<p class="empty">No tasks yet.</p>';
}

// Initialize
if (session && user()) renderApp(); else renderLogin();
</script>

<!-- External files (Ensure these exist in your repository) -->
<script src="js/settings.js"></script>
<script src="js/masterTasks.js"></script>
<script src="js/notifications.js"></script>
<script src="js/recurringTasks.js"></script>
</body>
</html>
