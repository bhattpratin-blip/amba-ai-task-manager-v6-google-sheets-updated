<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V8.3 | Pro</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #1e293b;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.3rem; font-weight: 800; border-bottom: 1px solid #334155; }
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #334155; }
        .logout-btn { background: var(--danger); color: white; width: 100%; border-radius: 8px; padding: 12px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        .top-right { display: flex; align-items: center; gap: 20px; }
        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; color: var(--muted); }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg); }
        
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--muted); font-size: 0.8rem; padding: 10px; border-bottom: 2px solid var(--line); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .bg-high { background: #fee2e2; color: #b91c1c; }
        .bg-done { background: #dcfce7; color: #15803d; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; }
        .modal input, .modal select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }

        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h2>New Task</h2>
        <input type="text" id="f-title" placeholder="Task description...">
        <input type="date" id="f-date">
        <select id="f-emp"></select>
        <select id="f-pri">
            <option value="HIGH">High Priority</option>
            <option value="MEDIUM" selected>Medium Priority</option>
            <option value="LOW">Low Priority</option>
        </select>
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">Save Task</button>
        <button onclick="closeModal('task-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- Employee Modal -->
<div class="modal-overlay" id="emp-modal">
    <div class="modal">
        <h2>Add Team Member</h2>
        <input type="text" id="fe-name" placeholder="Full Name">
        <input type="text" id="fe-role" placeholder="Role">
        <button class="btn btn-primary" onclick="addEmployee()" style="width:100%">Add Member</button>
        <button onclick="closeModal('emp-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. DATA STATE (Sync & User Logic Included)
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const STORAGE_KEY = "AMBA_V8_3_DATA";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    employees: [{id: 'e1', name: 'Admin User', role: 'Manager'}],
    users: [{email: 'admin@amba.local', password: 'Admin@123'}], // For Password Reset
    masterTasks: [],
    notifications: [],
    recurring: [],
    settings: { userName: "Admin", darkMode: false, sync: true },
    view: 'dashboard'
};

const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
};

// Fixed Sync Function
async function syncCloud() {
    if(!state.settings.sync) return alert("Sync is disabled in settings.");
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'syncDatabase', database: state })
        });
        const res = await response.json();
        if(res.success) alert("✅ Sync Successful");
    } catch(e) { 
        alert("❌ Sync Failed: Check Internet or API URL");
    }
}

// ==========================================
// 2. NAVIGATION & LOGOUT
// ==========================================
function init() { render(); }
function nav(v) { state.view = v; render(); }

// Fixed Logout Function
function logout() {
    if(confirm("Are you sure you want to logout?")) {
        // We don't clear localStorage (to keep DB), we just reload to simulation login
        location.reload(); 
    }
}

// ==========================================
// 3. UI RENDERING
// ==========================================
function render() {
    const root = document.getElementById('app-root');
    document.body.className = state.settings.darkMode ? 'dark' : '';
    const unreadCount = state.notifications.filter(n => !n.read).length;

    root.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">AMBA <span>AI</span></div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-th-large"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list"></i> <span>Tasks</span></div>
                    <div class="nav-item ${state.view==='employees'?'active':''}" onclick="nav('employees')"><i class="fas fa-users"></i> <span>Employees</span></div>
                    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer">
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> LOGOUT
                    </button>
                </div>
            </aside>

            <main class="main-content">
                <header class="top-bar">
                    <h1>${state.view.toUpperCase()}</h1>
                    <div class="top-right">
                        <div class="notif-bell"><i class="fas fa-bell"></i>${unreadCount ? `<span class="notif-badge">${unreadCount}</span>` : ''}</div>
                        <button class="btn btn-primary" onclick="showTaskModal()">+ New Task</button>
                    </div>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>
    `;
    renderView();
}

function renderView() {
    const mount = document.getElementById('view-mount');
    
    if (state.view === 'dashboard') {
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><span>Active Tasks</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                <div class="stat-card"><span>Employees</span><h2>${state.employees.length}</h2></div>
            </div>
            <div class="panel"><h3>Quick Sync</h3><button class="btn btn-primary" onclick="syncCloud()">Sync with Google Sheets</button></div>
        `;
    } 
    else if (state.view === 'employees') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3>Team Directory</h3>
                <button class="btn btn-primary" onclick="document.getElementById('emp-modal').classList.add('active')">+ Add Member</button>
            </div>
            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:20px;">
                ${state.employees.map(e => `
                    <div class="panel" style="text-align:center;">
                        <h3>${e.name}</h3>
                        <p class="muted">${e.role}</p>
                        <button class="btn-danger btn" onclick="deleteEmployee('${e.id}')">Remove</button>
                    </div>
                `).join('')}
            </div>
        `;
    }
    else if (state.view === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Task</th><th>Assignee</th><th>Status</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => `
                            <tr>
                                <td>${t.title}</td>
                                <td>${state.employees.find(e=>e.id===t.assignedTo)?.name || '-'}</td>
                                <td><button class="btn" onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    else if (state.view === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:500px;">
                <h3>User Profile</h3>
                <input type="text" id="set-username" value="${state.settings.userName}" placeholder="Display Name">
                <button class="btn btn-primary" style="width:100%" onclick="updateUser()">Update Name</button>
                
                <hr style="margin:25px 0; border:none; border-top:1px solid var(--line);">
                
                <h3>Security (Password Reset)</h3>
                <input type="password" id="reset-old" placeholder="Current Password">
                <input type="password" id="reset-new" placeholder="New Password">
                <button class="btn btn-danger" style="width:100%" onclick="resetPassword()">Reset Password</button>
                
                <hr style="margin:25px 0; border:none; border-top:1px solid var(--line);">
                <button class="btn btn-primary" style="width:100%" onclick="state.settings.darkMode = !state.settings.darkMode; save(); render();">Toggle Dark Mode</button>
            </div>
        `;
    }
}

// ==========================================
// 4. FUNCTIONAL LOGIC (Employee, User, Password)
// ==========================================
function showTaskModal() {
    const sel = document.getElementById('f-emp');
    sel.innerHTML = state.employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    document.getElementById('task-modal').classList.add('active');
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// Fixed Employee Add
function addEmployee() {
    const name = document.getElementById('fe-name').value;
    const role = document.getElementById('fe-role').value;
    if(!name) return;
    state.employees.push({ id: 'e' + Date.now(), name, role });
    save(); closeModal('emp-modal'); render();
}

function deleteEmployee(id) {
    state.employees = state.employees.filter(e => e.id !== id);
    save(); render();
}

function addTask() {
    const title = document.getElementById('f-title').value;
    if(!title) return;
    state.tasks.unshift({
        id: 't' + Date.now(),
        title,
        date: document.getElementById('f-date').value,
        assignedTo: document.getElementById('f-emp').value,
        priority: document.getElementById('f-pri').value,
        status: 'TODO'
    });
    save(); closeModal('task-modal'); render();
}

// Fixed User Update
function updateUser() {
    state.settings.userName = document.getElementById('set-username').value;
    save(); alert("Profile Updated"); render();
}

// NEW: Password Reset Function
function resetPassword() {
    const old = document.getElementById('reset-old').value;
    const next = document.getElementById('reset-new').value;
    
    // Check if current password matches (default is Admin@123)
    let user = state.users[0];
    if (user.password === old) {
        user.password = next;
        save();
        alert("✅ Password reset successful!");
        document.getElementById('reset-old').value = "";
        document.getElementById('reset-new').value = "";
    } else {
        alert("❌ Current password incorrect!");
    }
}

function toggleDone(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) { t.status = t.status === 'DONE' ? 'TODO' : 'DONE'; save(); render(); }
}
</script>
</body>
</html>
