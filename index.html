<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy PRO Management v10.1</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --p: #10b981; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; 
            --m: #64748b; --l: #e2e8f0; --s: #064e3b; --d: #ef4444; 
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); 
        }
        body { margin: 0; background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; overflow: hidden; background-size: cover; background-position: center; transition: 0.3s; }
        .blur-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px); z-index: -1; }
        .auth-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: linear-gradient(135deg, #10b981 0%, #064e3b 100%); position: fixed; inset: 0; z-index: 9999; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--s); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-profile { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin: 2px 15px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--p); color: white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .panel { background: var(--c); border-radius: 20px; border: 1px solid var(--l); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--c); padding: 20px; border-radius: 16px; border: 1px solid var(--l); text-align: center; }
        .profile-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--p); margin-bottom: 10px; object-fit: cover; }
        .btn { padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; }
        .btn-wa { background: #25d366; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; border:none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--l); }
        .notif-bell { position: relative; cursor: pointer; font-size: 1.4rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--d); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--c); padding: 30px; border-radius: 24px; width: 450px; box-shadow: var(--shadow); }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--l); outline: none; background: var(--bg); box-sizing: border-box; }
        #toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 15px 25px; border-radius: 10px; display: none; z-index: 3000; }
    </style>
</head>
<body onload="init()">
    <div class="blur-overlay"></div>
    <div id="app-root"></div>
    <div id="toast"></div>

    <!-- ADDED TASK MODAL HTML -->
    <div id="modal-task" class="modal-overlay">
        <div class="modal">
            <h3>Assign New Task</h3>
            <input id="f-t-title" placeholder="What needs to be done?">
            <label><small>Due Date</small></label>
            <input id="f-t-date" type="date">
            <label><small>Priority</small></label>
            <select id="f-t-pri">
                <option value="NORMAL">Normal</option>
                <option value="HIGH">High Priority</option>
                <option value="URGENT">Urgent</option>
            </select>
            <label><small>Assign To Staff</small></label>
            <select id="f-t-user"></select>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-p" style="flex:1" onclick="saveTask()">Save Task</button>
                <button class="btn" style="flex:1; background:#eee" onclick="closeModal('modal-task')">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
        const STORAGE_KEY = "PHARMACY_V10_PRO";

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            tasks: [], users: [], masterTasks: [], recurringTasks: [], notifications: [], session: null,
            settings: { darkMode: false, sync: true, view: 'dashboard', wallpaper: '', browserNotif: false }
        };

        function mergeById(serverList, localList) {
            const map = {};
            (serverList || []).forEach(item => { if (item && item.id != null) map[item.id] = item; });
            (localList || []).forEach(item => { if (item && item.id != null) map[item.id] = item; });
            return Object.values(map);
        }

        function mergeNotifications(serverList, localList) {
            const seen = new Set();
            const out = [];
            (localList || []).concat(serverList || []).forEach(n => {
                const key = n.time + '|' + n.text;
                if (!seen.has(key)) { seen.add(key); out.push(n); }
            });
            return out.slice(0, 50);
        }

        function applyServerData(server) {
            if (!server || !Array.isArray(server.users)) return false;
            state.users = mergeById(server.users, state.users);
            state.tasks = mergeById(server.tasks, state.tasks);
            state.masterTasks = mergeById(server.masterTasks, state.masterTasks);
            state.recurringTasks = mergeById(server.recurringTasks, state.recurringTasks);
            state.notifications = mergeNotifications(server.notifications, state.notifications);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            return true;
        }

        async function pullFromServer() {
            if (!state.settings.sync) return false;
            try {
                const res = await fetch(API_URL);
                const server = await res.json();
                return applyServerData(server);
            } catch (err) {
                console.warn("Could not reach server:", err);
                return false;
            }
        }

        const save = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            if (state.settings.sync && state.session) {
                syncToServer();
            }
        };

        async function syncToServer() {
            await pullFromServer();
            const payload = { action: 'syncDatabase', database: state };
            fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        };

        function startAutoRefresh() {
            setInterval(async () => {
                if (state.session && state.settings.sync) {
                    const changed = await pullFromServer();
                    if (changed) render();
                }
            }, 25000);
        }

        function runEngines() {
            const now = new Date();
            const todayStr = now.toDateString();
            let changed = false;

            state.recurringTasks.forEach(r => {
                let shouldTrigger = false;
                const last = r.lastRun ? new Date(r.lastRun) : null;
                if (!last) shouldTrigger = true;
                else {
                    const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
                    if (r.freq === 'DAILY' && todayStr !== last.toDateString()) shouldTrigger = true;
                    if (r.freq === 'WEEKLY' && diffDays >= 7) shouldTrigger = true;
                    if (r.freq === 'MONTHLY' && (now.getMonth() !== last.getMonth() || now.getFullYear() !== last.getFullYear())) shouldTrigger = true;
                }

                if (shouldTrigger) {
                    state.tasks.unshift({ 
                        id: 'rt'+Date.now()+Math.random(), 
                        title: `[${r.freq}] ` + r.title, 
                        userId: state.session.id, 
                        status: 'TODO', 
                        date: now.toISOString().split('T')[0], 
                        priority: 'NORMAL' 
                    });
                    r.lastRun = todayStr;
                    state.notifications.unshift({ text: `Automation: ${r.title}`, read: false, time: now.toLocaleTimeString() });
                    changed = true;
                }
            });

            if(changed) save();
        }

        async function init() {
            await pullFromServer();
            if(state.settings.wallpaper) document.body.style.backgroundImage = `url(${state.settings.wallpaper})`;
            if(state.session) {
                runEngines();
                setInterval(runEngines, 60000);
            }
            startAutoRefresh();
            render();
        }

        function handleSetup() {
            const name = document.getElementById('s-name').value;
            const email = document.getElementById('s-email').value;
            const pass = document.getElementById('s-pass').value;
            if(!name || !email || !pass) return alert("Fill all fields");
            const u = { id: 'u1', name, email, password: pass, role: 'Admin', profileImg: '' };
            state.users.push(u); state.session = u; save(); render();
        }

        function handleLogin() {
            const e = document.getElementById('l-email').value.trim().toLowerCase();
            const p = document.getElementById('l-pass').value;
            const u = state.users.find(x => String(x.email).trim().toLowerCase() === e && String(x.password) === String(p));
            if(u) { state.session = u; save(); render(); } else alert("Invalid Login");
        }

        function nav(v) { state.settings.view = v; render(); }

        function render() {
            const root = document.getElementById('app-root');
            if (state.users.length === 0) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h2>Admin Setup</h2><input id="s-name" placeholder="Full Name"><input id="s-email" placeholder="Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleSetup()">Initialize System</button></div></div>`;
                return;
            }
            if (!state.session) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><img src="https://cdn-icons-png.flaticon.com/512/883/883360.png" width="80" style="margin-bottom:20px"><input id="l-email" placeholder="Email"><input id="l-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleLogin()">Login</button></div></div>`;
                return;
            }

            const isA = state.session.role === 'Admin';
            const unread = state.notifications.filter(n => !n.read).length;

            root.innerHTML = `
                <div class="app-container">
                    <aside class="sidebar">
                        <div class="sidebar-profile">
                            <img src="${state.session.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="profile-img"><br>
                            <b>${state.session.name}</b><br><small>${state.session.role}</small>
                        </div>
                        <nav class="nav-links">
                            <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
                            <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-check"></i> Tasks</div>
                            ${isA ? `<div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-users"></i> Staff</div>` : ''}
                            ${isA ? `<div class="nav-item ${state.settings.view==='automation'?'active':''}" onclick="nav('automation')"><i class="fas fa-robot"></i> Automations</div>` : ''}
                        </nav>
                        <div style="margin-top:auto; padding:20px"><button class="btn" style="width:100%; background:rgba(255,255,255,0.1); color:white;" onclick="state.session=null;render();">Logout</button></div>
                    </aside>
                    <main class="main-content">
                        <header class="top-bar">
                            <h1>${state.settings.view.toUpperCase()}</h1>
                            <div style="display:flex; gap:15px; align-items:center;">
                                <div class="notif-bell" onclick="nav('dashboard')"><i class="fas fa-bell"></i>${unread ? `<span class="notif-badge">${unread}</span>` : ''}</div>
                                ${isA ? `<button class="btn btn-p" onclick="document.getElementById('modal-task').classList.add('active')">+ New Task</button>` : ''}
                            </div>
                        </header>
                        <div id="view-mount"></div>
                    </main>
                </div>`;

            // Sync the staff dropdown for tasks
            const userSelect = document.getElementById('f-t-user');
            if(userSelect) {
                userSelect.innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            }

            renderView();
        }

        function renderView() {
            const mount = document.getElementById('view-mount');
            const v = state.settings.view;
            const isA = state.session.role === 'Admin';

            if(v === 'dashboard') {
                mount.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><span>Active Tasks</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                        <div class="stat-card"><span>Total Staff</span><h2>${state.users.length}</h2></div>
                        <div class="stat-card"><span>Notifications</span><h2>${state.notifications.length}</h2></div>
                        <div class="stat-card"><span>Database</span><p>${state.settings.sync?'Cloud Sync':'Offline'}</p></div>
                    </div>
                    <div class="panel"><h3>Recent Activity</h3>${state.notifications.slice(0,8).map(n=>`<div style="padding:10px 0; border-bottom:1px solid #f0f0f0"><small>${n.time}</small> - ${n.text}</div>`).join('') || 'No recent activity'}</div>`;
            } 
            else if(v === 'tasks') {
                const displayTasks = isA ? state.tasks : state.tasks.filter(t => t.userId === state.session.id);
                mount.innerHTML = `<div class="panel"><table><thead><tr><th>Task</th><th>Staff</th><th>Status</th><th>Action</th></tr></thead><tbody>
                ${displayTasks.map(t => {
                    const staff = state.users.find(u=>u.id===t.userId);
                    return `<tr>
                        <td><b>${t.title}</b><br><small>${t.date || 'No Date'}</small></td>
                        <td>${staff ? staff.name : 'Unassigned'}</td>
                        <td><span style="color:${t.status==='DONE'?'green':'orange'}">${t.status}</span></td>
                        <td>
                            <button class="btn-wa" style="background:#eee; color:#333; margin-right:5px;" onclick="toggleDone('${t.id}')">Check</button>
                            ${isA && staff?.phone ? `<button class="btn-wa" onclick="wa('${staff.phone}','${t.title}')"><i class="fab fa-whatsapp"></i></button>` : ''}
                        </td>
                    </tr>`}).join('')}
                </tbody></table></div>`;
            }
            else if(v === 'staff') {
                mount.innerHTML = `<div class="panel">
                    <h3>Add New Member</h3>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                        <input id="st-name" placeholder="Full Name">
                        <input id="st-email" placeholder="Email Address">
                        <input id="st-pass" type="password" placeholder="Password">
                        <input id="st-phone" placeholder="Phone (e.g. 919876543210)">
                    </div>
                    <select id="st-role"><option value="Staff">Staff</option><option value="Admin">Admin</option></select>
                    <button class="btn btn-p" onclick="addStaff()">Register Staff Member</button>
                </div>
                <div class="panel"><h3>Staff List</h3><table><thead><tr><th>Name</th><th>Role</th><th>Action</th></tr></thead><tbody>
                ${state.users.map(u => `<tr><td>${u.name}<br><small>${u.email}</small></td><td>${u.role}</td>
                <td>${u.id !== state.session.id ? `<button onclick="delStaff('${u.id}')" style="color:red; background:none; border:none; cursor:pointer">Remove</button>` : '<i>Active Now</i>'}</td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else if(v === 'automation') {
                mount.innerHTML = `<div class="panel">
                    <h3>Setup Auto-Task</h3>
                    <input id="ar-tit" placeholder="Task Name (e.g. Fridge Temp Check)">
                    <select id="ar-freq"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option></select>
                    <button class="btn btn-p" onclick="addRec()">Save Automation</button>
                    <hr>
                    ${state.recurringTasks.map(r => `<div class="panel" style="margin-top:10px; display:flex; justify-content:space-between"><span><b>${r.freq}</b>: ${r.title}</span> <button onclick="delRec('${r.id}')" style="color:red; border:none; background:none; cursor:pointer">Delete</button></div>`).join('')}
                </div>`;
            }
        }

        // IMPROVED ACTION FUNCTIONS
        function saveTask() {
            const title = document.getElementById('f-t-title').value;
            const date = document.getElementById('f-t-date').value;
            const priority = document.getElementById('f-t-pri').value;
            const userId = document.getElementById('f-t-user').value;

            if(!title) return alert("Task name required");

            state.tasks.unshift({
                id: 't' + Date.now(), 
                title, 
                userId, 
                status: 'TODO', 
                date, 
                priority
            });
            
            save();
            closeModal('modal-task');
            showToast("Task Assigned!");
            render();
        }

        function addStaff() {
            const name = document.getElementById('st-name').value;
            const email = document.getElementById('st-email').value;
            const pass = document.getElementById('st-pass').value;
            const phone = document.getElementById('st-phone').value;
            const role = document.getElementById('st-role').value;

            if(!name || !email || !pass) return alert("Fill mandatory fields");

            state.users.push({
                id: 'u' + Date.now(),
                name, email, password: pass, phone, role, profileImg: ''
            });

            save();
            showToast("Staff Registered");
            render();
        }

        function delStaff(id) {
            if(confirm("Delete this user?")) {
                state.users = state.users.filter(u => u.id !== id);
                save(); render();
            }
        }

        function addRec() {
            const title = document.getElementById('ar-tit').value;
            if(!title) return;
            state.recurringTasks.push({id:'r'+Date.now(), title, freq:document.getElementById('ar-freq').value, lastRun:''});
            save(); render();
        }

        function delRec(id) { state.recurringTasks=state.recurringTasks.filter(r=>r.id!==id); save(); render(); }
        
        function toggleDone(id) { 
            const t=state.tasks.find(x=>x.id===id); 
            if(t) {
                t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
                save(); 
                render(); 
            }
        }

        function wa(p, t) { 
            const cleanPhone = p.replace(/\D/g,'');
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent('Pharmacy Reminder: Please complete task - ' + t)}`, '_blank'); 
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showToast(m) { 
            const t=document.getElementById('toast'); 
            t.textContent=m; t.style.display='block'; 
            setTimeout(()=>t.style.display='none',3000); 
        }
    </script>
</body>
</html>
