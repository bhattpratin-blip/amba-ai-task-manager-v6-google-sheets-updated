<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy PRO Management v10.1</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --p: #10b981; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; 
            --m: #64748b; --l: #e2e8f0; --s: #064e3b; --d: #ef4444; 
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); 
        }
        body { margin: 0; background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; overflow: hidden; background-size: cover; background-position: center; transition: 0.3s; }
        .blur-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px); z-index: -1; }
        .auth-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: linear-gradient(135deg, #10b981 0%, #064e3b 100%); position: fixed; inset: 0; z-index: 9999; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--s); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-profile { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin: 2px 15px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--p); color: white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .panel { background: var(--c); border-radius: 20px; border: 1px solid var(--l); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--c); padding: 20px; border-radius: 16px; border: 1px solid var(--l); text-align: center; }
        .profile-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--p); margin-bottom: 10px; object-fit: cover; }
        .btn { padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; }
        .btn-wa { background: #25d366; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--l); }
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .bg-high { background: #fee2e2; color: #b91c1c; }
        .notif-bell { position: relative; cursor: pointer; font-size: 1.4rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--d); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--c); padding: 30px; border-radius: 24px; width: 450px; box-shadow: var(--shadow); }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--l); outline: none; background: var(--bg); }
    </style>
</head>
<body onload="init()">
    <div class="blur-overlay"></div>
    <div id="app-root"></div>
    <div id="toast"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
        const STORAGE_KEY = "PHARMACY_V10_PRO";

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            tasks: [], users: [], masterTasks: [], recurringTasks: [], notifications: [], session: null,
            settings: { darkMode: false, sync: true, view: 'dashboard', wallpaper: '', browserNotif: false }
        };

        const save = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            if(state.settings.sync && state.session) {
                const payload = { action: 'syncDatabase', database: state };
                fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        };

        // --- AUTOMATION ENGINE (Daily, Weekly, Monthly) ---
        function runEngines() {
            const now = new Date();
            const todayStr = now.toDateString();
            let changed = false;

            state.recurringTasks.forEach(r => {
                let shouldTrigger = false;
                const last = r.lastRun ? new Date(r.lastRun) : null;

                if (!last) {
                    shouldTrigger = true;
                } else {
                    const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
                    
                    if (r.freq === 'DAILY' && todayStr !== last.toDateString()) shouldTrigger = true;
                    if (r.freq === 'WEEKLY' && diffDays >= 7) shouldTrigger = true;
                    if (r.freq === 'MONTHLY' && (now.getMonth() !== last.getMonth() || now.getFullYear() !== last.getFullYear())) shouldTrigger = true;
                }

                if (shouldTrigger) {
                    state.tasks.unshift({ 
                        id: 'rt'+Date.now()+Math.random(), 
                        title: `[${r.freq}] ` + r.title, 
                        userId: state.session.id, 
                        status: 'TODO', 
                        date: now.toISOString().split('T')[0], 
                        priority: 'NORMAL' 
                    });
                    r.lastRun = todayStr;
                    state.notifications.unshift({ text: `Automation Triggered (${r.freq}): ${r.title}`, read: false, time: now.toLocaleTimeString() });
                    changed = true;
                }
            });

            // Overdue Alert
            state.tasks.forEach(t => {
                if (t.status !== 'DONE' && t.date && new Date(t.date) < now.setHours(0,0,0,0) && t.lastAlerted !== todayStr) {
                    state.notifications.unshift({ text: "🚨 OVERDUE: " + t.title, read: false, time: now.toLocaleTimeString(), urgent: true });
                    t.lastAlerted = todayStr;
                    changed = true;
                    sendBrowserNotif("Task Overdue", `The task "${t.title}" needs urgent attention.`);
                }
            });

            if(changed) save();
        }

        // --- BROWSER NOTIFICATION LOGIC ---
        function requestNotifPermission() {
            if (!("Notification" in window)) return;
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    state.settings.browserNotif = true;
                    save();
                    showToast("Browser Notifications Enabled");
                }
            });
        }

        function sendBrowserNotif(title, body) {
            if (state.settings.browserNotif && Notification.permission === "granted") {
                new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/883/883360.png' });
            }
        }

        function init() {
            if(state.settings.wallpaper) document.body.style.backgroundImage = `url(${state.settings.wallpaper})`;
            if(state.session) {
                runEngines();
                setInterval(runEngines, 60000); // Check every minute while app is open
            }
            render();
        }

        function handleSetup() {
            const u = { id: 'u1', name: document.getElementById('s-name').value, email: document.getElementById('s-email').value, password: document.getElementById('s-pass').value, role: 'Admin', profileImg: '' };
            if(!u.name || !u.email || !u.password) return alert("Fill all fields");
            state.users.push(u); state.session = u; save(); init();
        }

        function handleLogin() {
            const e = document.getElementById('l-email').value;
            const p = document.getElementById('l-pass').value;
            const u = state.users.find(x => x.email === e && x.password === p);
            if(u) { state.session = u; save(); init(); } else alert("Invalid Login");
        }

        function nav(v) { state.settings.view = v; render(); }

        function render() {
            const root = document.getElementById('app-root');
            if (state.users.length === 0) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>🛡️ Admin Setup</h1><input id="s-name" placeholder="Name"><input id="s-email" placeholder="Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleSetup()">Initialize</button></div></div>`;
                return;
            }
            if (!state.session) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>💊 Pharmacy Login</h1><input id="l-email" placeholder="Email" value="${state.users[0].email}"><input id="l-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleLogin()">Login</button></div></div>`;
                return;
            }

            const isA = state.session.role === 'Admin';
            const unread = state.notifications.filter(n => !n.read).length;

            root.innerHTML = `
                <div class="app-container">
                    <aside class="sidebar">
                        <div class="sidebar-profile">
                            <img src="${state.session.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="profile-img"><br>
                            <b>${state.session.name}</b><br><small style="opacity:0.7">${state.session.role}</small>
                        </div>
                        <nav class="nav-links">
                            <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
                            <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-check"></i> Tasks</div>
                            ${isA ? `<div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-users"></i> Staff</div>` : ''}
                            ${isA ? `<div class="nav-item ${state.settings.view==='automation'?'active':''}" onclick="nav('automation')"><i class="fas fa-robot"></i> Automations</div>` : ''}
                            <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> Settings</div>
                        </nav>
                        <div style="padding:20px"><button class="btn btn-danger" style="width:100%" onclick="state.session=null;save();render();">Logout</button></div>
                    </aside>
                    <main class="main-content">
                        <header class="top-bar">
                            <h1>${state.settings.view.toUpperCase()}</h1>
                            <div style="display:flex; gap:15px; align-items:center;">
                                <div class="notif-bell" onclick="nav('dashboard')"><i class="fas fa-bell"></i>${unread ? `<span class="notif-badge">${unread}</span>` : ''}</div>
                                ${isA ? `<button class="btn btn-p" onclick="downloadReport()">Excel</button>` : ''}
                                ${isA ? `<button class="btn btn-p" onclick="document.getElementById('modal-task').classList.add('active')">+ New Task</button>` : ''}
                            </div>
                        </header>
                        <div id="view-mount"></div>
                    </main>
                </div>`;
            renderView();
        }

        function renderView() {
            const mount = document.getElementById('view-mount');
            const v = state.settings.view;
            const isA = state.session.role === 'Admin';

            if(v === 'dashboard') {
                mount.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><span>Pending</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                        <div class="stat-card"><span>Staff</span><h2>${state.users.length}</h2></div>
                        <div class="stat-card"><span>Role</span><p>${state.session.role}</p></div>
                        <div class="stat-card"><span>Sync</span><p>${state.settings.sync?'Online':'Local'}</p></div>
                    </div>
                    <div class="panel"><h3>System Alerts</h3>${state.notifications.slice(0,5).map(n=>`<div>${n.text}</div>`).join('') || 'No alerts'}</div>`;
            } 
            else if(v === 'tasks') {
                mount.innerHTML = `<div class="panel"><table><thead><tr><th>Task</th><th>Staff</th><th>Action</th></tr></thead><tbody>
                ${state.tasks.map(t => `<tr><td><b>${t.title}</b></td><td>${state.users.find(u=>u.id===t.userId)?.name || '-'}</td>
                <td><button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button>
                ${t.status!=='DONE' && state.users.find(u=>u.id===t.userId)?.phone ? `<button class="btn-wa" onclick="wa('${state.users.find(u=>u.id===t.userId).phone}','${t.title}')"><i class="fab fa-whatsapp"></i></button>` : ''}</td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else if(v === 'automation') {
                mount.innerHTML = `<div class="panel"><h3>Create Automated Task</h3>
                    <input id="ar-tit" placeholder="Task Name">
                    <select id="ar-freq"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option></select>
                    <button class="btn btn-p" onclick="addRec()">Add Automation</button>
                    <hr><h3>Current Schedules</h3>
                    ${state.recurringTasks.map(r => `<div><b>${r.freq}</b>: ${r.title} <button onclick="delRec('${r.id}')" style="color:red;border:none;background:none">X</button></div>`).join('')}
                </div>`;
            }
            else if(v === 'settings') {
                mount.innerHTML = `<div class="panel">
                    <h3>Notifications</h3>
                    <button class="btn btn-p" onclick="requestNotifPermission()">Enable Chrome Push Notifications</button>
                    <hr><h3>Profile</h3>
                    <input id="p-url" placeholder="Profile Image URL" value="${state.session.profileImg}">
                    <button class="btn btn-p" onclick="state.session.profileImg=document.getElementById('p-url').value;save();render();">Update Photo</button>
                </div>`;
            }
        }

        // Action Functions
        function saveTask() {
            state.tasks.unshift({id:'t'+Date.now(), title:document.getElementById('f-t-title').value, userId:'u1', status:'TODO', date:document.getElementById('f-t-date').value, priority:document.getElementById('f-t-pri').value});
            save(); render();
        }
        function addRec() {
            state.recurringTasks.push({id:'r'+Date.now(), title:document.getElementById('ar-tit').value, freq:document.getElementById('ar-freq').value, lastRun:''});
            save(); render();
        }
        function delRec(id) { state.recurringTasks=state.recurringTasks.filter(r=>r.id!==id); save(); render(); }
        function toggleDone(id) { const t=state.tasks.find(x=>x.id===id); if(t) t.status=t.status==='DONE'?'TODO':'DONE'; save(); render(); }
        function wa(p, t) { window.open(`https://wa.me/${p.replace(/\D/g,'')}?text=${encodeURIComponent('Hello, reminder for task: '+t)}`, '_blank'); }
        function downloadReport() { const ws=XLSX.utils.json_to_sheet(state.tasks); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tasks"); XLSX.writeFile(wb, "Report.xlsx"); }
        function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    </script>
</body>
</html>
