<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V8.1 | Employee Edition</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #1e293b;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.2s; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }

        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid #334155; }
        .sidebar-header span { color: var(--primary); }
        .nav-links { flex: 1; padding: 20px 15px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #334155; }
        .logout-btn { width: 100%; padding: 12px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        /* Grid Layouts */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-card span { font-size: 0.75rem; color: var(--muted); font-weight: 700; }
        .stat-card h2 { margin: 5px 0 0; font-size: 1.6rem; }

        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; margin-bottom: 25px; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--muted); font-size: 0.8rem; padding: 10px; border-bottom: 2px solid var(--line); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }

        /* Employee Cards */
        .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .emp-card { background: var(--card); border: 1px solid var(--line); padding: 20px; border-radius: 16px; text-align: center; }
        .emp-card img { width: 60px; height: 60px; border-radius: 50%; background: #e2e8f0; margin-bottom: 10px; }
        .emp-card h3 { margin: 5px 0; }
        .emp-card p { color: var(--muted); font-size: 0.8rem; margin-bottom: 15px; }

        /* Buttons & Badges */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .bg-high { background: #fee2e2; color: #b91c1c; }
        .bg-done { background: #dcfce7; color: #15803d; }
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; font-size: 0.8rem; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; }
        .modal input, .modal select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }

        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; }
    </style>
</head>
<body onload="init()">

<div id="app-shell"></div>

<!-- Modal: Add Task -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h2>New Task</h2>
        <input type="text" id="f-title" placeholder="Task Title">
        <input type="date" id="f-date">
        <select id="f-emp"></select> <!-- Populated by JS -->
        <select id="f-pri">
            <option value="HIGH">High Priority</option>
            <option value="MEDIUM" selected>Medium Priority</option>
            <option value="LOW">Low Priority</option>
        </select>
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">Create Task</button>
        <button onclick="closeModal('task-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- Modal: Add Employee -->
<div class="modal-overlay" id="emp-modal">
    <div class="modal">
        <h2>Add Employee</h2>
        <input type="text" id="fe-name" placeholder="Full Name">
        <input type="text" id="fe-role" placeholder="Job Role (e.g. Designer)">
        <button class="btn btn-primary" onclick="addEmployee()" style="width:100%">Save Employee</button>
        <button onclick="closeModal('emp-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. STATE MANAGEMENT
// ==========================================
const STORAGE_KEY = "AMBA_V8_PRO_DATA";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    employees: [{id: 'e1', name: 'Admin User', role: 'Manager'}],
    notifications: [],
    recurring: [],
    settings: { userName: "Admin", darkMode: false },
    view: 'dashboard'
};

const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
};

// ==========================================
// 2. CORE RENDERING
// ==========================================
function init() {
    render();
}

function render() {
    const shell = document.getElementById('app-shell');
    document.body.className = state.settings.darkMode ? 'dark' : '';
    const unread = state.notifications.filter(n => !n.read).length;

    shell.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">AMBA <span>AI</span> V8.1</div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-tasks"></i> <span>Tasks</span></div>
                    <div class="nav-item ${state.view==='employees'?'active':''}" onclick="nav('employees')"><i class="fas fa-users"></i> <span>Team Members</span></div>
                    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer"><button class="logout-btn" onclick="logout()">LOGOUT</button></div>
            </aside>

            <main class="main-content">
                <header class="top-bar">
                    <h1>${state.view.toUpperCase()}</h1>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <div class="notif-bell"><i class="fas fa-bell"></i>${unread ? `<span class="notif-badge">${unread}</span>` : ''}</div>
                        <button class="btn btn-primary" onclick="showTaskModal()">+ New Task</button>
                    </div>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>
    `;
    renderView();
}

function nav(v) { state.view = v; render(); }

// ==========================================
// 3. VIEWS
// ==========================================
function renderView() {
    const mount = document.getElementById('view-mount');
    
    if (state.view === 'dashboard') {
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><span>TOTAL TASKS</span><h2>${state.tasks.length}</h2></div>
                <div class="stat-card"><span>TEAM MEMBERS</span><h2>${state.employees.length}</h2></div>
                <div class="stat-card"><span>PENDING</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                <div class="stat-card"><span>COMPLETED</span><h2>${state.tasks.filter(t=>t.status==='DONE').length}</h2></div>
            </div>
            <div class="panel">
                <h3>Recent Activity</h3>
                <table>
                    <thead><tr><th>Task</th><th>Assigned To</th><th>Status</th></tr></thead>
                    <tbody>
                        ${state.tasks.slice(0, 5).map(t => {
                            const emp = state.employees.find(e => e.id === t.assignedTo);
                            return `<tr>
                                <td>${t.title}</td>
                                <td><b>${emp ? emp.name : 'Unassigned'}</b></td>
                                <td><span class="badge ${t.status==='DONE'?'bg-done':'bg-high'}">${t.status}</span></td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;
    } 
    else if (state.view === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Task Name</th><th>Assignee</th><th>Due Date</th><th>Priority</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => {
                            const emp = state.employees.find(e => e.id === t.assignedTo);
                            return `<tr>
                                <td>${t.title}</td>
                                <td>${emp ? emp.name : '-'}</td>
                                <td>${t.date || '-'}</td>
                                <td><span class="badge bg-high">${t.priority}</span></td>
                                <td><button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    else if (state.view === 'employees') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>Your Team Members</h3>
                <button class="btn btn-primary" onclick="showEmpModal()">+ Add Employee</button>
            </div>
            <div class="emp-grid">
                ${state.employees.map(e => `
                    <div class="emp-card">
                        <div style="font-size:2rem; margin-bottom:10px;">👤</div>
                        <h3>${e.name}</h3>
                        <p>${e.role}</p>
                        <div style="font-size:0.75rem; color:var(--muted); margin-bottom:15px;">
                            Active Tasks: ${state.tasks.filter(t => t.assignedTo === e.id && t.status !== 'DONE').length}
                        </div>
                        <button class="btn-danger btn" onclick="deleteEmployee('${e.id}')">Remove</button>
                    </div>
                `).join('')}
            </div>
        `;
    }
    else if (state.view === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:400px;">
                <button class="btn btn-primary" style="width:100%" onclick="state.settings.darkMode = !state.settings.darkMode; save(); render();">Toggle Dark Mode</button>
                <p style="margin-top:20px; font-size:0.8rem; color:var(--muted);">More settings coming soon.</p>
            </div>
        `;
    }
}

// ==========================================
// 4. LOGIC FUNCTIONS
// ==========================================
function showTaskModal() {
    const sel = document.getElementById('f-emp');
    sel.innerHTML = state.employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    document.getElementById('task-modal').classList.add('active');
}

function showEmpModal() { document.getElementById('emp-modal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function addTask() {
    const title = document.getElementById('f-title').value;
    if(!title) return;
    state.tasks.unshift({
        id: 't' + Date.now(),
        title: title,
        date: document.getElementById('f-date').value,
        assignedTo: document.getElementById('f-emp').value,
        priority: document.getElementById('f-pri').value,
        status: 'TODO'
    });
    save(); closeModal('task-modal'); render();
}

function addEmployee() {
    const name = document.getElementById('fe-name').value;
    const role = document.getElementById('fe-role').value;
    if(!name) return;
    state.employees.push({ id: 'e' + Date.now(), name, role });
    save(); closeModal('emp-modal'); render();
}

function deleteEmployee(id) {
    if(confirm("Are you sure? This will unassign their tasks.")) {
        state.employees = state.employees.filter(e => e.id !== id);
        save(); render();
    }
}

function toggleDone(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) { t.status = t.status === 'DONE' ? 'TODO' : 'DONE'; save(); render(); }
}

function logout() { if(confirm("Logout and clear data?")) { localStorage.clear(); location.reload(); } }

</script>
</body>
</html>
