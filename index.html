<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Manager V8.6 | Pro</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981; --primary-hover: #059669;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #064e3b;
            --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        /* Login Screen */
        .login-screen { height: 100vh; display: grid; place-items: center; background: #f1f5f9; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: var(--primary); margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--line); }

        /* App Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.1rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        /* Notifications */
        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; color: var(--muted); }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg); }
        .notif-pane { display: none; position: absolute; top: 60px; right: 0; width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); z-index: 1000; }
        .notif-pane.active { display: block; }
        .notif-item { padding: 12px; border-bottom: 1px solid var(--line); font-size: 0.8rem; line-height: 1.4; }

        /* UI Components */
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-danger { background: var(--danger); color: white; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--line); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .bg-urgent { background: #fee2e2; color: #b91c1c; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; box-shadow: var(--shadow); }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>

<!-- Master Task Modal -->
<div class="modal-overlay" id="master-modal">
    <div class="modal">
        <h2>Create Template</h2>
        <input type="text" id="mt-title" placeholder="Template Name (e.g. Fridge Temp Check)">
        <select id="mt-pri">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">Urgent</option>
        </select>
        <button class="btn btn-primary" onclick="addMaster()" style="width:100%">Save Template</button>
        <button onclick="closeModal('master-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- Staff/User Modal -->
<div class="modal-overlay" id="user-modal">
    <div class="modal">
        <h2>Add Staff Member</h2>
        <input type="text" id="fu-name" placeholder="Full Name">
        <input type="email" id="fu-email" placeholder="Email Address">
        <input type="password" id="fu-pass" placeholder="Password">
        <input type="text" id="fu-phone" placeholder="WhatsApp Number (e.g. 91...)">
        <select id="fu-role">
            <option value="Pharmacist">Pharmacist</option>
            <option value="Assistant">Assistant</option>
        </select>
        <button class="btn btn-primary" onclick="addUser()" style="width:100%">Create Account</button>
        <button onclick="closeModal('user-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h2>New Task</h2>
        <input type="text" id="ft-title" placeholder="What needs to be done?">
        <select id="ft-user"></select>
        <input type="date" id="ft-date">
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">Save Task</button>
        <button onclick="closeModal('task-modal')" style="width:100%; border:none; background:none; margin-top:10px; cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. DATA STATE
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const STORAGE_KEY = "PHARMACY_PRO_V8_6";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    users: [{id: 'u1', name: 'Admin', email: 'admin@pharmacy.local', password: '123', phone: '', role: 'Admin'}],
    masterTasks: [],
    recurring: [],
    notifications: [],
    session: null,
    settings: { darkMode: false, sync: true },
    view: 'dashboard'
};

const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(state.settings.sync) syncCloud();
};

async function syncCloud() {
    try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncDatabase', database: state }) }); } catch(e) {}
}

// ==========================================
// 2. ENGINES (Automation & Alerts)
// ==========================================
function runEngines() {
    const today = new Date();
    today.setHours(0,0,0,0);
    const todayStr = today.toDateString();
    let change = false;

    // Recurring Check
    state.recurring.forEach(r => {
        if (r.lastRun !== todayStr) {
            state.tasks.unshift({ id: 'rt'+Date.now(), title: "[AUTO] "+r.title, userId: 'u1', status: 'TODO', date: new Date().toISOString().split('T')[0], priority: 'MEDIUM' });
            r.lastRun = todayStr;
            pushNotif("🔄 Recurring task generated: " + r.title);
            change = true;
        }
    });

    // Overdue Check
    state.tasks.forEach(t => {
        if (t.status !== 'DONE' && t.date) {
            if (new Date(t.date) < today && t.lastAlerted !== todayStr) {
                pushNotif(`⚠️ OVERDUE: "${t.title}" is incomplete!`, 'danger');
                t.lastAlerted = todayStr;
                change = true;
            }
        }
    });

    if(change) save();
}

function pushNotif(text, type = 'info') {
    state.notifications.unshift({ id: Date.now(), text, type, read: false, time: new Date().toLocaleTimeString() });
}

// ==========================================
// 3. MAIN RENDER
// ==========================================
function init() { runEngines(); render(); }

function handleLogin() {
    const e = document.getElementById('l-email').value;
    const p = document.getElementById('l-pass').value;
    const found = state.users.find(u => u.email === e && u.password === p);
    if(found) { state.session = found; save(); render(); } else alert("Invalid Login");
}

function logout() { state.session = null; save(); render(); }

function nav(v) { state.view = v; render(); }

function render() {
    const root = document.getElementById('app-root');
    if (!state.session) {
        root.innerHTML = `
            <div class="login-screen">
                <div class="login-card">
                    <h1>💊 Pharmacy Pro</h1>
                    <input type="email" id="l-email" placeholder="Email (admin@pharmacy.local)" value="admin@pharmacy.local">
                    <input type="password" id="l-pass" placeholder="Password (123)" value="123">
                    <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button>
                </div>
            </div>`;
        return;
    }

    const unread = state.notifications.filter(n => !n.read).length;
    document.body.className = state.settings.darkMode ? 'dark' : '';
    root.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">PHARMACY MGMT</div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-check"></i> <span>Tasks</span></div>
                    <div class="nav-item ${state.view==='users'?'active':''}" onclick="nav('users')"><i class="fas fa-user-group"></i> <span>Staff Members</span></div>
                    <div class="nav-item ${state.view==='master'?'active':''}" onclick="nav('master')"><i class="fas fa-copy"></i> <span>Templates</span></div>
                    <div class="nav-item ${state.view==='recurring'?'active':''}" onclick="nav('recurring')"><i class="fas fa-clock"></i> <span>Automations</span></div>
                    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer"><button class="btn-danger btn" style="width:100%" onclick="logout()">Logout</button></div>
            </aside>
            <main class="main-content">
                <header class="top-bar">
                    <h1>${state.view.toUpperCase()}</h1>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <div class="notif-bell" onclick="toggleNotifs()">
                            <i class="fas fa-bell"></i>
                            ${unread ? `<span class="notif-badge">${unread}</span>` : ''}
                            <div class="notif-pane" id="notif-box">
                                <div style="padding:10px; font-weight:800; border-bottom:1px solid var(--line)">Recent Alerts</div>
                                ${state.notifications.map(n => `<div class="notif-item">${n.text}</div>`).join('') || '<div class="notif-item">No alerts</div>'}
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="showTaskModal()">+ New Task</button>
                    </div>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>`;
    renderView();
}

function renderView() {
    const mount = document.getElementById('view-mount');
    const v = state.view;

    if (v === 'dashboard') {
        mount.innerHTML = `
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; margin-bottom:30px;">
                <div class="panel"><span>Pending Tasks</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                <div class="panel"><span>Staff Members</span><h2>${state.users.length}</h2></div>
                <div class="panel"><span>Efficiency</span><h2>${state.tasks.length ? Math.round((state.tasks.filter(t=>t.status==='DONE').length/state.tasks.length)*100) : 0}%</h2></div>
            </div>
            <div class="panel">
                <h3>Cloud Sync Status</h3>
                <button class="btn btn-primary" onclick="syncCloud()">Push Data to Google Sheet</button>
            </div>`;
    }
    else if (v === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Task</th><th>Assignee</th><th>Due</th><th>Status</th><th>WhatsApp</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => {
                            const u = state.users.find(x => x.id === t.userId);
                            return `<tr>
                                <td>${t.title}</td>
                                <td>${u ? u.name : '-'}</td>
                                <td>${t.date || '-'}</td>
                                <td><button onclick="toggleTask('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                                <td>${t.status!=='DONE' && u && u.phone ? `<button class="btn btn-whatsapp" onclick="wa('${u.phone}', '${t.title}')"><i class="fab fa-whatsapp"></i></button>` : '-'}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (v === 'users') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><h3>Staff Directory</h3><button class="btn btn-primary" onclick="showUserModal()">+ Add Staff</button></div>
            <div class="panel">
                <table>
                    <thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.users.map(u => `<tr><td>${u.name}</td><td>${u.role}</td><td>${u.email}</td><td><button onclick="delUser('${u.id}')">Delete</button></td></tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (v === 'master') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><h3>Templates</h3><button class="btn btn-primary" onclick="showMasterModal()">+ Create</button></div>
            <div class="panel">
                <table>
                    <thead><tr><th>Template Name</th><th>Priority</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.masterTasks.map(m => `<tr><td>${m.title}</td><td>${m.priority}</td><td><button class="btn btn-primary" onclick="applyMaster('${m.id}')">Apply</button></td></tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }
    else if (v === 'recurring') {
        mount.innerHTML = `
            <div class="panel">
                <h3>Scheduled Automations</h3>
                <div style="display:flex; gap:10px; margin-bottom:20px;"><input type="text" id="ar-title" placeholder="Morning Fridge Check..."><button class="btn btn-primary" onclick="addRec()">Add Daily Automation</button></div>
                ${state.recurring.map(r => `<div style="padding:10px; border-bottom:1px solid var(--line)">🔄 ${r.title}</div>`).join('')}
            </div>`;
    }
    else if (v === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:400px;">
                <h3>System</h3>
                <button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="state.settings.darkMode=!state.settings.darkMode; save(); render();">Toggle Dark Mode</button>
                <button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="state.settings.sync=!state.settings.sync; save(); render();">Auto-Sync: ${state.settings.sync?'ON':'OFF'}</button>
                <button class="btn-danger btn" style="width:100%" onclick="resetSystem()">Factory Reset</button>
            </div>`;
    }
}

// ==========================================
// 4. LOGIC FUNCTIONS
// ==========================================
function showTaskModal() {
    document.getElementById('ft-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    document.getElementById('task-modal').classList.add('active');
}
function showUserModal() { document.getElementById('user-modal').classList.add('active'); }
function showMasterModal() { document.getElementById('master-modal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function toggleNotifs() { document.getElementById('notif-box').classList.toggle('active'); state.notifications.forEach(n=>n.read=true); }

function addTask() {
    const title = document.getElementById('ft-title').value;
    const userId = document.getElementById('ft-user').value;
    const date = document.getElementById('ft-date').value;
    if(!title) return;
    state.tasks.unshift({ id: 't'+Date.now(), title, userId, date, status: 'TODO', priority: 'MEDIUM' });
    save(); closeModal('task-modal'); render();
}

function addUser() {
    const name = document.getElementById('fu-name').value;
    const email = document.getElementById('fu-email').value;
    const password = document.getElementById('fu-pass').value;
    const phone = document.getElementById('fu-phone').value;
    const role = document.getElementById('fu-role').value;
    state.users.push({ id: 'u'+Date.now(), name, email, password, phone, role });
    save(); closeModal('user-modal'); render();
}

function addMaster() {
    const title = document.getElementById('mt-title').value;
    const priority = document.getElementById('mt-pri').value;
    state.masterTasks.push({ id: 'm'+Date.now(), title, priority });
    save(); closeModal('master-modal'); render();
}

function applyMaster(id) {
    const m = state.masterTasks.find(x => x.id === id);
    state.tasks.unshift({ id: 't'+Date.now(), title: m.title, userId: 'u1', status: 'TODO', date: new Date().toISOString().split('T')[0], priority: m.priority });
    save(); nav('tasks');
}

function addRec() {
    const title = document.getElementById('ar-title').value;
    if(!title) return;
    state.recurring.push({ id: 'r'+Date.now(), title, lastRun: '' });
    save(); render();
}

function toggleTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) { t.status = t.status === 'DONE' ? 'TODO' : 'DONE'; save(); render(); }
}

function wa(phone, task) {
    const clean = phone.replace(/\D/g, '');
    window.open(`https://wa.me/${clean}?text=${encodeURIComponent('Reminder: Task "'+task+'" is pending.')}`, '_blank');
}

function delUser(id) { if(id==='u1') return; state.users = state.users.filter(u=>u.id!==id); save(); render(); }
function resetSystem() { if(confirm("WIPE ALL DATA?")) { localStorage.clear(); location.reload(); } }

</script>
</body>
</html>
