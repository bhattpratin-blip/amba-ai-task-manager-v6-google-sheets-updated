<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V7</title>
    <!-- External Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #1e293b;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
            --muted: #94a3b8; --line: #334155; --sidebar: #0f172a;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); transition: all 0.3s ease; }

        /* Layout Structure */
        .app-container { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; transition: 0.3s; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid #334155; }
        .sidebar-header span { color: var(--primary); }
        .nav-links { flex: 1; padding: 20px 15px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .nav-item i { width: 20px; text-align: center; }

        /* Main Content */
        .main-content { flex: 1; margin-left: 260px; padding: 30px; }
        
        /* Top Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-box { position: relative; width: 300px; }
        .search-box input { width: 100%; padding: 10px 15px 10px 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
        .search-box i { position: absolute; left: 15px; top: 12px; color: var(--muted); }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .stat-card i { position: absolute; right: 20px; top: 20px; font-size: 2rem; opacity: 0.1; color: var(--primary); }
        .stat-card span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
        .stat-card h2 { margin: 10px 0 0; font-size: 1.8rem; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 350px; gap: 25px; }
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        /* Task Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--muted); font-size: 0.85rem; border-bottom: 1px solid var(--line); }
        td { padding: 15px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .priority-HIGH { background: #fee2e2; color: #991b1b; }
        .priority-MEDIUM { background: #fef3c7; color: #92400e; }
        .priority-LOW { background: #dcfce7; color: #166534; }
        
        /* AI Assistant Box */
        .ai-chat-box { display: flex; flex-direction: column; height: 450px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; max-width: 85%; }
        .msg.user { align-self: flex-end; background: var(--primary); color: white; }
        .msg.bot { align-self: flex-start; background: var(--line); color: var(--text); }
        .ai-input-area { display: flex; gap: 10px; margin-top: 15px; }
        .ai-input-area input { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }

        /* Buttons */
        .btn { padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--card); border: 1px solid var(--line); color: var(--text); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; place-items: center; padding: 20px; }
        .modal-overlay.active { display: grid; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; box-shadow: var(--shadow); }

        /* Mobile */
        @media (max-width: 1024px) {
            .sidebar { width: 70px; }
            .sidebar span, .sidebar-header { display: none; }
            .main-content { margin-left: 70px; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div id="app-root"></div>

<script>
// ==========================================
// CORE STATE & CONFIG
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const STORAGE_KEY = "AMBA_V7_DATA";

let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    employees: [{id: 'e1', name: 'Rahul'}],
    masterTasks: [],
    notifications: [],
    recurringTasks: []
};

let currentView = 'dashboard';
let session = { user: 'Admin' };

const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    syncToSheets();
};

async function syncToSheets() {
    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'syncDatabase', database: db })
        });
    } catch(e) { console.warn("Cloud sync failed, using local."); }
}

// ==========================================
// UI COMPONENTS
// ==========================================

function renderApp() {
    const root = document.getElementById('app-root');
    root.innerHTML = `
        <div class="app-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">AMBA <span>AI</span></div>
                <nav class="nav-links">
                    <a class="nav-item ${currentView==='dashboard'?'active':''}" onclick="setView('dashboard')">
                        <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
                    </a>
                    <a class="nav-item ${currentView==='tasks'?'active':''}" onclick="setView('tasks')">
                        <i class="fas fa-tasks"></i> <span>Task Manager</span>
                    </a>
                    <a class="nav-item ${currentView==='master'?'active':''}" onclick="setView('master')">
                        <i class="fas fa-book"></i> <span>Master Tasks</span>
                    </a>
                    <a class="nav-item ${currentView==='employees'?'active':''}" onclick="setView('employees')">
                        <i class="fas fa-users"></i> <span>Employees</span>
                    </a>
                    <hr style="border:0; border-top:1px solid #334155; margin: 15px 0;">
                    <a class="nav-item" onclick="toggleDarkMode()">
                        <i class="fas fa-moon"></i> <span>Toggle Theme</span>
                    </a>
                    <a class="nav-item" onclick="exportToExcel()">
                        <i class="fas fa-file-export"></i> <span>Export Excel</span>
                    </a>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <header class="top-bar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search everything..." oninput="handleSearch(this.value)">
                    </div>
                    <div style="display:flex; gap:15px; align-items:center;">
                        <button class="btn btn-primary" onclick="openTaskModal()">
                            <i class="fas fa-plus"></i> New Task
                        </button>
                        <div style="font-weight:700;">${session.user}</div>
                    </div>
                </header>

                <div id="view-container"></div>
            </main>
        </div>

        <!-- Task Modal -->
        <div class="modal-overlay" id="task-modal">
            <div class="modal-content">
                <h2>Create New Task</h2>
                <div style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
                    <input type="text" id="task-title" placeholder="Task Title" style="padding:12px; border-radius:8px; border:1px solid var(--line);">
                    <select id="task-priority" style="padding:12px; border-radius:8px; border:1px solid var(--line);">
                        <option value="LOW">Low Priority</option>
                        <option value="MEDIUM" selected>Medium Priority</option>
                        <option value="HIGH">High Priority</option>
                    </select>
                    <input type="date" id="task-date" style="padding:12px; border-radius:8px; border:1px solid var(--line);">
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn btn-secondary" onclick="closeModals()" style="flex:1">Cancel</button>
                        <button class="btn btn-primary" onclick="addTask()" style="flex:1">Create Task</button>
                    </div>
                </div>
            </div>
        </div>
    `;
    renderView();
}

function renderView() {
    const container = document.getElementById('view-container');
    if (currentView === 'dashboard') {
        container.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card">
                    <span>TOTAL TASKS</span>
                    <h2>${db.tasks.length}</h2>
                    <i class="fas fa-list-check"></i>
                </div>
                <div class="stat-card">
                    <span>PENDING</span>
                    <h2 style="color:var(--warning)">${db.tasks.filter(t=>t.status!=='DONE').length}</h2>
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-card">
                    <span>COMPLETED</span>
                    <h2 style="color:var(--success)">${db.tasks.filter(t=>t.status==='DONE').length}</h2>
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-card">
                    <span>PRODUCTIVITY</span>
                    <h2>${db.tasks.length ? Math.round((db.tasks.filter(t=>t.status==='DONE').length / db.tasks.length)*100) : 0}%</h2>
                    <i class="fas fa-bolt"></i>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="panel">
                    <div class="panel-header">
                        <h3>Recent Tasks</h3>
                        <button class="btn btn-secondary" style="padding:5px 10px; font-size:0.8rem;" onclick="setView('tasks')">View All</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Task Name</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${db.tasks.slice(0, 6).map(t => `
                                <tr>
                                    <td><strong>${t.title}</strong><br><small style="color:var(--muted)">${t.date || 'No date'}</small></td>
                                    <td><span class="badge priority-${t.priority}">${t.priority}</span></td>
                                    <td>${t.status === 'DONE' ? '✅ Finished' : '⌛ Pending'}</td>
                                    <td>
                                        <button onclick="toggleStatus('${t.id}')" style="background:none; border:none; cursor:pointer; color:var(--primary)"><i class="fas fa-sync"></i></button>
                                        <button onclick="deleteTask('${t.id}')" style="background:none; border:none; cursor:pointer; color:var(--danger); margin-left:10px;"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('') || '<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--muted);">No tasks found. Create one to start!</td></tr>'}
                        </tbody>
                    </table>
                </div>

                <div class="panel">
                    <h3>🤖 AI Assistant</h3>
                    <div class="ai-chat-box">
                        <div class="chat-messages" id="chat-msgs">
                            <div class="msg bot">Hello! I am Amba AI. I can create tasks for you or help you plan your day. Just type below!</div>
                        </div>
                        <div class="ai-input-area">
                            <input type="text" id="ai-input" placeholder="Plan a meeting tomorrow..." onkeypress="if(event.key==='Enter') handleAI()">
                            <button class="btn btn-primary" onclick="handleAI()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    } else {
        container.innerHTML = `<div class="panel"><h2>${currentView.toUpperCase()}</h2><p style="color:var(--muted)">Module under construction for V7 update.</p></div>`;
    }
}

// ==========================================
// LOGIC FUNCTIONS
// ==========================================

function setView(v) { currentView = v; renderApp(); }

function toggleDarkMode() { document.body.classList.toggle('dark'); }

function openTaskModal() { document.getElementById('task-modal').classList.add('active'); }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }

function addTask() {
    const title = document.getElementById('task-title').value;
    const priority = document.getElementById('task-priority').value;
    const date = document.getElementById('task-date').value;

    if (!title) return alert("Please enter a title");

    db.tasks.unshift({
        id: 't' + Date.now(),
        title, priority, date,
        status: 'TODO'
    });

    save();
    closeModals();
    renderView();
}

function toggleStatus(id) {
    const task = db.tasks.find(t => t.id === id);
    if(task) {
        task.status = task.status === 'DONE' ? 'TODO' : 'DONE';
        save(); renderView();
    }
}

function deleteTask(id) {
    if(confirm("Are you sure?")) {
        db.tasks = db.tasks.filter(t => t.id !== id);
        save(); renderView();
    }
}

function handleAI() {
    const input = document.getElementById('ai-input');
    const msg = input.value.trim();
    if (!msg) return;

    const chat = document.getElementById('chat-msgs');
    chat.innerHTML += `<div class="msg user">${msg}</div>`;
    input.value = '';

    setTimeout(() => {
        chat.innerHTML += `<div class="msg bot">Understood. I have added "<strong>${msg}</strong>" to your task list.</div>`;
        db.tasks.unshift({
            id: 'tai' + Date.now(),
            title: msg,
            priority: 'MEDIUM',
            date: new Date().toISOString().split('T')[0],
            status: 'TODO'
        });
        save();
        renderView();
        chat.scrollTop = chat.scrollHeight;
    }, 800);
}

function exportToExcel() {
    const ws = XLSX.utils.json_to_sheet(db.tasks);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Tasks");
    XLSX.writeFile(wb, "Amba_Tasks_V7.xlsx");
}

// ==========================================
// INIT
// ==========================================
renderApp();
</script>

</body>
</html>
