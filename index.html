<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Management PRO</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #10b981; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; --m: #64748b; --l: #e2e8f0; --s: #064e3b; --d: #ef4444; --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        body { margin: 0; background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; overflow: hidden; background-size: cover; background-position: center; transition: 0.3s; }
        
        /* Auth Screen */
        .auth-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: linear-gradient(135deg, #10b981 0%, #064e3b 100%); position: fixed; inset: 0; z-index: 9999; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
        
        /* Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); }
        .sidebar { width: 260px; background: var(--s); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-profile { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { flex: 1; padding: 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--p); color: white; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .panel { background: var(--c); border-radius: 16px; border: 1px solid var(--l); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        
        /* UI Components */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--c); padding: 20px; border-radius: 16px; border: 1px solid var(--l); text-align: center; }
        .stat-card h2 { margin: 10px 0 0; font-size: 1.8rem; font-weight: 800; }
        .profile-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid var(--p); margin-bottom: 10px; }
        
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; }
        .btn-danger { background: var(--d); color: white; }
        .btn-wa { background: #25d366; color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--l); outline: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--l); }

        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--d); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 10px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(3px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--c); padding: 30px; border-radius: 20px; width: 420px; box-shadow: var(--shadow); }
        
        #toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; z-index: 3000; }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>
<div id="toast"></div>

<!-- Modals -->
<div class="modal-overlay" id="modal-task">
    <div class="modal">
        <h2>Assign New Task</h2>
        <input id="f-t-title" placeholder="What is the task?">
        <select id="f-t-user"></select>
        <input type="date" id="f-t-date">
        <button class="btn btn-p" style="width:100%" onclick="saveTask()">Save Task</button>
        <button class="btn" style="width:100%;margin-top:10px; background:none;" onclick="closeModal('modal-task')">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="modal-user">
    <div class="modal">
        <h2>Add Staff Member</h2>
        <input id="f-u-name" placeholder="Full Name">
        <input id="f-u-email" placeholder="Email Address">
        <input id="f-u-pass" type="password" placeholder="Password">
        <input id="f-u-phone" placeholder="WhatsApp (91...)">
        <button class="btn btn-p" style="width:100%" onclick="saveUser()">Register Staff</button>
        <button class="btn" style="width:100%;margin-top:10px; background:none;" onclick="closeModal('modal-user')">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="modal-master">
    <div class="modal">
        <h2>Create Master Template</h2>
        <input id="f-m-title" placeholder="Template Name">
        <button class="btn btn-p" style="width:100%" onclick="saveMaster()">Save Template</button>
        <button class="btn" style="width:100%;margin-top:10px; background:none;" onclick="closeModal('modal-master')">Cancel</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. FAIL-SAFE INITIALIZATION
    // ==========================================
    function init() {
        console.log("App Initializing...");
        try {
            if(state.settings.wallpaper) {
                document.body.style.backgroundImage = `url(${state.settings.wallpaper})`;
            }
            if(state.session) runEngines();
            render();
        } catch (e) {
            console.error("Critical Start Error:", e);
            alert("App failed to start. Resetting local cache...");
            localStorage.clear();
            location.reload();
        }
    }

    // ==========================================
    // 2. CONFIG & STATE
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwZi0sSuCMw0reeI9Wk4PKRHgu9xDeR205H4zZ1e123moTva9MkdC0XYA5ckEP3Aqmq/exec"; 
    const STORAGE_KEY = "PHARMACY_V9_5_FINAL";
    const RECOVERY_KEY = "PHARMA2024";

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        tasks: [],
        users: [],
        masterTasks: [],
        recurringTasks: [],
        notifications: [],
        session: null,
        settings: { darkMode: false, sync: true, view: 'dashboard', wallpaper: '' }
    };

    const save = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if(state.settings.sync && state.session) {
            const payload = {
                action: 'syncDatabase',
                database: {
                    tasks: state.tasks,
                    users: state.users,
                    masterTasks: state.masterTasks,
                    recurringTasks: state.recurringTasks,
                    notifications: state.notifications
                }
            };
            fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(err => console.warn("Sync error:", err));
        }
    };

    // ==========================================
    // 3. AUTOMATION & NOTIFICATION ENGINE
    // ==========================================
    function runEngines() {
        const todayStr = new Date().toDateString();
        let changed = false;

        // Daily Recurring Engine
        state.recurringTasks.forEach(r => {
            if (r.lastRun !== todayStr) {
                state.tasks.unshift({
                    id: 'rt' + Date.now() + Math.random(),
                    title: "[AUTO] " + r.title,
                    userId: 'u1',
                    status: 'TODO',
                    date: new Date().toISOString().split('T')[0]
                });
                r.lastRun = todayStr;
                state.notifications.unshift({ text: "Daily Generated: " + r.title, read: false, time: new Date().toLocaleTimeString() });
                changed = true;
            }
        });

        // Overdue Check
        const today = new Date();
        today.setHours(0,0,0,0);
        state.tasks.forEach(t => {
            if (t.status !== 'DONE' && t.date && new Date(t.date) < today && t.lastAlerted !== todayStr) {
                state.notifications.unshift({ text: "🚨 OVERDUE: " + t.title, read: false, time: new Date().toLocaleTimeString() });
                t.lastAlerted = todayStr;
                changed = true;
            }
        });

        if(changed) save();
    }

    // ==========================================
    // 4. AUTHENTICATION
    // ==========================================
    function handleSetup() {
        const n = document.getElementById('s-name').value;
        const e = document.getElementById('s-email').value;
        const p = document.getElementById('s-pass').value;
        if(!n || !e || !p) return alert("Fill all fields");
        const admin = { id: 'u1', name: n, email: e, password: p, phone: '', role: 'Admin', profileImg: '' };
        state.users.push(admin);
        state.session = admin;
        save();
        init();
    }

    function handleLogin() {
        const e = document.getElementById('l-email').value;
        const p = document.getElementById('l-pass').value;
        const user = state.users.find(u => u.email === e && u.password === p);
        if(user) { state.session = user; save(); init(); } else alert("Invalid Login");
    }

    function handleForgot() {
        const e = prompt("Enter email:");
        const user = state.users.find(u => u.email === e);
        if(user && prompt("Recovery Key:") === RECOVERY_KEY) {
            const np = prompt("New Password:");
            if(np) { user.password = np; save(); alert("Updated!"); }
        } else alert("Verification Failed");
    }

    // ==========================================
    // 5. UI RENDERING
    // ==========================================
    function nav(v) { state.settings.view = v; save(); render(); }

    function render() {
        const root = document.getElementById('app-root');
        
        // Setup Logic
        if (state.users.length === 0) {
            root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>🛡️ System Setup</h1><p>Create Admin account</p><input id="s-name" placeholder="Full Name"><input id="s-email" placeholder="Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleSetup()">Initialize App</button></div></div>`;
            return;
        }

        // Login Logic
        if (!state.session) {
            root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>💊 Pharmacy Login</h1><input id="l-email" placeholder="Email"><input id="l-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleLogin()">Login</button><p onclick="handleForgot()" style="margin-top:15px; font-size:0.8rem; color:gray; cursor:pointer;">Forgot Password?</p></div></div>`;
            return;
        }

        const unread = state.notifications.filter(n => !n.read).length;
        root.innerHTML = `
            <div class="app-container">
                <aside class="sidebar">
                    <div class="sidebar-profile">
                        <img src="${state.session.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="profile-img">
                        <div style="font-weight:bold">${state.session.name}</div>
                    </div>
                    <nav class="nav-links">
                        <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
                        <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-ul"></i> Task List</div>
                        <div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-users"></i> Staff List</div>
                        <div class="nav-item ${state.settings.view==='templates'?'active':''}" onclick="nav('templates')"><i class="fas fa-copy"></i> Templates</div>
                        <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> Settings</div>
                    </nav>
                    <div style="padding:20px"><button class="btn btn-danger" style="width:100%" onclick="state.session=null;save();render();">Logout</button></div>
                </aside>
                <main class="main-content">
                    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
                        <h1>${state.settings.view.toUpperCase()}</h1>
                        <div style="display:flex; gap:15px; align-items:center;">
                            <div class="notif-bell" onclick="state.notifications.forEach(n=>n.read=true);save();render();"><i class="fas fa-bell"></i>${unread ? `<span class="notif-badge">${unread}</span>` : ''}</div>
                            <button class="btn btn-p" onclick="downloadReport()">Excel</button>
                            <button class="btn btn-p" onclick="openTaskModal()">+ New Task</button>
                        </div>
                    </header>
                    <div id="view-mount"></div>
                </main>
            </div>`;
        renderView();
    }

    function renderView() {
        const mount = document.getElementById('view-mount');
        const v = state.settings.view;
        if(v === 'dashboard') {
            mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><span>Pending</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                <div class="stat-card"><span>Staff</span><h2>${state.users.length}</h2></div>
                <div class="stat-card"><span>Templates</span><h2>${state.masterTasks.length}</h2></div>
                <div class="stat-card"><span>Alerts</span><h2>${state.notifications.length}</h2></div>
            </div>
            <div class="panel"><h3>Excel Data Import</h3><input type="file" onchange="uploadExcel(event)"></div>
            <div class="panel"><h3>Notifications</h3>${state.notifications.slice(0,5).map(n=>`<div>${n.text}</div>`).join('') || 'None'}</div>`;
        } else if(v === 'tasks') {
            mount.innerHTML = `<div class="panel"><table><thead><tr><th>Task</th><th>Staff</th><th>Action</th></tr></thead><tbody>
            ${state.tasks.map(t => `<tr><td>${t.title}</td><td>${state.users.find(u=>u.id===t.userId)?.name || '-'}</td><td><button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button>
            ${t.status!=='DONE' && state.users.find(u=>u.id===t.userId)?.phone ? `<button class="btn-wa" onclick="wa('${state.users.find(u=>u.id===t.userId).phone}','${t.title}')"><i class="fab fa-whatsapp"></i></button>` : ''}
            <button onclick="delTask('${t.id}')" style="color:red;background:none;border:none"><i class="fas fa-trash"></i></button></td></tr>`).join('')}
            </tbody></table></div>`;
        } else if(v === 'staff') {
            mount.innerHTML = `<button class="btn btn-p" style="margin-bottom:15px" onclick="openModal('modal-user')">+ Add Staff</button><div class="panel"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead><tbody>
            ${state.users.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||'-'}</td></tr>`).join('')}
            </tbody></table></div>`;
        } else if(v === 'templates') {
            mount.innerHTML = `
            <div class="panel"><h3>Daily Automations</h3><input id="r-tit" placeholder="Task Name"><button class="btn btn-p" onclick="addRec()">Add Daily</button>
            ${state.recurringTasks.map(r => `<div>🔄 ${r.title} <button onclick="delRec('${r.id}')" style="color:red;background:none;border:none">X</button></div>`).join('')}</div>
            <div class="panel"><h3>Templates</h3><input id="m-tit" placeholder="Template Name"><button class="btn btn-p" onclick="addMas()">Save</button>
            ${state.masterTasks.map(m => `<div>📄 ${m.title} <button onclick="applyMas('${m.id}')">Apply</button></div>`).join('')}</div>`;
        } else if(v === 'settings') {
            mount.innerHTML = `<div class="panel"><h3>Branding</h3><label>Wallpaper URL</label><input id="wal-url" value="${state.settings.wallpaper}"><label>Profile URL</label><input id="pro-url" value="${state.session.profileImg}"><button class="btn btn-p" onclick="updateStyle()">Apply</button>
            <hr><button class="btn btn-danger" style="width:100%" onclick="localStorage.clear();location.reload();">Reset System</button></div>`;
        }
    }

    // ==========================================
    // 6. CORE LOGIC
    // ==========================================
    function openTaskModal() { document.getElementById('f-t-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join(''); openModal('modal-task'); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function saveTask() {
        state.tasks.unshift({id:'t'+Date.now(), title:document.getElementById('f-t-title').value, userId:document.getElementById('f-t-user').value, date:document.getElementById('f-t-date').value, status:'TODO'});
        save(); closeModal('modal-task'); render();
    }
    function saveUser() {
        state.users.push({id:'u'+Date.now(), name:document.getElementById('f-u-name').value, email:document.getElementById('f-u-email').value, password:document.getElementById('f-u-pass').value, phone:document.getElementById('f-u-phone').value, role:'Staff'});
        save(); closeModal('modal-user'); render();
    }
    function toggleDone(id) { const t=state.tasks.find(x=>x.id===id); if(t) t.status=t.status==='DONE'?'TODO':'DONE'; save(); render(); }
    function delTask(id) { state.tasks=state.tasks.filter(x=>x.id!==id); save(); render(); }
    function addRec() { state.recurringTasks.push({id:'r'+Date.now(), title:document.getElementById('r-tit').value, lastRun:''}); save(); render(); }
    function delRec(id) { state.recurringTasks=state.recurringTasks.filter(x=>x.id!==id); save(); render(); }
    function addMas() { state.masterTasks.push({id:'m'+Date.now(), title:document.getElementById('m-tit').value}); save(); render(); }
    function saveMaster() { state.masterTasks.push({id:'m'+Date.now(), title:document.getElementById('f-m-title').value}); save(); closeModal('modal-master'); render(); }
    function applyMas(id) { const m=state.masterTasks.find(x=>x.id===id); state.tasks.unshift({id:'t'+Date.now(), title:m.title, userId:'u1', status:'TODO', date:new Date().toISOString().split('T')[0]}); save(); nav('tasks'); }
    function updateStyle() { state.settings.wallpaper=document.getElementById('wal-url').value; state.session.profileImg=document.getElementById('pro-url').value; save(); location.reload(); }
    function wa(p, t) { window.open(`https://wa.me/${p.replace(/\D/g,'')}?text=${encodeURIComponent('Reminder: Task "'+t+'" is pending.')}`, '_blank'); }
    function downloadReport() { const ws=XLSX.utils.json_to_sheet(state.tasks); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tasks"); XLSX.writeFile(wb, "Report.xlsx"); }
    function uploadExcel(e) { const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{ const d=XLSX.read(ev.target.result,{type:'binary'}); XLSX.utils.sheet_to_json(d.Sheets[d.SheetNames[0]]).forEach(row=>{ state.tasks.unshift({id:'t'+Date.now()+Math.random(), title:row.TaskName || row.Task, userId:'u1', status:'TODO'}); }); save(); render(); alert("Excel Uploaded!"); }; r.readAsBinaryString(f); }

</script>
</body>
</html>
