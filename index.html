<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Manager - Amba AI</title>
    <!-- XLSX Library for Excel Import/Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #007bff; --bg: #ffffff; --sidebar: #f8fafc; --text: #1e293b;
            --muted: #64748b; --line: #e2e8f0; --green: #22c55e; --red: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0; background: #fff; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            width: 100%; max-width: 400px; padding: 40px; text-align: center;
            border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
        }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--sidebar); border-right: 1px solid var(--line);
            display: flex; flex-direction: column; position: fixed; height: 100vh;
        }
        .sidebar-header { padding: 30px 20px; font-weight: 800; font-size: 1.2rem; color: var(--blue); }
        .nav-item { 
            padding: 14px 25px; cursor: pointer; color: var(--muted); font-weight: 600;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: #eef2ff; color: var(--blue); }
        .nav-group-title { padding: 20px 25px 10px; font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* Main Content */
        .main { margin-left: 260px; flex: 1; padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Pharmacy Task Design (Circular Ticking) */
        .task-list { display: flex; flex-direction: column; gap: 15px; }
        .task-item {
            background: #fff; border: 1px solid var(--line); padding: 20px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between; transition: 0.3s;
        }
        .task-item.done { background: #f0fdf4; border-color: var(--green); }
        .task-info h4 { margin: 0; font-size: 1rem; }
        .task-info p { margin: 5px 0 0; font-size: 0.85rem; color: var(--muted); }

        /* The Tapping Circle (PDF Logic Page 16) */
        .circle-check {
            width: 40px; height: 40px; border: 2px solid var(--line); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s;
        }
        .circle-check.checked { background: var(--green); border-color: var(--green); color: white; }
        .circle-check.mandatory { border: none; background: #f1f5f9; color: #94a3b8; cursor: default; }

        /* Dashboard Components */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--sidebar); padding: 20px; border-radius: 15px; border: 1px solid var(--line); }
        .stat-card h3 { margin: 10px 0 0; font-size: 1.8rem; }

        /* Performance Bar */
        .bar-bg { background: var(--line); height: 8px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .bar-fill { height: 100%; background: var(--blue); transition: 0.5s; }

        /* Buttons */
        button { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
        .btn-primary { background: var(--blue); color: white; }
        .btn-wa { background: #25D366; color: white; }
        .btn-danger { background: #fee2e2; color: #ef4444; }

        /* Modal */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; place-items: center; z-index: 2000; }
        .modal-bg.open { display: grid; }
        .modal { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 25px; border-radius: 50px; display: none; z-index: 5000; }

        @media (max-width: 900px) {
            .sidebar { width: 0; overflow: hidden; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="login-screen">
        <div class="login-card">
            <h1 style="color: var(--blue);">🤖 Amba AI Portal</h1>
            <p style="color: var(--muted);">Pharmacy Task Management System</p>
            <input type="text" id="loginUser" placeholder="Username (Employee ID)">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="attemptLogin()">Sign In</button>
            <p style="font-size: 0.75rem; color: #aaa; margin-top: 20px;">Staff: P001 | Admin: P002 | HOD: P003 (Pass: 123)</p>
        </div>
    </div>

    <!-- App Sidebar -->
    <nav class="sidebar" id="sidebar" style="display: none;">
        <div class="sidebar-header">PHARMACY V1</div>
        <div class="nav-group">
            <div class="nav-item active" onclick="setView('dashboard')">🏠 Home Screen</div>
            <div class="nav-item" onclick="setView('history')">📜 Audit History</div>
            
            <div id="admin-menu" style="display: none;">
                <div class="nav-group-title">Admin Controls</div>
                <div class="nav-item" onclick="setView('manage-staff')">👥 Staff Management</div>
                <div class="nav-item" onclick="setView('master-db')">📚 Master Database</div>
                <div class="nav-item" onclick="setView('excel')">📊 Excel Integration</div>
            </div>

            <div id="hod-menu" style="display: none;">
                <div class="nav-group-title">HOD Tools</div>
                <div class="nav-item" onclick="setView('reports')">📈 View Reports</div>
                <div class="nav-item" onclick="setView('close-day')" style="color: var(--red);">🔒 Close Day</div>
            </div>
        </div>
        <div class="nav-item" onclick="logout()" style="margin-top: auto; border-top: 1px solid var(--line);">🚪 Logout</div>
    </nav>

    <!-- Main Content Area -->
    <main class="main" id="main" style="display: none;">
        <header>
            <div>
                <h1 id="view-title">Dashboard</h1>
                <div style="font-size: 0.8rem; color: var(--muted);" id="date-display"></div>
            </div>
            <div style="display:flex; gap: 10px; align-items: center;">
                <div id="sync-indicator" style="font-size: 0.7rem; color: var(--green);">● Connected</div>
                <button class="btn-primary" id="top-btn" onclick="openTaskModal()">+ Create Task</button>
            </div>
        </header>

        <div id="content-area"></div>
    </main>

    <!-- Modals -->
    <div class="modal-bg" id="taskModal">
        <div class="modal">
            <h2 id="modalTitle">New Task</h2>
            <form id="taskForm">
                <input type="hidden" id="editId">
                <label>Task Title</label><input type="text" id="tTitle" required style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
                <label>Description</label><input type="text" id="tDesc" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
                <label>Assignee</label><select id="tAssign" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"></select>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>Due Date</label><input type="date" id="tDue" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"></div>
                    <div style="flex:1"><label>Priority</label><select id="tPri" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div>
                </div>
                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button type="button" onclick="closeModal()" style="flex:1; background:#eee;">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex:1;">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // --- Configuration & DB (Page 14) ---
        const API_URL = "https://script.google.com/macros/s/AKfycbzj-8D5NIf5qH2CRcYzFo25HhrHP0Zk3wUCGKkh_ChpUjUovaQJQFXCDrpfVbHYikFQ/exec";
        const DAILY_LOCK_HOUR = 22; // 10 PM Lock rule (Page 9)

        let db = JSON.parse(localStorage.getItem('amba_pharmacy_db')) || {
            tasks: [],
            users: [
                {id: 'P001', name: 'Rohan Joshi', role: 'STAFF', phone: '910000000000'},
                {id: 'P002', name: 'Kevin Admin', role: 'ADMIN', phone: '911111111111'},
                {id: 'P003', name: 'Amit HOD', role: 'HOD', phone: '912222222222'}
            ],
            logs: []
        };

        let currentView = 'dashboard';
        let currentUser = null;

        // --- Core Logic ---
        function save() {
            localStorage.setItem('amba_pharmacy_db', JSON.stringify(db));
            refreshCurrentView();
            syncToCloud();
        }

        async function syncToCloud() {
            if(!API_URL) return;
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain;charset=utf-8'},
                    body: JSON.stringify({action: 'syncDatabase', database: db})
                });
            } catch (e) { console.warn("Cloud Sync Failed (Offline Mode)"); }
        }

        function setView(v) {
            currentView = v;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            event?.currentTarget?.classList.add('active');
            document.getElementById('view-title').innerText = v.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            refreshCurrentView();
        }

        function refreshCurrentView() {
            const area = document.getElementById('content-area');
            const today = new Date().toLocaleDateString();
            const hour = new Date().getHours();
            const isLocked = hour >= DAILY_LOCK_HOUR;

            if(currentView === 'dashboard') {
                renderDashboard(area, isLocked);
            } else if(currentView === 'master-db') {
                renderTable(area, db.tasks, "Full Task Database");
            } else if(currentView === 'manage-staff') {
                renderStaff(area);
            } else if(currentView === 'reports') {
                renderReports(area);
            }
        }

        // --- Rendering Engine ---
        function renderDashboard(area, isLocked) {
            const myTasks = currentUser.role === 'STAFF' ? db.tasks.filter(t => t.userId === currentUser.id) : db.tasks;
            const completed = myTasks.filter(t => t.status === 'DONE').length;
            const pending = myTasks.length - completed;

            area.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><span>Today's Total</span><h3>${myTasks.length}</h3></div>
                    <div class="stat-card"><span>Pending</span><h3>${pending}</h3></div>
                    <div class="stat-card"><span>Completed</span><h3>${completed}</h3></div>
                </div>
                ${isLocked ? `<div style="padding:15px; background:#fee2e2; color:#ef4444; border-radius:10px; margin-bottom:20px; font-weight:700;">🔒 Daily Lock Active (After 10 PM). Task modification disabled.</div>` : ''}
                <div class="task-list">
                    ${myTasks.map(t => {
                        const isDone = t.status === 'DONE';
                        return `
                            <div class="task-item ${isDone ? 'done' : ''}">
                                <div class="task-info">
                                    <h4>${t.title}</h4>
                                    <p>${t.desc || 'No description'}</p>
                                    <small>${db.users.find(u => u.id === t.userId)?.name || 'Unassigned'} | Due: ${t.due || 'No Date'}</small>
                                </div>
                                <div style="display:flex; gap:10px; align-items:center;">
                                    ${currentUser.role !== 'STAFF' ? `<button class="btn-wa" onclick="sendWhatsApp('${t.id}')">📲 Notify</button>` : ''}
                                    <div class="circle-check ${isDone ? 'checked' : ''}" onclick="toggleTask('${t.id}', ${isLocked})">
                                        ${isDone ? '✔' : '○'}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('') || '<p class="muted">No tasks found for today.</p>'}
                </div>
            `;
        }

        function renderStaff(area) {
            area.innerHTML = `
                <div class="card" style="padding:20px; background:#f8fafc; border-radius:15px; margin-bottom:20px;">
                    <h3>Add New Staff Member</h3>
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px;">
                        <input id="staffId" placeholder="Emp ID (e.g. P004)">
                        <input id="staffName" placeholder="Full Name">
                        <input id="staffPhone" placeholder="Phone (with Country Code)">
                        <button class="btn-primary" onclick="addStaff()">Add Employee</button>
                    </div>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Role</th><th>Performance</th></tr></thead>
                    <tbody>${db.users.map(u => {
                        const ut = db.tasks.filter(t => t.userId === u.id);
                        const done = ut.filter(t => t.status === 'DONE').length;
                        const perc = ut.length ? Math.round((done/ut.length)*100) : 0;
                        return `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.phone}</td><td>${u.role}</td><td><div class="bar-bg"><div class="bar-fill" style="width:${perc}%"></div></div></td></tr>`;
                    }).join('')}</tbody>
                </table>
            `;
        }

        // --- Actions ---
        function attemptLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;
            const user = db.users.find(x => x.id === u && p === "123");

            if(user) {
                currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main').style.display = 'block';
                document.getElementById('date-display').innerText = new Date().toDateString();
                
                // Set Permission Menus
                if(user.role === 'ADMIN' || user.role === 'HOD') document.getElementById('admin-menu').style.display = 'block';
                if(user.role === 'HOD') document.getElementById('hod-menu').style.display = 'block';
                
                setView('dashboard');
                showToast("Welcome, " + user.name);
            } else {
                alert("Invalid Login Credentials.");
            }
        }

        function toggleTask(id, isLocked) {
            if(isLocked) return showToast("Daily Lock: Window closed.");
            const t = db.tasks.find(x => x.id === id);
            t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
            db.logs.push({action: `Task ${t.title} marked ${t.status}`, user: currentUser.id, time: new Date().toISOString()});
            save();
        }

        function sendWhatsApp(id) {
            const t = db.tasks.find(x => x.id === id);
            const u = db.users.find(x => x.id === t.userId);
            const msg = `*PHARMACY ALERT*%0A*Task:* ${t.title}%0A*Due:* ${t.due}%0A*Status:* PENDING%0A_Please update in app._`;
            window.open(`https://wa.me/${u.phone}?text=${msg}`);
        }

        function addStaff() {
            const id = document.getElementById('staffId').value;
            const name = document.getElementById('staffName').value;
            const phone = document.getElementById('staffPhone').value;
            if(!id || !name) return;
            db.users.push({id, name, phone, role: 'STAFF'});
            save();
        }

        function openTaskModal() {
            document.getElementById('tAssign').innerHTML = db.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            document.getElementById('taskModal').classList.add('open');
        }

        function closeModal() { document.getElementById('taskModal').classList.remove('open'); }

        document.getElementById('taskForm').onsubmit = (e) => {
            e.preventDefault();
            const nt = {
                id: 't' + Date.now(),
                title: document.getElementById('tTitle').value,
                desc: document.getElementById('tDesc').value,
                userId: document.getElementById('tAssign').value,
                due: document.getElementById('tDue').value,
                priority: document.getElementById('tPri').value,
                status: 'TODO'
            };
            db.tasks.unshift(nt);
            save(); closeModal();
        };

        function logout() { localStorage.removeItem('amba_session'); location.reload(); }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // Initialize
        if(!localStorage.getItem('amba_pharmacy_db')) save();
    </script>
</body>
</html>
