<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy PRO Management v9.6</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --p: #10b981; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; 
            --m: #64748b; --l: #e2e8f0; --s: #064e3b; --d: #ef4444; 
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); 
        }
        body { 
            margin: 0; background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; overflow: hidden; 
            background-size: cover; background-position: center; transition: 0.3s;
        }

        /* Full Screen Blur Background */
        .blur-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px); z-index: -1; }

        /* Auth Screens */
        .auth-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: linear-gradient(135deg, #10b981 0%, #064e3b 100%); position: fixed; inset: 0; z-index: 9999; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
        .auth-card h1 { color: var(--p); font-size: 1.8rem; margin-bottom: 5px; }

        /* Sidebar */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--s); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-profile { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin: 2px 15px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--p); color: white; }

        /* Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .panel { background: var(--c); border-radius: 20px; border: 1px solid var(--l); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        /* Components */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--c); padding: 20px; border-radius: 16px; border: 1px solid var(--l); text-align: center; }
        .profile-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--p); margin-bottom: 10px; object-fit: cover; }
        
        .btn { padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; }
        .btn-danger { background: var(--d); color: white; }
        .btn-wa { background: #25d366; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--l); }
        
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .bg-high { background: #fee2e2; color: #b91c1c; }
        .bg-low { background: #dcfce7; color: #15803d; }

        /* Notification Dropdown */
        .notif-bell { position: relative; cursor: pointer; font-size: 1.4rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--d); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; }
        .notif-pane { display: none; position: absolute; top: 50px; right: 0; width: 320px; background: white; border-radius: 16px; box-shadow: var(--shadow); z-index: 1000; border: 1px solid var(--l); }
        .notif-pane.active { display: block; }
        .notif-item { padding: 12px; border-bottom: 1px solid var(--l); font-size: 0.8rem; cursor: pointer; }
        .notif-item:hover { background: var(--bg); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--c); padding: 30px; border-radius: 24px; width: 450px; box-shadow: var(--shadow); }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--l); outline: none; background: var(--bg); }
        
        #toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; z-index: 3000; }
    </style>
</head>
<body onload="init()">
    <div class="blur-overlay"></div>
    <div id="app-root"></div>
    <div id="toast"></div>

    <!-- Modals (Hidden by default) -->
    <div class="modal-overlay" id="modal-task"><div class="modal"><h2>Assign Task</h2><input id="f-t-title" placeholder="What needs to be done?"><select id="f-t-user"></select><input type="date" id="f-t-date"><select id="f-t-pri"><option value="HIGH">Urgent / High</option><option value="NORMAL" selected>Normal</option></select><button class="btn btn-p" style="width:100%" onclick="saveTask()">Save Task</button><button class="btn" style="width:100%;margin-top:10px;background:none" onclick="closeModal('modal-task')">Cancel</button></div></div>
    <div class="modal-overlay" id="modal-user"><div class="modal"><h2>Add Staff Member</h2><input id="f-u-name" placeholder="Full Name"><input id="f-u-email" placeholder="Email Address"><input id="f-u-pass" type="password" placeholder="Password"><input id="f-u-phone" placeholder="WhatsApp (e.g. 91...)"><select id="f-u-role"><option value="Pharmacist">Pharmacist</option><option value="Assistant">Assistant</option><option value="Admin">Admin</option></select><button class="btn btn-p" style="width:100%" onclick="saveUser()">Create Account</button><button class="btn" style="width:100%;margin-top:10px;background:none" onclick="closeModal('modal-user')">Cancel</button></div></div>

    <script>
        // ==========================================
        // 1. STATE & ENGINE
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwZi0sSuCMw0reeI9Wk4PKRHgu9xDeR205H4zZ1e123moTva9MkdC0XYA5ckEP3Aqmq/exec";
        const STORAGE_KEY = "PHARMACY_V9_6_MASTER";
        const RECOVERY_KEY = "PHARMA2024";

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            tasks: [], users: [], masterTasks: [], recurringTasks: [], notifications: [], session: null,
            settings: { darkMode: false, sync: true, view: 'dashboard', wallpaper: '' }
        };

        const save = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            if(state.settings.sync && state.session) {
                const payload = { action: 'syncDatabase', database: state };
                fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        };

        function runEngines() {
            const todayStr = new Date().toDateString();
            let changed = false;

            // Automation Engine
            state.recurringTasks.forEach(r => {
                if (r.lastRun !== todayStr) {
                    state.tasks.unshift({ id: 'rt'+Date.now(), title: "[AUTO] "+r.title, userId: state.session.id, status: 'TODO', date: new Date().toISOString().split('T')[0], priority: 'NORMAL' });
                    r.lastRun = todayStr;
                    state.notifications.unshift({ text: "Generated Daily: " + r.title, read: false, time: new Date().toLocaleTimeString(), urgent: false });
                    changed = true;
                }
            });

            // Overdue Engine
            const now = new Date(); now.setHours(0,0,0,0);
            state.tasks.forEach(t => {
                if (t.status !== 'DONE' && t.date && new Date(t.date) < now && t.lastAlerted !== todayStr) {
                    state.notifications.unshift({ text: "🚨 OVERDUE: " + t.title, read: false, time: new Date().toLocaleTimeString(), urgent: true });
                    t.lastAlerted = todayStr;
                    changed = true;
                }
            });

            if(changed) save();
        }

        function init() {
            if(state.settings.wallpaper) document.body.style.backgroundImage = `url(${state.settings.wallpaper})`;
            if(state.session) runEngines();
            render();
        }

        // ==========================================
        // 2. AUTHENTICATION
        // ==========================================
        function handleSetup() {
            const u = { id: 'u1', name: document.getElementById('s-name').value, email: document.getElementById('s-email').value, password: document.getElementById('s-pass').value, phone: '', role: 'Admin', profileImg: '' };
            if(!u.name || !u.email || !u.password) return alert("Fill all fields");
            state.users.push(u); state.session = u; save(); init();
        }
        function handleLogin() {
            const e = document.getElementById('l-email').value;
            const p = document.getElementById('l-pass').value;
            const u = state.users.find(x => x.email === e && x.password === p);
            if(u) { state.session = u; save(); init(); } else alert("Invalid Login");
        }
        function handleForgot() {
            const e = prompt("Email:");
            const u = state.users.find(x => x.email === e);
            if(u && prompt("Enter Master Recovery Key:") === RECOVERY_KEY) {
                const np = prompt("New Password:");
                if(np) { u.password = np; save(); alert("Password Reset!"); }
            } else alert("Identity not verified.");
        }

        // ==========================================
        // 3. UI RENDERING
        // ==========================================
        function nav(v) { state.settings.view = v; render(); }
        function toggleNotif() { document.getElementById('notif-pane').classList.toggle('active'); }

        function render() {
            const root = document.getElementById('app-root');
            if (state.users.length === 0) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>🛡️ System Setup</h1><p>Create your private Admin account</p><input id="s-name" placeholder="Full Name"><input id="s-email" placeholder="Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleSetup()">Secure App</button></div></div>`;
                return;
            }
            if (!state.session) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>💊 Pharmacy Login</h1><input id="l-email" placeholder="Email" value="${state.users[0].email}"><input id="l-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleLogin()">Login</button><p onclick="handleForgot()" style="margin-top:15px; font-size:0.8rem; color:gray; cursor:pointer;">Forgot Password?</p></div></div>`;
                return;
            }

            const unread = state.notifications.filter(n => !n.read).length;
            root.innerHTML = `
                <div class="app-container">
                    <aside class="sidebar">
                        <div class="sidebar-profile">
                            <img src="${state.session.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="profile-img"><br>
                            <b>${state.session.name}</b><br><small style="opacity:0.7">${state.session.role}</small>
                        </div>
                        <nav class="nav-links">
                            <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
                            <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-check"></i> Task List</div>
                            <div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-user-nurse"></i> Staff Directory</div>
                            <div class="nav-item ${state.settings.view==='templates'?'active':''}" onclick="nav('templates')"><i class="fas fa-file-invoice"></i> Templates & Auto</div>
                            <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> Settings</div>
                        </nav>
                        <div style="padding:20px"><button class="btn btn-danger" style="width:100%" onclick="state.session=null;save();render();">Logout</button></div>
                    </aside>
                    <main class="main-content">
                        <header class="top-bar">
                            <h1 style="text-transform:uppercase">${state.settings.view}</h1>
                            <div style="display:flex; gap:15px; align-items:center;">
                                <div class="notif-bell" onclick="toggleNotif()"><i class="fas fa-bell"></i>${unread ? `<span class="notif-badge">${unread}</span>` : ''}
                                    <div class="notif-pane" id="notif-pane">
                                        <div style="padding:15px; font-weight:800; border-bottom:1px solid var(--l); display:flex; justify-content:space-between">Alerts <span onclick="state.notifications=[];save();render();" style="color:var(--p);font-size:0.7rem">Clear</span></div>
                                        ${state.notifications.map(n=>`<div class="notif-item" style="${n.urgent?'color:red':''}">${n.text}</div>`).join('') || '<div class="notif-item">No alerts</div>'}
                                    </div>
                                </div>
                                <button class="btn btn-p" onclick="downloadReport()">Excel</button>
                                <button class="btn btn-p" onclick="openTaskModal()">+ New Task</button>
                            </div>
                        </header>
                        <div id="view-mount"></div>
                    </main>
                </div>`;
            renderView();
        }

        function renderView() {
            const mount = document.getElementById('view-mount');
            const v = state.settings.view;
            if(v === 'dashboard') {
                mount.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><span>Pending</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                        <div class="stat-card"><span>Overdue</span><h2 style="color:red">${state.notifications.filter(n=>n.urgent).length}</h2></div>
                        <div class="stat-card"><span>Team</span><h2>${state.users.length}</h2></div>
                        <div class="stat-card"><span>Sync</span><p>${state.settings.sync?'Cloud Online':'Local'}</p></div>
                    </div>
                    <div class="panel"><h3>Excel Upload</h3><input type="file" onchange="uploadExcel(event)"><p class="muted" style="font-size:0.7rem">Columns: TaskName, StaffEmail</p></div>`;
            } 
            else if(v === 'tasks') {
                mount.innerHTML = `<div class="panel"><table><thead><tr><th>Task</th><th>Staff</th><th>Priority</th><th>Action</th></tr></thead><tbody>
                ${state.tasks.map(t => `<tr><td><b>${t.title}</b><br><small>${t.date || ''}</small></td><td>${state.users.find(u=>u.id===t.userId)?.name || '-'}</td><td><span class="badge ${t.priority==='HIGH'?'bg-high':'bg-low'}">${t.priority}</span></td><td>
                <button class="btn" style="background:none" onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button>
                ${t.status!=='DONE' && state.users.find(u=>u.id===t.userId)?.phone ? `<button class="btn-wa" onclick="wa('${state.users.find(u=>u.id===t.userId).phone}','${t.title}')"><i class="fab fa-whatsapp"></i></button>` : ''}
                <button onclick="delTask('${t.id}')" style="color:red;background:none;border:none"><i class="fas fa-trash"></i></button></td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else if(v === 'staff') {
                mount.innerHTML = `<div class="panel"><h3>Staff Management</h3><button class="btn btn-p" style="margin-bottom:15px" onclick="openModal('modal-user')">+ Add Staff</button>
                <table><thead><tr><th>Name</th><th>Role</th><th>WhatsApp</th></tr></thead><tbody>
                ${state.users.map(u => `<tr><td>${u.name}</td><td>${u.role}</td><td>${u.phone || '-'}</td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else if(v === 'templates') {
                mount.innerHTML = `
                <div class="panel"><h3>Standard Workflow Templates</h3><input id="m-tit" placeholder="Template Name"><button class="btn btn-p" onclick="addMas()">Save Template</button>
                ${state.masterTasks.map(m => `<div style="padding:10px; border-bottom:1px solid var(--l)">${m.title} <button class="btn btn-p" style="float:right;padding:5px" onclick="applyMas('${m.id}')">Apply</button></div>`).join('')}</div>
                <div class="panel"><h3>Daily Scheduled Automation</h3><input id="r-tit" placeholder="Automation Name"><button class="btn btn-p" onclick="addRec()">Enable Daily</button>
                ${state.recurringTasks.map(r => `<div style="padding:10px; border-bottom:1px solid var(--l)">🔄 ${r.title} <button onclick="delRec('${r.id}')" style="float:right;color:red;background:none;border:none">X</button></div>`).join('')}</div>`;
            }
            else if(v === 'settings') {
                mount.innerHTML = `<div class="panel"><h3>System Customization</h3>
                    <label>Wallpaper URL</label><input id="w-url" value="${state.settings.wallpaper}">
                    <label>Profile Photo URL</label><input id="p-url" value="${state.session.profileImg || ''}">
                    <button class="btn btn-p" onclick="updateStyle()">Save Settings</button>
                    <hr><button class="btn btn-danger" style="width:100%" onclick="localStorage.clear();location.reload();">Clear All Cache</button>
                </div>`;
            }
        }

        // ==========================================
        // 4. FUNCTIONAL LOGIC
        // ==========================================
        function openTaskModal() { document.getElementById('f-t-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join(''); openModal('modal-task'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function saveTask() { state.tasks.unshift({id:'t'+Date.now(), title:document.getElementById('f-t-title').value, userId:document.getElementById('f-t-user').value, date:document.getElementById('f-t-date').value, priority:document.getElementById('f-t-pri').value, status:'TODO'}); save(); closeModal('modal-task'); render(); }
        function saveUser() { state.users.push({id:'u'+Date.now(), name:document.getElementById('f-u-name').value, email:document.getElementById('f-u-email').value, password:document.getElementById('f-u-pass').value, phone:document.getElementById('f-u-phone').value, role:document.getElementById('f-u-role').value}); save(); closeModal('modal-user'); render(); }
        function toggleDone(id) { const t=state.tasks.find(x=>x.id===id); if(t) t.status=t.status==='DONE'?'TODO':'DONE'; save(); render(); }
        function delTask(id) { state.tasks=state.tasks.filter(x=>x.id!==id); save(); render(); }
        function addRec() { state.recurringTasks.push({id:'r'+Date.now(), title:document.getElementById('r-tit').value, lastRun:''}); save(); render(); }
        function delRec(id) { state.recurringTasks=state.recurringTasks.filter(x=>x.id!==id); save(); render(); }
        function addMas() { state.masterTasks.push({id:'m'+Date.now(), title:document.getElementById('m-tit').value}); save(); render(); }
        function applyMas(id) { const m=state.masterTasks.find(x=>x.id===id); state.tasks.unshift({id:'t'+Date.now(), title:m.title, userId:state.session.id, status:'TODO', date:new Date().toISOString().split('T')[0], priority:'NORMAL'}); save(); nav('tasks'); }
        function updateStyle() { state.settings.wallpaper=document.getElementById('w-url').value; state.session.profileImg=document.getElementById('p-url').value; const idx=state.users.findIndex(u=>u.id===state.session.id); if(idx!==-1) state.users[idx].profileImg=state.session.profileImg; save(); location.reload(); }
        function wa(p, t) { window.open(`https://wa.me/${p.replace(/\D/g,'')}?text=${encodeURIComponent('Pharmacy Alert: Task "'+t+'" is pending. Please complete.')}`, '_blank'); }
        function downloadReport() { const ws=XLSX.utils.json_to_sheet(state.tasks); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tasks"); XLSX.writeFile(wb, "PharmacyReport.xlsx"); }
        function uploadExcel(e) { const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{ const d=XLSX.read(ev.target.result,{type:'binary'}); XLSX.utils.sheet_to_json(d.Sheets[d.SheetNames[0]]).forEach(row=>{ state.tasks.unshift({id:'t'+Date.now()+Math.random(), title:row.TaskName || row.Task, userId:state.session.id, status:'TODO', priority:'NORMAL'}); }); save(); render(); alert("Import Complete"); }; r.readAsBinaryString(f); }

    </script>
</body>
</html>
