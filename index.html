<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V8 | Professional</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #1e293b;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.2s; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }

        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid #334155; }
        .sidebar-header span { color: var(--primary); }
        .nav-links { flex: 1; padding: 20px 15px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #334155; }
        .logout-btn { width: 100%; padding: 12px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        /* Notifications */
        .notif-bell { position: relative; cursor: pointer; font-size: 1.3rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; }
        .notif-pane { display: none; position: absolute; top: 70px; right: 30px; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); z-index: 1000; }
        .notif-pane.active { display: block; }
        .notif-item { padding: 12px; border-bottom: 1px solid var(--line); font-size: 0.8rem; }
        .notif-item.overdue { border-left: 4px solid var(--danger); background: rgba(239, 68, 68, 0.05); }

        /* Widgets */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-card span { font-size: 0.75rem; color: var(--muted); font-weight: 700; }
        .stat-card h2 { margin: 5px 0 0; font-size: 1.6rem; }

        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--muted); font-size: 0.8rem; padding: 10px; border-bottom: 2px solid var(--line); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .bg-high { background: #fee2e2; color: #b91c1c; }
        .bg-done { background: #dcfce7; color: #15803d; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; }
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: white; }

        .ai-chat { display: flex; flex-direction: column; height: 300px; border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; }
        .chat-msgs { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.85rem; }
        .chat-in { display: flex; padding: 10px; gap: 10px; border-top: 1px solid var(--line); }
        .chat-in input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    </style>
</head>
<body onload="init()">

<div id="app-shell"></div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h2>New Task</h2>
        <input type="text" id="f-title" placeholder="What is the task?" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line);">
        <input type="date" id="f-date" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--line);">
        <select id="f-pri" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid var(--line);">
            <option value="HIGH">High Priority</option>
            <option value="MEDIUM" selected>Medium Priority</option>
            <option value="LOW">Low Priority</option>
        </select>
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">Create Task</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. STATE & ENGINE
// ==========================================
const API_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; 
const STORAGE_KEY = "AMBA_V8_PRO_DATA";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    notifications: [],
    recurring: [],
    settings: { userName: "Admin", darkMode: false, sync: false },
    view: 'dashboard'
};

const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(state.settings.sync) syncToSheets();
};

async function syncToSheets() {
    try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncDatabase', database: state }) }); } catch(e) {}
}

// ==========================================
// 2. AUTO-NOTIFICATION ENGINE (V8)
// ==========================================
function scanIncompleteTasks() {
    const today = new Date();
    today.setHours(0,0,0,0);
    let alertCount = 0;

    state.tasks.forEach(t => {
        if(t.status !== 'DONE' && t.date) {
            const dueDate = new Date(t.date);
            if(dueDate < today && t.lastNotified !== today.toDateString()) {
                state.notifications.unshift({
                    id: Date.now() + Math.random(),
                    text: `⚠️ INCOMPLETE: "${t.title}" is overdue since ${t.date}`,
                    type: 'overdue',
                    read: false,
                    date: new Date().toLocaleString()
                });
                t.lastNotified = today.toDateString();
                alertCount++;
            }
        }
    });
    if(alertCount > 0) save();
}

function checkRecurring() {
    const today = new Date().toDateString();
    state.recurring.forEach(r => {
        if(r.lastRun !== today) {
            state.tasks.unshift({ id: 'rt'+Date.now(), title: "[AUTO] "+r.title, priority: 'MEDIUM', status: 'TODO', date: new Date().toISOString().split('T')[0] });
            state.notifications.unshift({ text: "🔄 Recurring Task Created: " + r.title, read: false, type: 'info' });
            r.lastRun = today;
            save();
        }
    });
}

// ==========================================
// 3. UI RENDERING
// ==========================================
function init() {
    checkRecurring();
    scanIncompleteTasks();
    render();
}

function render() {
    const shell = document.getElementById('app-shell');
    document.body.className = state.settings.darkMode ? 'dark' : '';
    const unreadCount = state.notifications.filter(n => !n.read).length;

    shell.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">AMBA <span>AI</span> V8</div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-check-double"></i> <span>Task Manager</span></div>
                    <div class="nav-item ${state.view==='recurring'?'active':''}" onclick="nav('recurring')"><i class="fas fa-redo"></i> <span>Automations</span></div>
                    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-sliders-h"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer"><button class="logout-btn" onclick="logout()">LOGOUT</button></div>
            </aside>

            <main class="main-content">
                <header class="top-bar">
                    <h1>${state.view.toUpperCase()}</h1>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <div class="notif-bell" onclick="toggleNotifs()">
                            <i class="fas fa-bell"></i>
                            ${unreadCount > 0 ? `<span class="notif-badge">${unreadCount}</span>` : ''}
                        </div>
                        <div class="notif-pane" id="notif-box">
                            <div style="padding:15px; border-bottom:1px solid var(--line); font-weight:800; display:flex; justify-content:space-between;">
                                Alerts <span onclick="clearNotifs()" style="color:var(--primary); cursor:pointer; font-size:0.7rem;">Clear</span>
                            </div>
                            <div style="max-height:300px; overflow-y:auto;">
                                ${state.notifications.length ? state.notifications.map(n => `<div class="notif-item ${n.type==='overdue'?'overdue':''}">${n.text}</div>`).join('') : '<div class="notif-item">No alerts</div>'}
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="showModal()">+ New Task</button>
                    </div>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>
    `;
    renderView();
}

function renderView() {
    const mount = document.getElementById('view-mount');
    if(state.view === 'dashboard') {
        const pending = state.tasks.filter(t=>t.status!=='DONE').length;
        const overdue = state.tasks.filter(t=>t.status!=='DONE' && new Date(t.date) < new Date().setHours(0,0,0,0)).length;
        mount.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><span>PENDING</span><h2>${pending}</h2></div>
                <div class="stat-card"><span>OVERDUE</span><h2 style="color:var(--danger)">${overdue}</h2></div>
                <div class="stat-card"><span>COMPLETED</span><h2>${state.tasks.filter(t=>t.status==='DONE').length}</h2></div>
                <div class="stat-card"><span>EFFICIENCY</span><h2>${state.tasks.length ? Math.round((state.tasks.filter(t=>t.status==='DONE').length/state.tasks.length)*100) : 0}%</h2></div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 350px; gap:25px;">
                <div class="panel">
                    <h3>Priority Queue</h3>
                    <table>
                        ${state.tasks.filter(t=>t.status!=='DONE').slice(0,5).map(t => `
                            <tr><td>${t.title}</td><td><span class="badge bg-high">${t.priority}</span></td><td>${t.date || ''}</td></tr>
                        `).join('') || '<tr><td>No pending tasks!</td></tr>'}
                    </table>
                </div>
                <div class="panel">
                    <h3>🤖 AI Copilot</h3>
                    <div class="ai-chat">
                        <div class="chat-msgs" id="chat-box">Try: "Add task Meeting at 5pm"</div>
                        <div class="chat-in">
                            <input type="text" id="ai-input" placeholder="Type command..." onkeypress="if(event.key==='Enter') runAI()">
                            <button onclick="runAI()" style="border:none; background:var(--primary); color:white; border-radius:5px; padding:0 10px;">➔</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    } else if (state.view === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Task</th><th>Due Date</th><th>Priority</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => `
                            <tr>
                                <td style="${t.status==='DONE'?'text-decoration:line-through; color:var(--muted)':''}">${t.title}</td>
                                <td>${t.date || '-'}</td>
                                <td><span class="badge ${t.priority==='HIGH'?'bg-high':'bg-done'}">${t.priority}</span></td>
                                <td><button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    } else if (state.view === 'recurring') {
        mount.innerHTML = `
            <div class="panel">
                <h3>Scheduled Automations</h3>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <input type="text" id="rec-title" placeholder="Daily Task Name..." style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--line);">
                    <button class="btn btn-primary" onclick="addRec()">Add Daily</button>
                </div>
                ${state.recurring.map(r => `<div style="padding:10px; border-bottom:1px solid var(--line);">🔄 ${r.title}</div>`).join('')}
            </div>
        `;
    } else if (state.view === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:500px;">
                <h3>System Configuration</h3>
                <label>Username</label><input type="text" value="${state.settings.userName}" onchange="state.settings.userName=this.value;save();" style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid var(--line);">
                <button class="btn btn-secondary" onclick="state.settings.darkMode=!state.settings.darkMode;save();render();" style="width:100%; margin-bottom:10px;">Toggle Dark Mode</button>
                <button class="btn btn-secondary" onclick="state.settings.sync=!state.settings.sync;save();render();" style="width:100%; margin-bottom:10px;">Google Sync: ${state.settings.sync?'ON':'OFF'}</button>
                <button class="btn btn-secondary" onclick="exportExcel()" style="width:100%; margin-bottom:10px;">Export Excel Report</button>
                <hr>
                <button class="btn btn-danger" onclick="resetSystem()" style="width:100%;">FACTORY RESET</button>
            </div>
        `;
    }
}

// ==========================================
// 4. LOGIC FUNCTIONS
// ==========================================
function nav(v) { state.view = v; render(); }
function showModal() { document.getElementById('task-modal').classList.add('active'); }
function closeModal() { document.getElementById('task-modal').classList.remove('active'); }
function toggleNotifs() { document.getElementById('notif-box').classList.toggle('active'); }
function clearNotifs() { state.notifications = []; save(); render(); }

function addTask() {
    const t = document.getElementById('f-title').value;
    const d = document.getElementById('f-date').value;
    if(!t) return;
    state.tasks.unshift({ id: 't'+Date.now(), title: t, date: d, priority: document.getElementById('f-pri').value, status: 'TODO', lastNotified: "" });
    state.notifications.unshift({ text: "🚀 New Task: "+t, read: false, type: 'info' });
    save(); closeModal(); render();
}

function toggleDone(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) {
        t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
        if(t.status === 'DONE') state.notifications.unshift({ text: "✅ Completed: "+t.title, read: false, type: 'info' });
        save(); render();
    }
}

function runAI() {
    const input = document.getElementById('ai-input');
    const box = document.getElementById('chat-box');
    const cmd = input.value.trim();
    if(!cmd) return;

    if(cmd.toLowerCase().startsWith("add task")) {
        const title = cmd.substring(9);
        state.tasks.unshift({ id: 'tai'+Date.now(), title: title, prio
