<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Task Management V8.4</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #059669; --primary-hover: #047857;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
            --muted: #64748b; --line: #e2e8f0; --sidebar: #134e4a;
            --danger: #dc2626; --success: #10b981; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --line: #334155; --sidebar: #020617;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; transition: 0.3s; }

        /* Login Page Styling */
        .login-screen { height: 100vh; display: grid; place-items: center; background: #f1f5f9; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: var(--primary); margin-bottom: 10px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--line); }

        /* Sidebar & Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px; text-align: center; font-size: 1.1rem; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        .sidebar-footer { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout-btn { background: var(--danger); color: white; width: 100%; border-radius: 8px; padding: 12px; border: none; font-weight: 700; cursor: pointer; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 400px; }
        .modal input, .modal select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
        
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal">
        <h2>New Prescription/Task</h2>
        <input type="text" id="f-title" placeholder="Task description...">
        <select id="f-emp"></select>
        <select id="f-pri">
            <option value="HIGH">Urgent</option>
            <option value="MEDIUM" selected>Normal</option>
            <option value="LOW">Low</option>
        </select>
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">Save Task</button>
        <button onclick="closeModal('task-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<!-- User Creation Modal -->
<div class="modal-overlay" id="user-modal">
    <div class="modal">
        <h2>Create Staff Account</h2>
        <input type="text" id="fu-name" placeholder="Staff Name">
        <input type="email" id="fu-email" placeholder="Email Address">
        <input type="password" id="fu-pass" placeholder="Password">
        <select id="fu-role">
            <option value="Pharmacist">Pharmacist</option>
            <option value="Assistant">Assistant</option>
            <option value="Admin">Admin</option>
        </select>
        <button class="btn btn-primary" onclick="createUser()" style="width:100%">Create User</button>
        <button onclick="closeModal('user-modal')" style="width:100%; background:none; border:none; margin-top:10px; color:var(--muted); cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
// ==========================================
// 1. DATA STATE & AUTH
// ==========================================
const STORAGE_KEY = "PHARMACY_V8_4_DATA";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    tasks: [],
    employees: [{id: 'e1', name: 'Dr. Admin', role: 'Pharmacist'}],
    users: [{id: 'u1', name: 'Admin', email: 'admin@pharmacy.local', password: '123', role: 'Admin'}],
    session: null, // Tracks login
    settings: { darkMode: false },
    view: 'dashboard'
};

const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

// ==========================================
// 2. AUTHENTICATION LOGIC
// ==========================================
function init() {
    render();
}

function handleLogin() {
    const email = document.getElementById('log-email').value;
    const pass = document.getElementById('log-pass').value;

    const user = state.users.find(u => u.email === email && u.password === pass);
    if (user) {
        state.session = user;
        save();
        render();
    } else {
        alert("Invalid Email or Password");
    }
}

function logout() {
    if(confirm("Confirm Logout?")) {
        state.session = null;
        state.view = 'dashboard';
        save();
        render();
    }
}

// ==========================================
// 3. MAIN RENDERING ENGINE
// ==========================================
function render() {
    const root = document.getElementById('app-root');

    // IF NOT LOGGED IN -> SHOW LOGIN SCREEN
    if (!state.session) {
        root.innerHTML = `
            <div class="login-screen">
                <div class="login-card">
                    <h1>💊 Pharmacy</h1>
                    <p>Task Management Login</p>
                    <input type="email" id="log-email" placeholder="Email (admin@pharmacy.local)" value="admin@pharmacy.local">
                    <input type="password" id="log-pass" placeholder="Password (123)" value="123">
                    <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button>
                    <p style="font-size:0.7rem; color:gray; margin-top:15px;">v8.4 Stable Release</p>
                </div>
            </div>
        `;
        return;
    }

    // IF LOGGED IN -> SHOW APP
    document.body.className = state.settings.darkMode ? 'dark' : '';
    root.innerHTML = `
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">PHARMACY MGMT</div>
                <nav class="nav-links">
                    <div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-prescription"></i> <span>Dashboard</span></div>
                    <div class="nav-item ${state.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-clipboard-list"></i> <span>Prescriptions</span></div>
                    <div class="nav-item ${state.view==='users'?'active':''}" onclick="nav('users')"><i class="fas fa-user-shield"></i> <span>User Accounts</span></div>
                    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> <span>Settings</span></div>
                </nav>
                <div class="sidebar-footer">
                    <div style="font-size:0.7rem; margin-bottom:10px; color:#94a3b8">Logged in: ${state.session.name}</div>
                    <button class="logout-btn" onclick="logout()">LOGOUT</button>
                </div>
            </aside>

            <main class="main-content">
                <header class="top-bar">
                    <h1>${state.view.toUpperCase()}</h1>
                    <button class="btn btn-primary" onclick="showTaskModal()">+ New Task</button>
                </header>
                <div id="view-mount"></div>
            </main>
        </div>
    `;
    renderView();
}

function nav(v) { state.view = v; render(); }

// ==========================================
// 4. VIEW COMPONENTS
// ==========================================
function renderView() {
    const mount = document.getElementById('view-mount');
    
    if (state.view === 'dashboard') {
        mount.innerHTML = `
            <div class="panel">
                <h3>Welcome to Pharmacy Management</h3>
                <p>Track medicines, prescriptions, and staff tasks efficiently.</p>
                <div style="display:flex; gap:20px; margin-top:20px;">
                    <div class="panel" style="flex:1; background:#ecfdf5"><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2><p>Pending Orders</p></div>
                    <div class="panel" style="flex:1; background:#fefce8"><h2>${state.users.length}</h2><p>Active Staff</p></div>
                </div>
            </div>
        `;
    } 
    else if (state.view === 'tasks') {
        mount.innerHTML = `
            <div class="panel">
                <table>
                    <thead><tr><th>Prescription/Task</th><th>Pharmacist</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.tasks.map(t => `
                            <tr>
                                <td>${t.title}</td>
                                <td>${t.assignedToName || 'Unassigned'}</td>
                                <td><button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    else if (state.view === 'users') {
        mount.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3>Staff & User Management</h3>
                <button class="btn btn-primary" onclick="showUserModal()">+ Create User</button>
            </div>
            <div class="panel">
                <table>
                    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead>
                    <tbody>
                        ${state.users.map(u => `
                            <tr>
                                <td>${u.name}</td>
                                <td>${u.email}</td>
                                <td>${u.role}</td>
                                <td><button class="btn-danger btn" style="padding:5px" onclick="deleteUser('${u.id}')">Delete</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    else if (state.view === 'settings') {
        mount.innerHTML = `
            <div class="panel" style="max-width:400px;">
                <h3>System Preferences</h3>
                <button class="btn btn-primary" style="width:100%" onclick="state.settings.darkMode = !state.settings.darkMode; save(); render();">Toggle Dark Mode</button>
                <hr style="margin:20px 0; border:none; border-top:1px solid var(--line);">
                <button class="btn btn-danger" style="width:100%" onclick="if(confirm('Wipe All Data?')) {localStorage.clear(); location.reload();}">Factory Reset</button>
            </div>
        `;
    }
}

// ==========================================
// 5. USER & TASK LOGIC
// ==========================================
function showTaskModal() {
    const sel = document.getElementById('f-emp');
    sel.innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    document.getElementById('task-modal').classList.add('active');
}
function showUserModal() { document.getElementById('user-modal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function addTask() {
    const title = document.getElementById('f-title').value;
    const userId = document.getElementById('f-emp').value;
    const userName = state.users.find(u => u.id === userId).name;
    if(!title) return;
    state.tasks.unshift({ id: 't'+Date.now(), title, assignedTo: userId, assignedToName: userName, status: 'TODO' });
    save(); closeModal('task-modal'); render();
}

function createUser() {
    const name = document.getElementById('fu-name').value;
    const email = document.getElementById('fu-email').value;
    const pass = document.getElementById('fu-pass').value;
    const role = document.getElementById('fu-role').value;
    if(!name || !email || !pass) return alert("Fill all fields");

    state.users.push({ id: 'u'+Date.now(), name, email, password: pass, role });
    save(); closeModal('user-modal'); render();
}

function deleteUser(id) {
    if(id === 'u1') return alert("Cannot delete Master Admin");
    state.users = state.users.filter(u => u.id !== id);
    save(); render();
}

function toggleDone(id) {
    const t = state.tasks.find(x => x.id === id);
    if(t) { t.status = t.status === 'DONE' ? 'TODO' : 'DONE'; save(); render(); }
}
</script>
</body>
</html>
