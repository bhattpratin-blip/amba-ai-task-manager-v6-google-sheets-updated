<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba Pharmacy Management</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --p: #1e4b82; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; 
            --m: #64748b; --l: #e2e8f0; --s: #2c3e50; --d: #ef4444; 
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); 
        }
        body { margin: 0; background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; overflow: hidden; transition: 0.3s; }
        .auth-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: #f0f2f5; position: fixed; inset: 0; z-index: 9999; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 450px; text-align: center; box-shadow: var(--shadow); }
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--s); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-profile { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin: 2px 15px; cursor: pointer; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: var(--p); color: white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .panel { background: var(--c); border-radius: 20px; border: 1px solid var(--l); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--c); padding: 20px; border-radius: 16px; border: 1px solid var(--l); text-align: center; }
        .profile-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--p); margin-bottom: 10px; object-fit: cover; }
        .btn { padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; }
        .btn-wa { background: #25d366; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; border:none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--l); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--c); padding: 30px; border-radius: 24px; width: 450px; box-shadow: var(--shadow); }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--l); outline: none; background: var(--bg); box-sizing: border-box; }
        #toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 15px 25px; border-radius: 10px; display: none; z-index: 3000; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .bg-daily { background: #e0f2fe; color: #0369a1; }
        .bg-weekly { background: #fef9c3; color: #a16207; }
        .bg-monthly { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body onload="init()">
    <div id="app-root"></div>
    <div id="toast"></div>

    <!-- Task Modal -->
    <div id="modal-task" class="modal-overlay">
        <div class="modal">
            <h3>Assign New Task</h3>
            <input id="f-t-title" placeholder="Task description...">
            <label><small>Due Date</small></label>
            <input id="f-t-date" type="date">
            <label><small>Assign To</small></label>
            <select id="f-t-user"></select>
            <div style="display:flex; gap:10px">
                <button class="btn btn-p" style="flex:1" onclick="saveTask()">Create Task</button>
                <button class="btn" style="flex:1; background:#eee" onclick="closeModal('modal-task')">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
        const STORAGE_KEY = "AMBA_PHARMACY_V10";

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            tasks: [], users: [], recurringTasks: [], notifications: [], session: null,
            settings: { sync: true, view: 'dashboard' }
        };

        const save = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            if (state.settings.sync && state.session) {
                const payload = { action: 'syncDatabase', database: state };
                fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        };

        // --- AUTOMATION ENGINE ---
        function runAutomationEngine() {
            const now = new Date();
            const todayStr = now.toDateString();
            let changed = false;

            state.recurringTasks.forEach(r => {
                let shouldTrigger = false;
                const last = r.lastRun ? new Date(r.lastRun) : null;

                if (!last) {
                    shouldTrigger = true;
                } else {
                    const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
                    
                    if (r.freq === 'DAILY' && todayStr !== last.toDateString()) shouldTrigger = true;
                    if (r.freq === 'WEEKLY' && diffDays >= 7) shouldTrigger = true;
                    if (r.freq === 'MONTHLY' && (now.getMonth() !== last.getMonth() || now.getFullYear() !== last.getFullYear())) shouldTrigger = true;
                }

                if (shouldTrigger) {
                    const newTask = { 
                        id: 'auto_'+Date.now()+'_'+Math.random().toString(36).substr(2, 5), 
                        title: `[AUTO] ${r.title}`, 
                        userId: r.assignedTo || state.users[0]?.id, 
                        status: 'TODO', 
                        date: now.toISOString().split('T')[0],
                        isAuto: true,
                        freq: r.freq
                    };
                    state.tasks.unshift(newTask);
                    r.lastRun = now.toISOString();
                    const notifText = `New ${r.freq} task: ${r.title}`;
                    state.notifications.unshift({ text: notifText, time: new Date().toLocaleTimeString(), read: false });
                    sendBrowserNotif("New Task Assigned", notifText);
                    changed = true;
                }
            });

            if(changed) {
                save();
                render();
            }
        }

        async function init() {
            // Try to pull latest data
            try {
                const res = await fetch(API_URL);
                const server = await res.json();
                if(server && server.users) {
                    state.users = server.users;
                    state.tasks = server.tasks || state.tasks;
                    state.recurringTasks = server.recurringTasks || state.recurringTasks;
                }
            } catch(e) { console.log("Offline mode"); }
            
            if(state.session) {
                runAutomationEngine();
                // Keep checking while the app stays open, so daily/weekly/monthly
                // tasks and their notifications fire even if nobody reloads the page.
                setInterval(runAutomationEngine, 60000);
            }
            render();
        }

        function handleLogin() {
            const e = document.getElementById('l-email').value.trim().toLowerCase();
            const p = document.getElementById('l-pass').value;
            const u = state.users.find(x => x.email.toLowerCase() === e && String(x.password) === String(p));
            if(u) { state.session = u; runAutomationEngine(); save(); render(); } else alert("Invalid Credentials");
        }

        function render() {
            const root = document.getElementById('app-root');
            
            if (state.users.length === 0) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h2>System Setup</h2><input id="s-name" placeholder="Admin Name"><input id="s-email" placeholder="Admin Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="setupAdmin()">Setup</button></div></div>`;
                return;
            }

                    <div class="panel">
                        <h3>Recent Notifications</h3>
                        ${state.notifications.slice(0,5).map(n => `<div style="padding:10px; border-bottom:1px solid #eee"><small>${n.time}</small> ${n.text}</div>`).join('') || 'No recent activity'}
                    </div>`;
            } 
            else if(v === 'tasks') {
                const list = isA ? state.tasks : state.tasks.filter(t => t.userId === state.session.id);
                mount.innerHTML = `<div class="panel">
                    <table>
                        <thead><tr><th>Task Name</th><th>Frequency</th><th>Assigned To</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            ${list.map(t => `
                            <tr>
                                <td><b>${t.title}</b><br><small>${t.date}</small></td>
                                <td>${t.isAuto ? `<span class="badge bg-${t.freq.toLowerCase()}">${t.freq}</span>` : '<span class="badge" style="background:#eee">ONCE</span>'}</td>
                                <td>${state.users.find(u=>u.id===t.userId)?.name || 'Deleted User'}</td>
                                <td><span style="color:${t.status==='DONE'?'green':'orange'}">${t.status}</span></td>
                                <td>
                                    ${t.status === 'TODO' ? `<button class="btn-wa" style="background:#eee; color:#333; margin-right:5px;" onclick="markDone('${t.id}')">Complete</button>` : ''}
                                    ${isA ? `<button onclick="deleteTask('${t.id}')" style="color:red; background:none; border:none; cursor:pointer">Delete</button>` : ''}
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
            }
            else if(v === 'automation') {
                mount.innerHTML = `
                <div class="panel">
                    <h3>Create Recurring Task</h3>
                    <input id="ar-tit" placeholder="Automation Name (e.g. Daily Cleaning)">
                    <select id="ar-freq">
                        <option value="DAILY">Repeat Daily</option>
                        <option value="WEEKLY">Repeat Weekly</option>
                        <option value="MONTHLY">Repeat Monthly</option>
                    </select>
                    <label><small>Assign To</small></label>
                    <select id="ar-user">
                        ${state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('')}
                    </select>
                    <button class="btn btn-p" onclick="addAutomation()">Start Automation</button>
                </div>
                <div class="panel">
                    <h3>Active Automations</h3>
                    ${state.recurringTasks.map(r => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid #eee">
                            <div>
                                <b>${r.title}</b> <span class="badge bg-${r.freq.toLowerCase()}">${r.freq}</span><br>
                                <small>Assigned to: ${state.users.find(u=>u.id===r.assignedTo)?.name}</small>
                            </div>
                            <button onclick="removeAutomation('${r.id}')" style="color:red; border:none; background:none; cursor:pointer"><i class="fas fa-trash"></i></button>
                        </div>
                    `).join('') || '<p>No automations set up.</p>'}
                </div>`;
            }
            else if(v === 'staff') {
                mount.innerHTML = `
                <div class="panel">
                    <h3>Add New Staff</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                        <input id="st-name" placeholder="Full Name">
                        <input id="st-email" placeholder="Email">
                        <input id="st-pass" type="password" placeholder="Password">
                        <select id="st-role"><option value="Staff">Staff</option><option value="Admin">Admin</option></select>
                    </div>
                    <button class="btn btn-p" onclick="addStaff()">Add Staff Member</button>
                </div>
                <div class="panel">
                    <h3>Staff Directory</h3>
                    <table>
                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead>
                        <tbody>
                            ${state.users.map(u => `
                                <tr>
                                    <td>${u.name}</td>
                                    <td>${u.email}</td>
                                    <td>${u.role}</td>
                                    <td>${u.id !== state.session.id ? `<button onclick="deleteStaff('${u.id}')" style="color:red; background:none; border:none; cursor:pointer">Remove</button>` : '<i>Self</i>'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
            }
            else if(v === 'settings') {
                mount.innerHTML = `
                <div class="panel">
                    <h3>Notifications</h3>
                    <p>Get an alert on this device when a new automated task is assigned, even if this tab isn't open.</p>
                    <button class="btn btn-p" onclick="requestNotifPermission()">${state.settings.browserNotif ? 'Notifications Enabled ✓' : 'Enable Browser Notifications'}</button>
                </div>
                <div class="panel">
                    <h3>My Profile</h3>
                    <input value="${state.session.name}" disabled>
                    <input value="${state.session.email}" disabled>
                    <label><small>New Password</small></label>
                    <input id="set-pass" type="password" placeholder="Leave blank to keep current password">
                    <button class="btn btn-p" onclick="updatePassword()">Update Password</button>
                </div>
                ${isA ? `
                <div class="panel">
                    <h3>Sync</h3>
                    <p>Data is currently ${state.settings.sync ? '<b style="color:green">syncing</b> to' : '<b style="color:#b91c1c">NOT syncing</b> with'} the Google Sheet.</p>
                    <button class="btn btn-p" onclick="toggleSync()">${state.settings.sync ? 'Turn Sync Off' : 'Turn Sync On'}</button>
                </div>` : ''}`;
            }
        }

        // --- CORE FUNCTIONS ---
        function nav(v) { state.settings.view = v; render(); }
        
        function openTaskModal() {
            document.getElementById('f-t-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            document.getElementById('modal-task').classList.add('active');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function saveTask() {
            const title = document.getElementById('f-t-title').value;
            const userId = document.getElementById('f-t-user').value;
            const date = document.getElementById('f-t-date').value;
            if(!title) return alert("Enter task name");
            state.tasks.unshift({ id: 't'+Date.now(), title, userId, date, status: 'TODO', isAuto: false });
            save(); closeModal('modal-task'); render();
        }

        function markDone(id) {
            const t = state.tasks.find(x => x.id === id);
            if(t) t.status = 'DONE';
            save(); render();
        }

        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            save(); render();
        }

        function addAutomation() {
            const title = document.getElementById('ar-tit').value;
            const freq = document.getElementById('ar-freq').value;
            const assignedTo = document.getElementById('ar-user').value;
            if(!title) return;
            state.recurringTasks.push({ id: 'r'+Date.now(), title, freq, assignedTo, lastRun: null });
            save(); runAutomationEngine(); render();
        }

        function removeAutomation(id) {
            state.recurringTasks = state.recurringTasks.filter(r => r.id !== id);
            save(); render();
        }

        function addStaff() {
            const name = document.getElementById('st-name').value;
            const email = document.getElementById('st-email').value;
            const password = document.getElementById('st-pass').value;
            const role = document.getElementById('st-role').value;
            if(!name || !email || !password) return alert("Fill all fields");
            state.users.push({ id: 'u'+Date.now(), name, email, password, role });
            save(); render();
        }

        function deleteStaff(id) {
            state.users = state.users.filter(u => u.id !== id);
            save(); render();
        }

        function setupAdmin() {
            const name = document.getElementById('s-name').value;
            const email = document.getElementById('s-email').value;
            const password = document.getElementById('s-pass').value;
            if(!name || !email || !password) return;
            state.users.push({ id: 'u1', name, email, password, role: 'Admin' });
            save(); render();
        }

        function requestNotifPermission() {
            if (!("Notification" in window)) return alert("This browser doesn't support notifications");
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    state.settings.browserNotif = true;
                    save(); render();
                    showToast("Browser notifications enabled");
                }
            });
        }

        function sendBrowserNotif(title, body) {
            if (state.settings.browserNotif && "Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body });
            }
        }

        function updatePassword() {
            const newPass = document.getElementById('set-pass').value;
            if (!newPass) return alert("Enter a new password first");
            state.session.password = newPass;
            // keep the users list in sync with the logged-in session's own record
            const u = state.users.find(x => x.id === state.session.id);
            if (u) u.password = newPass;
            save(); render();
            showToast("Password updated");
        }

        function toggleSync() {
            state.settings.sync = !state.settings.sync;
            save(); render();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function logout() { state.session = null; render(); }

    </script>
</body>
</html>
