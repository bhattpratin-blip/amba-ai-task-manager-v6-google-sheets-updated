<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V7</title>
    <!-- SheetJS for Export/Import -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f4f7fb; --card: #fff; --text: #18212f; --muted: #6b7280; 
            --line: #e5e7eb; --primary: #4f46e5; --ai: #7c3aed; --danger: #dc2626; 
            --shadow: 0 10px 30px #00000012; --sidebar: #1e293b;
        }
        body.dark {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --line: #334155;
        }
        * { box-sizing: border-box; transition: background 0.2s; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Layout */
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--sidebar); color: #fff; padding: 20px; flex-shrink: 0; }
        .content { flex: 1; padding: 30px; overflow-y: auto; max-width: 1200px; margin: 0 auto; }
        
        /* Sidebar Navigation */
        .sidebar h2 { margin: 0 0 30px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #cbd5e1; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary); color: #fff; }
        .sidebar hr { border: none; border-top: 1px solid #334155; margin: 20px 0; }

        /* UI Elements */
        .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
        button { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .primary { background: var(--primary); color: #fff; }
        .secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); }
        .ai-btn { background: var(--ai); color: #fff; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); margin-top: 5px; }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--line); }
        .stat-card span { color: var(--muted); font-size: 0.9rem; }
        .stat-card h3 { margin: 10px 0 0; font-size: 1.8rem; }

        /* Task Cards */
        .task-list { display: grid; gap: 15px; }
        .task-item { background: var(--card); border: 1px solid var(--line); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .HIGH { background: #fee2e2; color: #991b1b; }
        .MEDIUM { background: #fef3c7; color: #92400e; }
        .LOW { background: #dcfce7; color: #166534; }

        /* AI Chat */
        .ai-box { display: flex; flex-direction: column; height: 300px; }
        .chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; font-size: 0.9rem; }
        .msg.user { background: #e0e7ff; align-self: flex-end; color: #1e1b4b; }
        .msg.ai { background: #f3f4f6; align-self: flex-start; }

        /* Modal */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); place-items: center; z-index: 100; padding: 20px; }
        .modal-bg.open { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; }

        /* Notifications */
        .notif-badge { background: #dc2626; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; }

        /* Responsiveness */
        @media (max-width: 850px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

<div id="app"></div>
<div id="toast" style="display:none; position:fixed; bottom:20px; right:20px; background:#1e293b; color:white; padding:12px 20px; border-radius:10px; z-index:1000;"></div>

<script>
// ==========================================
// CONFIGURATION & DATABASE
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
const DB_KEY = "amba_ai_v7_db";
const SESSION_KEY = "amba_ai_v7_session";

let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
    users: [{id: "u1", name: "Admin", email: "admin@amba.local", password: "Admin@123", role: "ADMIN"}],
    tasks: [],
    notifications: [],
    masterTasks: [],
    recurringTasks: []
};

let session = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
let currentPage = "dashboard";
let editingId = null;

// ==========================================
// CORE UTILITIES
// ==========================================
const user = () => db.users.find(u => u.id === session?.userId);
const esc = (str) => { let d = document.createElement('div'); d.textContent = str; return d.innerHTML; };
const save = () => {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    syncWithGoogle();
};

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

async function syncWithGoogle() {
    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "syncDatabase", database: db })
        });
    } catch (e) { console.error("Sync failed", e); }
}

// ==========================================
// NAVIGATION ENGINE
// ==========================================
function renderApp() {
    const u = user();
    if (!u) return renderLogin();

    document.getElementById('app').innerHTML = `
        <div class="layout">
            <nav class="sidebar">
                <h2>🤖 Amba AI V7</h2>
                <a onclick="navigate('dashboard')" class="${currentPage === 'dashboard' ? 'active' : ''}">📊 Dashboard</a>
                <a onclick="navigate('master')" class="${currentPage === 'master' ? 'active' : ''}">📚 Master Tasks</a>
                <a onclick="navigate('notifications')" class="${currentPage === 'notifications' ? 'active' : ''}">
                    🔔 Notifications ${db.notifications.filter(n=>!n.read && n.userId === u.id).length ? `<span class="notif-badge">${db.notifications.filter(n=>!n.read && n.userId === u.id).length}</span>` : ''}
                </a>
                <hr>
                <a onclick="navigate('settings')" class="${currentPage === 'settings' ? 'active' : ''}">⚙️ Settings</a>
                <a onclick="logout()">🚪 Logout</a>
            </nav>
            <main class="content" id="main-content"></main>
        </div>
        <div id="modal-container"></div>
    `;

    if (currentPage === "dashboard") renderDashboard();
    else if (currentPage === "master") renderMasterTasks();
    else if (currentPage === "notifications") renderNotifications();
    else if (currentPage === "settings") renderSettings();
    
    checkRecurringTasks(); 
}

function navigate(page) {
    currentPage = page;
    renderApp();
}

// ==========================================
// LOGIN MODULE
// ==========================================
function renderLogin() {
    document.getElementById('app').innerHTML = `
        <div style="display:grid; place-items:center; height:100vh;">
            <div class="panel" style="width:350px; text-align:center;">
                <h1>Amba AI</h1>
                <p class="muted">Login to continue</p>
                <input type="email" id="login-email" placeholder="Email" value="admin@amba.local">
                <input type="password" id="login-pass" placeholder="Password" value="Admin@123">
                <button class="primary" style="width:100%; margin-top:20px;" onclick="handleLogin()">Login</button>
            </div>
        </div>
    `;
}

function handleLogin() {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-pass').value;
    const found = db.users.find(u => u.email === email && u.password === pass);
    if (found) {
        session = { userId: found.id };
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
        renderApp();
    } else toast("Invalid credentials!");
}

function logout() {
    session = null;
    sessionStorage.clear();
    renderLogin();
}

// ==========================================
// DASHBOARD MODULE
// ==========================================
function renderDashboard() {
    const u = user();
    const tasks = db.tasks;
    document.getElementById('main-content').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <div><h1>Dashboard</h1><p class="muted">Hello, ${u.name}</p></div>
            <div style="display:flex; gap:10px;">
                <button class="secondary" onclick="document.body.classList.toggle('dark')">🌓 Mode</button>
                <button class="primary" onclick="openTaskModal()">+ Add Task</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span>Total Tasks</span><h3>${tasks.length}</h3></div>
            <div class="stat-card"><span>Pending</span><h3>${tasks.filter(t=>t.status !== 'DONE').length}</h3></div>
            <div class="stat-card"><span>Completed</span><h3>${tasks.filter(t=>t.status === 'DONE').length}</h3></div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 350px; gap:20px;">
            <div class="panel">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h2>Current Tasks</h2>
                    <input type="text" placeholder="Search tasks..." style="width:200px; margin:0;" oninput="filterTasks(this.value)">
                </div>
                <div id="task-list-container" class="task-list"></div>
            </div>
            
            <div class="panel ai-panel">
                <h2>🤖 Amba AI</h2>
                <div class="ai-box">
                    <div class="chat-history" id="chat-history">
                        <div class="msg ai">I am your task assistant. How can I help you today?</div>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="ai-input" placeholder="Ask AI to create a task...">
                        <button class="ai-btn" onclick="askAI()">Ask</button>
                    </div>
                </div>
            </div>
        </div>
    `;
    renderTasks();
}

function renderTasks(filter = "") {
    const container = document.getElementById('task-list-container');
    const filtered = db.tasks.filter(t => t.title.toLowerCase().includes(filter.toLowerCase()));
    
    if (filtered.length === 0) {
        container.innerHTML = `<p class="muted" style="text-align:center; padding:20px;">No tasks found.</p>`;
        return;
    }

    container.innerHTML = filtered.map(t => `
        <div class="task-item">
            <div>
                <strong style="display:block;">${esc(t.title)}</strong>
                <small class="muted">Due: ${t.dueDate || 'No date'}</small>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span class="badge ${t.priority}">${t.priority}</span>
                <button class="secondary" onclick="toggleTask('${t.id}')">${t.status === 'DONE' ? '✅' : '⭕'}</button>
                <button class="secondary" style="color:var(--danger)" onclick="deleteTask('${t.id}')">🗑️</button>
            </div>
        </div>
    `).join('');
}

function filterTasks(val) { renderTasks(val); }

function toggleTask(id) {
    const t = db.tasks.find(x => x.id === id);
    if (t) {
        t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
        save(); renderTasks();
    }
}

function deleteTask(id) {
    if (confirm("Delete task?")) {
        db.tasks = db.tasks.filter(t => t.id !== id);
        save(); renderTasks();
    }
}

// ==========================================
// MASTER TASKS MODULE
// ==========================================
function renderMasterTasks() {
    document.getElementById('main-content').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <div><h1>📚 Master Task Templates</h1><p class="muted">Predefined reusable tasks</p></div>
            <button class="primary" onclick="openMasterModal()">+ Create Template</button>
        </div>
        <div class="panel">
            <div class="task-list">
                ${db.masterTasks.length ? db.masterTasks.map(m => `
                    <div class="task-item">
                        <div>
                            <strong>${esc(m.name)}</strong>
                            <p class="muted" style="margin:5px 0 0; font-size:0.8rem;">${esc(m.description || 'No description')}</p>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <span class="badge ${m.priority}">${m.priority}</span>
                            <button class="primary" onclick="applyMaster('${m.id}')">Use Template</button>
                            <button class="secondary" style="color:var(--danger)" onclick="deleteMaster('${m.id}')">🗑️</button>
                        </div>
                    </div>
                `).join('') : '<p class="muted">No master templates yet.</p>'}
            </div>
        </div>
    `;
}

function openMasterModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-bg open" id="m-modal">
            <div class="modal">
                <h2>New Master Template</h2>
                <input type="text" id="m-name" placeholder="Template Name">
                <textarea id="m-desc" placeholder="Standard Instructions"></textarea>
                <select id="m-pri">
                    <option value="LOW">Low Priority</option>
                    <option value="MEDIUM" selected>Medium Priority</option>
                    <option value="HIGH">High Priority</option>
                </select>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="secondary" style="flex:1" onclick="closeModal('m-modal')">Cancel</button>
                    <button class="primary" style="flex:1" onclick="saveMaster()">Save Template</button>
                </div>
            </div>
        </div>
    `;
}

function saveMaster() {
    const name = document.getElementById('m-name').value;
    if (!name) return alert("Name required");
    db.masterTasks.push({
        id: "m" + Date.now(),
        name,
        description: document.getElementById('m-desc').value,
        priority: document.getElementById('m-pri').value
    });
    save(); navigate('master');
}

function applyMaster(id) {
    const m = db.masterTasks.find(x => x.id === id);
    if (!m) return;
    db.tasks.unshift({
        id: "t" + Date.now(),
        title: m.name,
        priority: m.priority,
        status: "TODO",
        dueDate: new Date().toISOString().slice(0,10)
    });
    save(); toast("Task created from template!"); navigate('dashboard');
}

function deleteMaster(id) {
    if (confirm("Delete template?")) {
        db.masterTasks = db.masterTasks.filter(x => x.id !== id);
        save(); renderMasterTasks();
    }
}

// ==========================================
// RECURRING TASKS ENGINE
// ==========================================
function checkRecurringTasks() {
    const today = new Date().toISOString().slice(0,10);
    let created = false;

    db.recurringTasks.forEach(rt => {
        if (!rt.enabled) return;
        if (rt.lastRun !== today) {
            db.tasks.unshift({
                id: "rt" + Date.now() + Math.random(),
                title: "[AUTO] " + rt.title,
                priority: rt.priority,
                status: "TODO",
                dueDate: today
            });
            rt.lastRun = today;
            created = true;
            
            db.notifications.push({
                id: "n" + Date.now(),
                userId: user().id,
                message: "Recurring task created: " + rt.title,
                read: false,
                date: new Date().toISOString()
            });
        }
    });

    if (created) save();
}

// ==========================================
// NOTIFICATIONS MODULE
// ==========================================
function renderNotifications() {
    const u = user();
    const myNotifs = db.notifications.filter(n => n.userId === u.id).sort((a,b) => new Date(b.date) - new Date(a.date));
    
    document.getElementById('main-content').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1>🔔 Notifications</h1>
            <button class="secondary" onclick="markAllRead()">Mark all as read</button>
        </div>
        <div class="panel">
            ${myNotifs.length ? myNotifs.map(n => `
                <div style="padding:15px; border-bottom:1px solid var(--line); opacity: ${n.read ? 0.6 : 1}">
                    <div style="display:flex; justify-content:space-between;">
                        <strong>${esc(n.message)}</strong>
                        <small class="muted">${new Date(n.date).toLocaleString()}</small>
                    </div>
                </div>
            `).join('') : '<p class="muted">No notifications.</p>'}
        </div>
    `;
}

function markAllRead() {
    db.notifications.forEach(n => { if (n.userId === user().id) n.read = true; });
    save(); renderApp();
}

// ==========================================
// TASK MODAL & AI
// ==========================================
function openTaskModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-bg open" id="t-modal">
            <div class="modal">
                <h2>New Task</h2>
                <input type="text" id="t-title" placeholder="What needs to be done?">
                <input type="date" id="t-due" value="${new Date().toISOString().slice(0,10)}">
                <select id="t-pri">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                </select>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="secondary" style="flex:1" onclick="closeModal('t-modal')">Cancel</button>
                    <button class="primary" style="flex:1" onclick="handleSaveTask()">Save Task</button>
                </div>
            </div>
        </div>
    `;
}

function handleSaveTask() {
    const title = document.getElementById('t-title').value;
    if (!title) return alert("Title required");
    db.tasks.unshift({
        id: "t" + Date.now(),
        title,
        dueDate: document.getElementById('t-due').value,
        priority: document.getElementById('t-pri').value,
        status: "TODO"
    });
    save(); navigate('dashboard');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function askAI() {
    const input = document.getElementById('ai-input');
    const history = document.getElementById('chat-history');
    if (!input.value) return;

    const userMsg = input.value;
    history.innerHTML += `<div class="msg user">${esc(userMsg)}</div>`;
    input.value = "";

    setTimeout(() => {
        history.innerHTML += `<div class="msg ai">I've analyzed your request. I'm adding a task for "${esc(userMsg)}" to your list.</div>`;
        db.tasks.unshift({
            id: "t_ai" + Date.now(),
            title: userMsg,
            priority: "MEDIUM",
            status: "TODO",
            dueDate: new Date().toISOString().slice(0,10)
        });
        save(); renderTasks();
        history.scrollTop = history.scrollHeight;
    }, 1000);
}

function renderSettings() {
    document.getElementById('main-content').innerHTML = `
        <h1>⚙️ Settings</h1>
        <div class="panel">
            <h3>Recurring Tasks Configuration</h3>
            <p class="muted">Add tasks that repeat every day.</p>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="rec-title" placeholder="Daily task name...">
                <button class="primary" onclick="addRecurring()">Add Daily</button>
            </div>
            <div class="task-list">
                ${db.recurringTasks.map(r => `
                    <div class="task-item">
                        <span>${esc(r.title)} (Daily)</span>
                        <button class="secondary" style="color:var(--danger)" onclick="removeRecurring('${r.id}')">Remove</button>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function addRecurring() {
    const title = document.getElementById('rec-title').value;
    if(!title) return;
    db.recurringTasks.push({
        id: "r" + Date.now(),
        title,
        priority: "MEDIUM",
        enabled: true,
        lastRun: ""
    });
    save(); renderSettings();
}

function removeRecurring(id) {
    db.recurringTasks = db.recurringTasks.filter(x => x.id !== id);
    save(); renderSettings();
}

// ==========================================
// INIT
// ==========================================
renderApp();
</script>
</body>
</html>
