<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Management v9.1 - Final</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #10b981; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; 
            --muted: #64748b; --line: #e2e8f0; --sidebar: #064e3b; --danger: #ef4444; 
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); 
        }
        body { 
            margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; 
            background-size: cover; background-position: center; transition: 0.3s;
        }

        /* Login Screen */
        .login-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: #f1f5f9; position: fixed; inset: 0; z-index: 9999; background-image: linear-gradient(135deg, #10b981 0%, #064e3b 100%); }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: var(--primary); margin: 0 0 5px; font-size: 1.8rem; }
        .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--line); outline: none; font-size: 1rem; }
        .forgot-btn { display: block; margin-top: 10px; color: var(--muted); font-size: 0.8rem; cursor: pointer; }

        /* Main Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); }
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-profile { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { flex: 1; padding: 20px 15px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        
        /* Components */
        .profile-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); margin-bottom: 10px; }
        .btn { padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-whatsapp { background: #25d366; color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--line); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--line); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--card); padding: 30px; border-radius: 20px; width: 420px; }
        
        #toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; z-index: 3000; box-shadow: var(--shadow); }
    </style>
</head>
<body onload="init()">

<div id="app-root"></div>
<div id="toast"></div>

<!-- Modal: New Task -->
<div class="modal-overlay" id="modal-task">
    <div class="modal">
        <h2>Assign New Task</h2>
        <input id="f-t-title" placeholder="What needs to be done?">
        <select id="f-t-user"></select>
        <button class="btn btn-primary" style="width:100%" onclick="saveTask()">Create Task</button>
        <button class="btn" style="width:100%;margin-top:10px; background:none;" onclick="closeModal('modal-task')">Cancel</button>
    </div>
</div>

<!-- Modal: New User -->
<div class="modal-overlay" id="modal-user">
    <div class="modal">
        <h2>Add Staff Member</h2>
        <input id="f-u-name" placeholder="Full Name">
        <input id="f-u-email" placeholder="Email Address">
        <input id="f-u-pass" type="password" placeholder="Password">
        <input id="f-u-phone" placeholder="WhatsApp (e.g. 91987...)">
        <button class="btn btn-primary" style="width:100%" onclick="saveUser()">Register Staff</button>
        <button class="btn" style="width:100%;margin-top:10px; background:none;" onclick="closeModal('modal-user')">Cancel</button>
    </div>
</div>

<script>
    // 1. CONFIGURATION
    const API_URL = "https://script.google.com/macros/s/AKfycbxJ9m1ZlRoLOVo_LZl4khk85D0Fv0ZV2bFndUAoiZ_vma61KcA8F6iz6zOU9N9pO188/exec";
    const STORAGE_KEY = "PHARMACY_V9_FINAL_PRO";
    const RECOVERY_KEY = "PHARMA2024";

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        tasks: [],
        users: [{id: 'u1', name: 'Admin', email: 'admin@pharmacy.local', password: '123', phone: '', role: 'Admin', profileImg: ''}],
        session: null,
        settings: { darkMode: false, sync: true, view: 'dashboard', wallpaper: '' }
    };

    const save = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if(state.settings.sync && state.session) syncCloud();
    };

    async function syncCloud() {
        try { await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'syncDatabase', database: state }) }); } catch(e) {}
    }

    function init() {
        if(state.settings.wallpaper) document.body.style.backgroundImage = `url(${state.settings.wallpaper})`;
        render();
    }

    // 2. AUTHENTICATION
    function handleLogin() {
        const e = document.getElementById('l-email').value;
        const p = document.getElementById('l-pass').value;
        const user = state.users.find(u => u.email === e && u.password === p);
        if(user) { state.session = user; save(); render(); } else alert("Invalid Credentials");
    }

    function handleForgotPassword() {
        const email = prompt("Enter registered email:");
        const user = state.users.find(u => u.email === email);
        if(user && prompt("Enter Master Recovery Key:") === RECOVERY_KEY) {
            const newP = prompt("Enter new password:");
            if(newP) { user.password = newP; save(); alert("Password Reset Success!"); }
        } else alert("Verification Failed");
    }

    function logout() { state.session = null; save(); render(); }
    function nav(v) { state.settings.view = v; save(); render(); }

    // 3. RENDERING
    function render() {
        const root = document.getElementById('app-root');
        if (!state.session) {
            root.innerHTML = `<div class="login-screen"><div class="login-card"><h1>💊 Pharmacy Task</h1><p>Portal Login</p><input id="l-email" placeholder="Email" value="admin@pharmacy.local"><input id="l-pass" type="password" placeholder="Password" value="123"><button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button><span class="forgot-btn" onclick="handleForgotPassword()">Forgot Password?</span></div></div>`;
            return;
        }

        root.innerHTML = `
            <div class="app-container">
                <aside class="sidebar">
                    <div class="sidebar-profile">
                        <img src="${state.session.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="profile-img">
                        <div style="font-weight:bold">${state.session.name}</div>
                    </div>
                    <nav class="nav-links">
                        <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-th-large"></i> Dashboard</div>
                        <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-ul"></i> Task List</div>
                        <div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-users"></i> Staff</div>
                        <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> Settings</div>
                    </nav>
                    <div style="padding:20px"><button class="btn btn-danger" style="width:100%" onclick="logout()">Logout</button></div>
                </aside>
                <main class="main-content">
                    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
                        <h1>${state.settings.view.toUpperCase()}</h1>
                        <div>
                            <button class="btn btn-primary" onclick="downloadReport()">Export</button>
                            <button class="btn btn-primary" onclick="openTaskModal()">+ New Task</button>
                        </div>
                    </header>
                    <div id="view-mount"></div>
                </main>
            </div>`;
        renderView();
    }

    function renderView() {
        const mount = document.getElementById('view-mount');
        const v = state.settings.view;
        if(v === 'dashboard') {
            mount.innerHTML = `<div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:20px"><div class="panel"><span>Pending</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div><div class="panel"><span>Staff</span><h2>${state.users.length}</h2></div><div class="panel"><span>Excel Import</span><br><input type="file" style="font-size:0.7rem" onchange="uploadExcel(event)"></div></div>`;
        } else if(v === 'tasks') {
            mount.innerHTML = `<div class="panel"><table><thead><tr><th>Task</th><th>Staff</th><th>Action</th></tr></thead><tbody>${state.tasks.map(t => `<tr><td>${t.title}</td><td>${state.users.find(u=>u.id===t.userId)?.name || 'Unassigned'}</td><td><button onclick="toggleDone('${t.id}')">${t.status==='DONE'?'✅':'⭕'}</button> ${t.status!=='DONE' && state.users.find(u=>u.id===t.userId)?.phone ? `<button class="btn-whatsapp" onclick="wa('${state.users.find(u=>u.id===t.userId).phone}', '${t.title}')"><i class="fab fa-whatsapp"></i></button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
        } else if(v === 'staff') {
            mount.innerHTML = `<button class="btn btn-primary" style="margin-bottom:15px" onclick="document.getElementById('modal-user').classList.add('active')">+ Add Staff</button><div class="panel"><table><thead><tr><th>Name</th><th>Email</th><th>Action</th></tr></thead><tbody>${state.users.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td><button onclick="deleteUser('${u.id}')" style="color:red; background:none; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
        } else if(v === 'settings') {
            mount.innerHTML = `<div class="panel" style="max-width:500px"><h3>Security</h3><input type="password" id="new-pw" placeholder="New Password"><button class="btn btn-primary" onclick="changePw()">Update</button><hr><h3>Theme</h3><input id="p-img" placeholder="Profile Image URL" value="${state.session.profileImg}"><input id="w-img" placeholder="Wallpaper URL" value="${state.settings.wallpaper}"><button class="btn btn-primary" onclick="updateStyle()">Save</button></div>`;
        }
    }

    // 4. LOGIC
    function openTaskModal() {
        document.getElementById('f-t-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
        document.getElementById('modal-task').classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function saveTask() {
        state.tasks.unshift({id:'t'+Date.now(), title:document.getElementById('f-t-title').value, userId:document.getElementById('f-t-user').value, status:'TODO'});
        save(); closeModal('modal-task'); render();
    }
    function saveUser() {
        state.users.push({id:'u'+Date.now(), name:document.getElementById('f-u-name').value, email:document.getElementById('f-u-email').value, password:document.getElementById('f-u-pass').value, phone:document.getElementById('f-u-phone').value, profileImg: ''});
        save(); closeModal('modal-user'); render();
    }
    function deleteUser(id) { if(id !== 'u1' && confirm("Delete?")) { state.users = state.users.filter(u=>u.id!==id); save(); render(); } }
    function toggleDone(id) { const t=state.tasks.find(x=>x.id===id); if(t) t.status=t.status==='DONE'?'TODO':'DONE'; save(); render(); }
    function changePw() { const np=document.getElementById('new-pw').value; if(np) { const idx=state.users.findIndex(u=>u.id===state.session.id); state.users[idx].password=np; state.session.password=np; save(); alert("Success"); } }
    function updateStyle() { state.session.profileImg=document.getElementById('p-img').value; state.settings.wallpaper=document.getElementById('w-img').value; save(); location.reload(); }
    function downloadReport() { const ws=XLSX.utils.json_to_sheet(state.tasks); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tasks"); XLSX.writeFile(wb, "Report.xlsx"); }
    function uploadExcel(e) { const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{ const d=XLSX.read(ev.target.result,{type:'binary'}); XLSX.utils.sheet_to_json(d.Sheets[d.SheetNames[0]]).forEach(row=>{ state.tasks.unshift({id:'t'+Date.now()+Math.random(), title:row.TaskName, userId:'u1', status:'TODO'}); }); save(); render(); }; r.readAsBinaryString(f); }
    function wa(p, t) { window.open(`https://wa.me/${p.replace(/\D/g,'')}?text=${encodeURIComponent('Reminder: '+t)}`, '_blank'); }
    function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
</script>
</body>
</html>
