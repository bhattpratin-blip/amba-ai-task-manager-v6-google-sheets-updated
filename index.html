<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy PRO Management v10.3</title>
    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #10b981; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; --m: #64748b; --l: #e2e8f0; --s: #064e3b; --d: #ef4444; --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        body { margin: 0; background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; overflow: hidden; background-size: cover; background-position: center; transition: 0.3s; }
        .blur-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); z-index: -1; }

        /* Initial Loader */
        #boot-loader { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--p); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Auth Screens */
        .auth-screen { height: 100vh; width: 100vw; display: grid; place-items: center; background: linear-gradient(135deg, #10b981 0%, #064e3b 100%); position: fixed; inset: 0; z-index: 9999; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
        .auth-card h1 { color: var(--p); font-size: 1.8rem; margin-bottom: 5px; }

        /* Main Container */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 260px; background: var(--s); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-profile { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin: 2px 15px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--p); color: white; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .panel { background: var(--c); border-radius: 20px; border: 1px solid var(--l); padding: 20px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        /* Logic Components */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--c); padding: 20px; border-radius: 16px; border: 1px solid var(--l); text-align: center; }
        .profile-img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--p); margin-bottom: 10px; object-fit: cover; }
        
        .btn { padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; }
        .btn-danger { background: var(--d); color: white; }
        .btn-wa { background: #25d366; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--l); }
        
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .bg-high { background: #fee2e2; color: #b91c1c; }

        /* Notification */
        .notif-bell { position: relative; cursor: pointer; font-size: 1.4rem; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--d); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; }
        .notif-pane { display: none; position: absolute; top: 50px; right: 0; width: 320px; background: white; border-radius: 16px; box-shadow: var(--shadow); z-index: 1000; border: 1px solid var(--l); color: var(--t); }
        .notif-pane.active { display: block; }
        .notif-item { padding: 12px; border-bottom: 1px solid var(--l); font-size: 0.8rem; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; place-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: grid; }
        .modal { background: var(--c); padding: 30px; border-radius: 24px; width: 450px; box-shadow: var(--shadow); }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--l); outline: none; background: var(--bg); }
        
        #toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; z-index: 3000; }
    </style>
</head>
<body onload="bootApp()">
    <div id="boot-loader"><div class="spinner"></div><p>Connecting to Cloud...</p></div>
    <div class="blur-overlay"></div>
    <div id="app-root"></div>
    <div id="toast"></div>

    <!-- Modals -->
    <div class="modal-overlay" id="modal-task"><div class="modal"><h2>Assign Task</h2><input id="f-t-title" placeholder="Description"><select id="f-t-user"></select><input type="date" id="f-t-date"><select id="f-t-pri"><option value="HIGH">Urgent</option><option value="NORMAL" selected>Normal</option></select><button class="btn btn-p" style="width:100%" onclick="handleSaveTask()">Create Task</button><button class="btn" style="width:100%;margin-top:10px;background:none" onclick="closeModal('modal-task')">Cancel</button></div></div>
    <div class="modal-overlay" id="modal-user"><div class="modal"><h2>Add Staff</h2><input id="f-u-name" placeholder="Full Name"><input id="f-u-email" placeholder="Email"><input id="f-u-pass" type="password" placeholder="Password"><input id="f-u-phone" placeholder="WhatsApp (91...)"><select id="f-u-role"><option value="Staff">Pharmacist / Staff</option><option value="Admin">Manager / Admin</option></select><button class="btn btn-p" style="width:100%" onclick="handleSaveUser()">Create Account</button><button class="btn" style="width:100%;margin-top:10px;background:none" onclick="closeModal('modal-user')">Cancel</button></div></div>

    <script>
        // ==========================================
        // 1. CONFIG & CLOUD SYNC
        // ==========================================
        const API_URL = "PASTE_YOUR_SCRIPT_URL_HERE"; 
        const STORE_KEY = "PHARMACY_V10_3_MASTER";
        const RECOVERY_KEY = "PHARMA2024";

        let state = JSON.parse(localStorage.getItem(STORE_KEY)) || {
            tasks: [], users: [], masterTasks: [], recurringTasks: [], notifications: [], session: null,
            settings: { darkMode: false, sync: true, view: 'dashboard', wallpaper: '' }
        };

        async function bootApp() {
            try {
                const res = await fetch(API_URL);
                const cloud = await res.json();
                if (cloud && cloud.users && cloud.users.length > 0) {
                    state.users = cloud.users;
                    state.tasks = cloud.tasks || [];
                    state.masterTasks = cloud.masterTasks || [];
                    state.recurringTasks = cloud.recurringTasks || [];
                    state.notifications = cloud.notifications || [];
                    localStorage.setItem(STORE_KEY, JSON.stringify(state));
                }
            } catch(e) { console.warn("Cloud offline, loading local data."); }
            
            document.getElementById('boot-loader').style.display = 'none';
            if(state.settings.wallpaper) document.body.style.backgroundImage = `url(${state.settings.wallpaper})`;
            if(state.session) runEngines();
            renderApp();
        }

        const save = () => {
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
            if(state.settings.sync && state.session) {
                const payload = { action: 'syncDatabase', database: state };
                fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            }
        };

        // ==========================================
        // 2. AUTOMATION ENGINES
        // ==========================================
        function runEngines() {
            const todayStr = new Date().toDateString();
            let changed = false;
            
            // Automation logic
            state.recurringTasks.forEach(r => {
                if (r.lastRun !== todayStr) {
                    state.tasks.unshift({ id: 'rt'+Date.now(), title: "[AUTO] "+r.title, userId: state.session.id, status: 'TODO', date: new Date().toISOString().split('T')[0], priority: 'NORMAL' });
                    r.lastRun = todayStr;
                    state.notifications.unshift({ text: "Generated Daily: " + r.title, read: false, time: new Date().toLocaleTimeString(), urgent: false });
                    changed = true;
                }
            });

            // Overdue logic
            const now = new Date(); now.setHours(0,0,0,0);
            state.tasks.forEach(t => {
                if (t.status !== 'DONE' && t.date && new Date(t.date) < now && t.lastAlerted !== todayStr) {
                    state.notifications.unshift({ text: "🚨 OVERDUE: " + t.title, read: false, time: new Date().toLocaleTimeString(), urgent: true });
                    t.lastAlerted = todayStr;
                    changed = true;
                }
            });
            if(changed) save();
        }

        // ==========================================
        // 3. AUTHENTICATION
        // ==========================================
        function handleSetup() {
            const n = document.getElementById('s-name').value;
            const e = document.getElementById('s-email').value;
            const p = document.getElementById('s-pass').value;
            if(!n || !e || !p) return alert("Fill all fields");
            const u = { id: 'u1', name: n, email: e.trim().toLowerCase(), password: p, role: 'Admin', profileImg: '' };
            state.users = [u]; state.session = u; save(); bootApp();
        }

        function handleLogin() {
            const e = document.getElementById('l-email').value.trim().toLowerCase();
            const p = document.getElementById('l-pass').value.trim();
            const u = state.users.find(x => x.email.toLowerCase() === e && x.password === p);
            if(u) { state.session = u; save(); runEngines(); renderApp(); } else alert("Access Denied");
        }

        function nav(v) { state.settings.view = v; renderApp(); }

        // ==========================================
        // 4. MAIN RENDERER
        // ==========================================
        function renderApp() {
            const root = document.getElementById('app-root');
            if (state.users.length === 0) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>🛡️ System Setup</h1><input id="s-name" placeholder="Name"><input id="s-email" placeholder="Email"><input id="s-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleSetup()">Secure App</button></div></div>`;
                return;
            }
            if (!state.session) {
                root.innerHTML = `<div class="auth-screen"><div class="auth-card"><h1>💊 Pharmacy Login</h1><input id="l-email" placeholder="Email" value="${state.users[0].email}"><input id="l-pass" type="password" placeholder="Password"><button class="btn btn-p" style="width:100%" onclick="handleLogin()">Login</button></div></div>`;
                return;
            }

            const isA = state.session.role === 'Admin';
            const unread = state.notifications.filter(n => !n.read).length;

            root.innerHTML = `
                <div class="app-container">
                    <aside class="sidebar">
                        <div class="sidebar-profile">
                            <img src="${state.session.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="profile-img"><br>
                            <b>${state.session.name}</b><br><small style="opacity:0.7">${state.session.role}</small>
                        </div>
                        <nav class="nav-links">
                            <div class="nav-item ${state.settings.view==='dashboard'?'active':''}" onclick="nav('dashboard')"><i class="fas fa-home"></i> Dashboard</div>
                            <div class="nav-item ${state.settings.view==='tasks'?'active':''}" onclick="nav('tasks')"><i class="fas fa-list-check"></i> Tasks</div>
                            ${isA ? `<div class="nav-item ${state.settings.view==='staff'?'active':''}" onclick="nav('staff')"><i class="fas fa-users"></i> Staff Directory</div>` : ''}
                            ${isA ? `<div class="nav-item ${state.settings.view==='templates'?'active':''}" onclick="nav('templates')"><i class="fas fa-robot"></i> Automations</div>` : ''}
                            <div class="nav-item ${state.settings.view==='settings'?'active':''}" onclick="nav('settings')"><i class="fas fa-cog"></i> Settings</div>
                        </nav>
                        <div style="padding:20px"><button class="btn btn-danger" style="width:100%" onclick="state.session=null;save();renderApp();">Logout</button></div>
                    </aside>
                    <main class="main-content">
                        <header class="top-bar">
                            <h1>${state.settings.view.toUpperCase()}</h1>
                            <div style="display:flex; gap:15px; align-items:center;">
                                <div class="notif-bell" onclick="document.getElementById('notif-pane').classList.toggle('active')"><i class="fas fa-bell"></i>${unread ? `<span class="notif-badge">${unread}</span>` : ''}
                                    <div class="notif-pane" id="notif-pane">
                                        <div style="padding:10px; font-weight:800; border-bottom:1px solid var(--l)">Recent Alerts</div>
                                        ${state.notifications.map(n=>`<div class="notif-item">${n.text}</div>`).join('') || '<div class="notif-item">No alerts</div>'}
                                    </div>
                                </div>
                                ${isA ? `<button class="btn btn-p" onclick="downloadReport()">Excel</button>` : ''}
                                ${isA ? `<button class="btn btn-p" onclick="openTaskModal()">+ New Task</button>` : ''}
                            </div>
                        </header>
                        <div id="view-mount"></div>
                    </main>
                </div>`;
            renderView();
        }

        function renderView() {
            const mount = document.getElementById('view-mount');
            const isA = state.session.role === 'Admin';
            const v = state.settings.view;

            if(v === 'dashboard') {
                mount.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card"><span>Pending</span><h2>${state.tasks.filter(t=>t.status!=='DONE').length}</h2></div>
                        <div class="stat-card"><span>Staff</span><h2>${state.users.length}</h2></div>
                        <div class="stat-card"><span>Efficiency</span><h2>${state.tasks.length ? Math.round((state.tasks.filter(t=>t.status==='DONE').length/state.tasks.length)*100) : 0}%</h2></div>
                        <div class="stat-card"><span>Sync</span><p>${state.settings.sync?'Online':'Offline'}</p></div>
                    </div>
                    ${isA ? `<div class="panel"><h3>Excel Upload</h3><input type="file" onchange="uploadExcel(event)"></div>` : ''}
                    <div class="panel"><h3>Active Alerts</h3>${state.notifications.slice(0,3).map(n=>`<div>- ${n.text}</div>`).join('') || 'Clear'}</div>`;
            } else if(v === 'tasks') {
                mount.innerHTML = `<div class="panel"><table><thead><tr><th>Task</th><th>Staff</th><th>Status</th><th>Notify</th></tr></thead><tbody>
                ${state.tasks.map(t => `<tr><td><b>${t.title}</b></td><td>${state.users.find(u=>u.id===t.userId)?.name || '-'}</td>
                <td><button onclick="toggleDone('${t.id}')" style="background:none;border:none;cursor:pointer;font-size:1.2rem;">${t.status==='DONE'?'✅':'⭕'}</button></td>
                <td>${t.status!=='DONE' && state.users.find(u=>u.id===t.userId)?.phone ? `<button class="btn-wa" onclick="wa('${state.users.find(u=>u.id===t.userId).phone}','${t.title}')"><i class="fab fa-whatsapp"></i></button>` : '-'}</td></tr>`).join('')}
                </tbody></table></div>`;
            } else if(v === 'staff') {
                mount.innerHTML = `<div class="panel"><button class="btn btn-p" onclick="openModal('modal-user')">Add Staff</button><table><thead><tr><th>Name</th><th>Role</th><th>Phone</th></tr></thead><tbody>
                ${state.users.map(u => `<tr><td>${u.name}</td><td>${u.role}</td><td>${u.phone||'-'}</td></tr>`).join('')}
                </tbody></table></div>`;
            } else if(v === 'templates') {
                mount.innerHTML = `<div class="panel"><h3>Master Templates</h3><p>Workflow logic active.</p></div>`;
            } else if(v === 'settings') {
                mount.innerHTML = `<div class="panel"><h3>Settings</h3><label>Wallpaper URL</label><input id="wal" value="${state.settings.wallpaper}"><button class="btn btn-p" onclick="state.settings.wallpaper=document.getElementById('wal').value;save();location.reload();">Apply</button>
                <hr><button class="btn btn-danger" style="width:100%" onclick="localStorage.clear();location.reload();">Factory Reset Device</button></div>`;
            }
        }

        // Core Functions
        function openTaskModal() { document.getElementById('f-t-user').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join(''); openModal('modal-task'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function handleSaveTask() { state.tasks.unshift({id:'t'+Date.now(), title:document.getElementById('f-t-title').value, userId:document.getElementById('f-t-user').value, date:document.getElementById('f-t-date').value, priority:document.getElementById('f-t-pri').value, status:'TODO'}); save(); closeModal('modal-task'); renderApp(); }
        function handleSaveUser() { state.users.push({id:'u'+Date.now(), name:document.getElementById('f-u-name').value, email:document.getElementById('f-u-email').value, password:document.getElementById('f-u-pass').value, phone:document.getElementById('f-u-phone').value, role:document.getElementById('f-u-role').value}); save(); closeModal('modal-user'); renderApp(); }
        function toggleDone(id) { const t=state.tasks.find(x=>x.id===id); if(t) t.status=t.status==='DONE'?'TODO':'DONE'; save(); renderApp(); }
        function wa(p, t) { window.open(`https://wa.me/${p.replace(/\D/g,'')}?text=${encodeURIComponent('Reminder for task: '+t)}`, '_blank'); }
        function downloadReport() { const ws=XLSX.utils.json_to_sheet(state.tasks); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tasks"); XLSX.writeFile(wb, "Report.xlsx"); }
        function uploadExcel(e) { const f=e.target.files[0]; const r=new FileReader(); r.onload=(ev)=>{ const d=XLSX.read(ev.target.result,{type:'binary'}); XLSX.utils.sheet_to_json(d.Sheets[d.SheetNames[0]]).forEach(row=>{ state.tasks.unshift({id:'t'+Date.now()+Math.random(), title:row.TaskName || row.Task, userId:'u1', status:'TODO'}); }); save(); renderApp(); }; r.readAsBinaryString(f); }

    </script>
</body>
</html>
