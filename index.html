<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Task Manager V7.2</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3f4f6; --sidebar: #111827; --card: #ffffff; --text: #1f2937;
            --primary: #4f46e5; --ai: #8b5cf6; --line: #e5e7eb; --muted: #6b7280;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0; background: var(--sidebar);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box {
            background: #1f2937; padding: 40px; border-radius: 20px; text-align: center;
            width: 100%; max-width: 400px; color: white; box-shadow: var(--shadow);
        }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--sidebar); color: white;
            display: flex; flex-direction: column; position: fixed; height: 100vh;
            transition: 0.3s; z-index: 1000;
        }
        .sidebar-header { padding: 25px; font-weight: 800; font-size: 1.4rem; color: var(--primary); text-align: center; border-bottom: 1px solid #374151; }
        .nav-group { padding: 15px 0; flex: 1; overflow-y: auto; }
        .nav-item { 
            padding: 14px 25px; display: flex; align-items: center; gap: 12px; 
            color: #9ca3af; text-decoration: none; cursor: pointer; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { background: #374151; color: white; }
        .logout-btn { padding: 20px; border-top: 1px solid #374151; color: #f87171; font-weight: 700; cursor: pointer; text-align: center; }
        .logout-btn:hover { background: #7f1d1d; color: white; }

        /* Main Content */
        .main-content { margin-left: 260px; flex: 1; padding: 30px; transition: 0.3s; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-input { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--line); width: 300px; }

        /* Dashboard Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); border-left: 5px solid var(--primary); }
        .stat-card h3 { margin: 10px 0 0; font-size: 1.8rem; }

        /* UI Components */
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--line); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--muted); border-bottom: 2px solid var(--line); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
        
        button { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-wa { background: #25D366; color: white; font-size: 0.8rem; }
        .btn-danger { background: #fee2e2; color: #ef4444; }

        /* Workload Bar */
        .bar-container { background: #e5e7eb; height: 10px; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; background: var(--primary); transition: 0.5s; }

        /* Modal */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; place-items: center; z-index: 2000; }
        .modal-bg.open { display: grid; }
        .modal { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; }

        #toast { position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: white; padding: 12px 20px; border-radius: 8px; display: none; z-index: 3000; }

        @media (max-width: 900px) {
            .sidebar { width: 0; overflow: hidden; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--primary);">🤖 Amba AI Portal</h2>
            <p style="color: #9ca3af;">Please log in to continue</p>
            <input type="password" id="loginPass" placeholder="Enter Password" style="width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none;">
            <button class="btn-primary" style="width: 100%;" onclick="attemptLogin()">Login</button>
            <p style="font-size: 0.7rem; color: #6b7280; margin-top: 15px;">Hint: Admin@123</p>
        </div>
    </div>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">AMBA V7.2</div>
        <div class="nav-group">
            <div class="nav-item active" onclick="setView('dashboard')">📊 Dashboard</div>
            <div class="nav-item" onclick="setView('master')">📚 Task Manager</div>
            <div class="nav-item" onclick="setView('employees')">👥 Team Management</div>
            <div class="nav-item" onclick="setView('reports')">📈 Reports</div>
            <div class="nav-item" onclick="setView('settings')">⚙️ Settings</div>
        </div>
        <div class="logout-btn" onclick="handleLogout()">🚪 Logout Session</div>
    </nav>

    <!-- Content -->
    <main class="main-content">
        <header>
            <h1 id="view-title">Dashboard</h1>
            <div style="display:flex; gap:10px;">
                <input type="text" id="gSearch" class="search-input" placeholder="Search tasks..." oninput="refreshCurrentView()">
                <button class="btn-primary" onclick="openModal()">+ New Task</button>
            </div>
        </header>

        <div id="content-area"></div>
    </main>

    <!-- Task Modal -->
    <div class="modal-bg" id="taskModal">
        <div class="modal">
            <h2 id="modalTitle">Create New Task</h2>
            <form id="taskForm">
                <input type="hidden" id="editId">
                <label style="font-size: 0.8rem; font-weight: bold;">Task Title</label>
                <input type="text" id="tTitle" required style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ddd; border-radius:8px;">
                
                <label style="font-size: 0.8rem; font-weight: bold;">Assign To</label>
                <select id="tAssign" style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ddd; border-radius:8px;"></select>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label style="font-size: 0.8rem; font-weight: bold;">Due Date</label>
                        <input type="date" id="tDue" style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ddd; border-radius:8px;">
                    </div>
                    <div style="flex:1">
                        <label style="font-size: 0.8rem; font-weight: bold;">Priority</label>
                        <select id="tPri" style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ddd; border-radius:8px;">
                            <option>LOW</option><option selected>MEDIUM</option><option>HIGH</option>
                        </select>
                    </div>
                </div>
                
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button type="button" onclick="closeModal()" style="flex:1; background:#eee;">Cancel</button>
                    <button type="submit" class="btn-primary" style="flex:1;">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // Database Init
        let db = JSON.parse(localStorage.getItem('amba_v7_db')) || {
            tasks: [],
            users: [
                {id:'u1', name:'Admin', phone:'910000000000', role:'ADMIN'},
                {id:'u2', name:'Rahul', phone:'919999999999', role:'EMPLOYEE'},
                {id:'u3', name:'Suresh', phone:'918888888888', role:'EMPLOYEE'}
            ]
        };

        let currentView = 'dashboard';

        // Session & Security
        function attemptLogin() {
            const p = document.getElementById('loginPass').value;
            if(p === "Admin@123") {
                localStorage.setItem('amba_session', 'active');
                document.getElementById('login-screen').style.display = 'none';
                refreshCurrentView();
            } else {
                alert("Wrong password!");
            }
        }

        function handleLogout() {
            if(confirm("Logout?")) {
                localStorage.removeItem('amba_session');
                location.reload();
            }
        }

        function checkSession() {
            if(localStorage.getItem('amba_session') === 'active') {
                document.getElementById('login-screen').style.display = 'none';
            }
        }

        // Core Functions
        function save() {
            localStorage.setItem('amba_v7_db', JSON.stringify(db));
            refreshCurrentView();
        }

        function setView(v) {
            currentView = v;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            event?.currentTarget?.classList.add('active');
            document.getElementById('view-title').innerText = v.charAt(0).toUpperCase() + v.slice(1);
            refreshCurrentView();
        }

        function refreshCurrentView() {
            const area = document.getElementById('content-area');
            const search = document.getElementById('gSearch').value.toLowerCase();
            let tasks = db.tasks.filter(t => t.title.toLowerCase().includes(search));

            if(currentView === 'dashboard') renderDashboard(area, tasks);
            else if(currentView === 'master') renderMaster(area, tasks);
            else if(currentView === 'employees') renderEmployees(area);
            else if(currentView === 'reports') renderReports(area);
        }

        // Sub-renders
        function renderDashboard(area, tasks) {
            const pending = tasks.filter(t => t.status !== 'DONE').length;
            const completed = tasks.length - pending;

            area.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><h3>${tasks.length}</h3><small>All Tasks</small></div>
                    <div class="stat-card" style="border-left-color:var(--warning)"><h3>${pending}</h3><small>Pending</small></div>
                    <div class="stat-card" style="border-left-color:var(--success)"><h3>${completed}</h3><small>Finished</small></div>
                </div>
                <div class="card">
                    <h3>Team Workload Analysis</h3>
                    <div id="workload-list"></div>
                </div>
            `;
            const wl = document.getElementById('workload-list');
            wl.innerHTML = db.users.map(u => {
                const ut = db.tasks.filter(t => t.userId === u.id);
                const done = ut.filter(t => t.status === 'DONE').length;
                const perc = ut.length ? Math.round((done/ut.length)*100) : 0;
                return `
                    <div style="margin-bottom:15px;">
                        <div style="display:flex; justify-content:space-between;"><small>${u.name}</small><small>${perc}%</small></div>
                        <div class="bar-container"><div class="bar-fill" style="width:${perc}%"></div></div>
                    </div>
                `;
            }).join('');
        }

        function renderMaster(area, tasks) {
            area.innerHTML = `
                <div class="card">
                    <table>
                        <thead><tr><th>Task</th><th>Assigned To</th><th>Due Date</th><th>Priority</th><th>Action</th></tr></thead>
                        <tbody>${tasks.map(t => {
                            const u = db.users.find(x => x.id === t.userId);
                            return `
                                <tr>
                                    <td><strong>${t.title}</strong></td>
                                    <td>${u ? u.name : '---'}</td>
                                    <td>${t.due || 'No Date'}</td>
                                    <td><span style="font-size:0.7rem; font-weight:800; color:${t.priority === 'HIGH' ? 'red' : 'orange'}">${t.priority}</span></td>
                                    <td>
                                        <button class="btn-wa" onclick="sendWA('${t.id}')">📲 WA</button>
                                        <button onclick="toggleDone('${t.id}')">${t.status === 'DONE' ? '↩️' : '✅'}</button>
                                        <button class="btn-danger" onclick="deleteTask('${t.id}')">🗑️</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}</tbody>
                    </table>
                </div>
            `;
        }

        function renderEmployees(area) {
            area.innerHTML = `
                <div class="card">
                    <h3>Register Staff</h3>
                    <div style="display:grid; grid-template-columns:1fr 1fr auto; gap:10px;">
                        <input id="newEmpName" placeholder="Staff Name" style="padding:10px; border-radius:8px; border:1px solid #ddd;">
                        <input id="newEmpPhone" placeholder="WhatsApp (e.g. 91...)" style="padding:10px; border-radius:8px; border:1px solid #ddd;">
                        <button class="btn-primary" onclick="addEmployee()">Add Staff</button>
                    </div>
                </div>
                <div class="card">
                    <h3>Current Staff List</h3>
                    <table><thead><tr><th>Name</th><th>Phone</th><th>Action</th></tr></thead>
                    <tbody>${db.users.map(u => `<tr><td>${u.name}</td><td>${u.phone}</td><td><button class="btn-danger" onclick="delEmployee('${u.id}')">Remove</button></td></tr>`).join('')}</tbody>
                    </table>
                </div>
            `;
        }

        function renderReports(area) {
            area.innerHTML = `<div class="card"><h3>Export Options</h3><button class="btn-primary" onclick="exportData()">Download Excel Report</button></div>`;
        }

        // Actions
        function openModal() {
            document.getElementById('tAssign').innerHTML = db.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            document.getElementById('taskModal').classList.add('open');
        }
        function closeModal() { document.getElementById('taskModal').classList.remove('open'); document.getElementById('taskForm').reset(); }

        document.getElementById('taskForm').onsubmit = (e) => {
            e.preventDefault();
            const newTask = {
                id: 't' + Date.now(),
                title: document.getElementById('tTitle').value,
                userId: document.getElementById('tAssign').value,
                due: document.getElementById('tDue').value,
                priority: document.getElementById('tPri').value,
                status: 'TODO'
            };
            db.tasks.unshift(newTask);
            save(); closeModal();
        };

        function toggleDone(id) {
            const t = db.tasks.find(x => x.id === id);
            t.status = t.status === 'DONE' ? 'TODO' : 'DONE';
            save();
        }

        function deleteTask(id) { if(confirm("Delete?")) { db.tasks = db.tasks.filter(t => t.id !== id); save(); } }

        function sendWA(id) {
            const t = db.tasks.find(x => x.id === id);
            const u = db.users.find(x => x.id === t.userId);
            const msg = `*AMBA AI TASK ALERT*%0A------------------%0A*Task:* ${t.title}%0A*Due Date:* ${t.due}%0A*Priority:* ${t.priority}%0A%0A_Please complete this task as soon as possible._`;
            window.open(`https://wa.me/${u.phone}?text=${msg}`);
        }

        function addEmployee() {
            const name = document.getElementById('newEmpName').value;
            const phone = document.getElementById('newEmpPhone').value;
            if(!name || !phone) return alert("Fill all fields");
            db.users.push({id:'u'+Date.now(), name, phone, role:'EMPLOYEE'});
            save();
        }

        function delEmployee(id) { if(confirm("Remove staff?")) { db.users = db.users.filter(u => u.id !== id); save(); } }

        function exportData() {
            const ws = XLSX.utils.json_to_sheet(db.tasks);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Tasks");
            XLSX.writeFile(wb, "Amba_Task_Report.xlsx");
        }

        // Startup
        checkSession();
        refreshCurrentView();

    </script>
</body>
</html>
