<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amba AI Pro v7 | Task Intelligence</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #8b5cf6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --sidebar: #1e293b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .dark {
            --bg: #020617;
            --card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --sidebar: #0f172a;
        }

        * { box-sizing: border-box; transition: background 0.3s, border 0.3s; }
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-main); }
        
        /* Layout Structure */
        .app-container { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .sidebar-header { padding: 24px; text-align: center; border-bottom: 1px solid #334155; }
        .sidebar-nav { flex: 1; padding: 16px; }
        .nav-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 4px;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
        
        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        header { 
            padding: 16px 32px; background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; sticky; top: 0; z-index: 10;
        }
        
        .view-area { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* Dashboard Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .stat-card span { font-size: 0.875rem; color: var(--text-muted); font-weight: 500; }
        .stat-card h3 { font-size: 1.875rem; margin: 8px 0 0 0; }

        /* Widgets & Panels */
        .panel { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }

        /* Buttons & Inputs */
        button { 
            padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; 
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; 
            background: var(--card); color: var(--text-main); margin-top: 4px;
        }

        /* AI Chat Box */
        .ai-chat-window { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--bg); border-radius: 12px; margin: 16px 0; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
        .bubble.ai { background: var(--accent); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .bubble.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        /* Task Cards */
        .task-list { display: grid; gap: 16px; }
        .task-item { 
            background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .priority-tag { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; font-weight: 800; text-transform: uppercase; }
        .p-high { background: #fee2e2; color: #b91c1c; }
        .p-med { background: #fef3c7; color: #92400e; }
        .p-low { background: #dcfce7; color: #15803d; }

        /* Modals */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; 
            place-items: center; z-index: 100; backdrop-filter: blur(4px); 
        }
        .modal-overlay.active { display: grid; }
        .modal-content { background: var(--card); width: min(600px, 95%); padding: 32px; border-radius: 20px; max-height: 90vh; overflow-y: auto; }

        /* Progress Bar */
        .progress-container { height: 8px; background: var(--border); border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); }

        @media (max-width: 1024px) { .grid-2 { grid-template-columns: 1fr; } .sidebar { width: 80px; } .sidebar span { display: none; } }
    </style>
</head>
<body>

<div id="app">
    <!-- Content injected by JS -->
</div>

<script>
// --- CORE STATE ---
const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL"; // Update this
const DB_KEY = "AMBA_PRO_DB_V7";

let state = JSON.parse(localStorage.getItem(DB_KEY)) || {
    users: [
        { id: 'u1', name: 'Admin User', email: 'admin@amba.local', password: '123', role: 'ADMIN' },
        { id: 'u2', name: 'Rahul Sharma', email: 'rahul@amba.local', password: '123', role: 'EMPLOYEE' }
    ],
    tasks: [],
    notifications: [],
    config: { theme: 'light', lastSync: null }
};

let currentUser = JSON.parse(sessionStorage.getItem('AMBA_SESSION'));
let currentView = 'dashboard';
let chatHistory = [{ role: 'ai', text: "Hello! I'm Amba AI. How can I help you manage your tasks today?" }];

// --- UTILS ---
const save = () => localStorage.setItem(DB_KEY, JSON.stringify(state));
const getTasks = () => state.tasks.filter(t => currentUser.role === 'ADMIN' || t.assignedTo === currentUser.id);

// --- NAVIGATION ---
function navigate(view) {
    currentView = view;
    renderApp();
}

// --- AI ENGINE ---
function processAICommand(input) {
    const q = input.toLowerCase();
    let response = "";

    if (q.includes("overdue")) {
        const count = getTasks().filter(t => t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'DONE').length;
        response = `You have ${count} overdue tasks. I recommend tackling the high-priority ones first.`;
    } 
    else if (q.includes("create task") || q.includes("add")) {
        response = "I've opened the task creator for you. Tell me the details!";
        openModal('task');
    }
    else if (q.includes("who is busy") || q.includes("workload")) {
        const stats = state.users.filter(u => u.role === 'EMPLOYEE').map(u => {
            const count = state.tasks.filter(t => t.assignedTo === u.id && t.status !== 'DONE').length;
            return `${u.name} (${count} tasks)`;
        });
        response = `Current workload: ${stats.join(', ')}.`;
    }
    else {
        response = "I can help you track deadlines, assign tasks, or analyze team productivity. Try asking 'Who is busy?' or 'Show overdue tasks'.";
    }

    chatHistory.push({ role: 'user', text: input });
    chatHistory.push({ role: 'ai', text: response });
    renderApp();
}

// --- VIEWS ---

function renderDashboard() {
    const tasks = getTasks();
    const pending = tasks.filter(t => t.status !== 'DONE');
    const overdue = pending.filter(t => t.dueDate && new Date(t.dueDate) < new Date());
    const completionRate = tasks.length ? Math.round((tasks.filter(t => t.status === 'DONE').length / tasks.length) * 100) : 0;

    return `
        <div class="stats-grid">
            <div class="stat-card"><span>Total Tasks</span><h3>${tasks.length}</h3></div>
            <div class="stat-card"><span>Pending</span><h3 style="color:var(--warning)">${pending.length}</h3></div>
            <div class="stat-card"><span>Overdue</span><h3 style="color:var(--danger)">${overdue.length}</h3></div>
            <div class="stat-card"><span>Completion Rate</span><h3 style="color:var(--success)">${completionRate}%</h3></div>
        </div>

        <div class="grid-2">
            <div>
                <div class="panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h2 style="margin:0">Active Tasks</h2>
                        <button class="btn-primary" onclick="openModal('task')">+ New Task</button>
                    </div>
                    <div class="task-list">
                        ${pending.length ? pending.slice(0, 5).map(t => renderTaskItem(t)).join('') : '<p>No active tasks found.</p>'}
                    </div>
                </div>
            </div>
            <aside>
                <div class="panel" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white;">
                    <h3>🤖 Amba AI Insights</h3>
                    <p style="opacity:0.9; font-size:0.9rem;">${overdue.length > 0 ? `Alert: You have ${overdue.length} tasks past deadline. Project health is 'Critical'.` : 'All deadlines are on track. Project health is "Excellent".'}</p>
                </div>
                
                <div class="panel">
                    <h3>Employee Productivity</h3>
                    ${state.users.filter(u => u.role === 'EMPLOYEE').map(u => {
                        const userTasks = state.tasks.filter(t => t.assignedTo === u.id);
                        const done = userTasks.filter(t => t.status === 'DONE').length;
                        const pct = userTasks.length ? Math.round((done/userTasks.length)*100) : 0;
                        return `
                            <div style="margin-bottom:15px">
                                <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px">
                                    <span>${u.name}</span>
                                    <span>${pct}%</span>
                                </div>
                                <div class="progress-container"><div class="progress-bar" style="width:${pct}%"></div></div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </aside>
        </div>
    `;
}

function renderTaskItem(t) {
    const assignee = state.users.find(u => u.id === t.assignedTo)?.name || 'Unassigned';
    return `
        <div class="task-item">
            <div>
                <div style="display:flex; align-items:center; gap:10px">
                    <span class="priority-tag p-${t.priority.toLowerCase().slice(0,3)}">${t.priority}</span>
                    <strong style="font-size:1.05rem">${t.title}</strong>
                </div>
                <div style="color:var(--text-muted); font-size:0.85rem; margin-top:5px">
                    👤 ${assignee} &nbsp; 📅 ${t.dueDate || 'No Date'}
                </div>
            </div>
            <div style="display:flex; gap:8px">
                <button class="btn-outline" onclick="editTask('${t.id}')">Edit</button>
                <button class="btn-outline" style="color:var(--success)" onclick="updateStatus('${t.id}', 'DONE')">✓</button>
            </div>
        </div>
    `;
}

// --- MAIN RENDERER ---
function renderApp() {
    const app = document.getElementById('app');
    
    if (!currentUser) {
        renderLogin();
        return;
    }

    app.innerHTML = `
        <div class="app-container">
            <nav class="sidebar">
                <div class="sidebar-header"><h2>Amba AI Pro</h2></div>
                <div class="sidebar-nav">
                    <a href="#" class="nav-item ${currentView === 'dashboard' ? 'active' : ''}" onclick="navigate('dashboard')"><span>📊</span> <span>Dashboard</span></a>
                    <a href="#" class="nav-item ${currentView === 'tasks' ? 'active' : ''}" onclick="navigate('tasks')"><span>📝</span> <span>All Tasks</span></a>
                    <a href="#" class="nav-item ${currentView === 'team' ? 'active' : ''}" onclick="navigate('team')"><span>👥</span> <span>Team</span></a>
                    <a href="#" class="nav-item ${currentView === 'reports' ? 'active' : ''}" onclick="navigate('reports')"><span>📈</span> <span>Reports</span></a>
                </div>
                <div style="padding:16px; border-top:1px solid #334155">
                    <a href="#" class="nav-item" onclick="logout()"><span>🚪</span> <span>Logout</span></a>
                </div>
            </nav>
            
            <main class="main-content">
                <header>
                    <div>
                        <h1 style="font-size:1.25rem; margin:0">${currentView.toUpperCase()}</h1>
                        <span style="font-size:0.85rem; color:var(--text-muted)">Welcome back, ${currentUser.name}</span>
                    </div>
                    <div style="display:flex; gap:12px">
                        <button class="btn-outline" onclick="toggleTheme()">🌓</button>
                        <button class="btn-primary" onclick="openModal('ai')">🤖 Ask AI</button>
                    </div>
                </header>

                <div class="view-area">
                    ${currentView === 'dashboard' ? renderDashboard() : `<div class="panel"><h2>${currentView} view coming soon</h2></div>`}
                </div>
            </main>
        </div>

        <div id="modal" class="modal-overlay">
            <div class="modal-content" id="modal-inner"></div>
        </div>
    `;
}

function renderLogin() {
    document.getElementById('app').innerHTML = `
        <div style="height:100vh; display:grid; place-items:center; background:linear-gradient(135deg, #6366f1 0%, #a855f7 100%)">
            <div class="panel" style="width:400px; text-align:center; padding:40px">
                <h1 style="margin-bottom:10px">Amba AI</h1>
                <p style="color:var(--text-muted)">Login to your workspace</p>
                <form onsubmit="handleLogin(event)" style="text-align:left; margin-top:24px">
                    <label>Email Address</label>
                    <input type="email" id="login_email" value="admin@amba.local" required>
                    <div style="margin-top:16px">
                        <label>Password</label>
                        <input type="password" id="login_pass" value="123" required>
                    </div>
                    <button class="btn-primary" style="width:100%; margin-top:24px; justify-content:center">Login to Dashboard</button>
                </form>
            </div>
        </div>
    `;
}

// --- MODAL LOGIC ---
function openModal(type) {
    const modal = document.getElementById('modal');
    const inner = document.getElementById('modal-inner');
    modal.classList.add('active');

    if (type === 'ai') {
        inner.innerHTML = `
            <h3>🤖 Amba AI Assistant</h3>
            <div class="ai-chat-window" id="chat-box">
                ${chatHistory.map(m => `<div class="bubble ${m.role}">${m.text}</div>`).join('')}
            </div>
            <div style="display:flex; gap:8px">
                <input type="text" id="ai-input" placeholder="e.g. List my overdue tasks...">
                <button class="btn-primary" onclick="handleAICmd()">Send</button>
            </div>
            <button class="btn-outline" style="width:100%; margin-top:15px" onclick="closeModal()">Close</button>
        `;
        const box = document.getElementById('chat-box');
        box.scrollTop = box.scrollHeight;
    } else if (type === 'task') {
        inner.innerHTML = `
            <h3>Create New Task</h3>
            <form onsubmit="handleSaveTask(event)">
                <label>Task Title</label><input id="t_title" required>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px">
                    <div><label>Priority</label><select id="t_pri"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div>
                    <div><label>Due Date</label><input type="date" id="t_due"></div>
                </div>
                <div style="margin-top:16px">
                    <label>Assign To</label>
                    <select id="t_assign">
                        <option value="">Unassigned</option>
                        ${state.users.filter(u => u.role === 'EMPLOYEE').map(u => `<option value="${u.id}">${u.name}</option>`).join('')}
                    </select>
                </div>
                <div style="display:flex; gap:12px; margin-top:24px">
                    <button type="button" class="btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
                    <button class="btn-primary" style="flex:1; justify-content:center">Create Task</button>
                </div>
            </form>
        `;
    }
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

// --- EVENT HANDLERS ---
function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login_email').value;
    const user = state.users.find(u => u.email === email);
    if (user) {
        currentUser = user;
        sessionStorage.setItem('AMBA_SESSION', JSON.stringify(user));
        renderApp();
    }
}

function handleSaveTask(e) {
    e.preventDefault();
    const newTask = {
        id: 't' + Date.now(),
        title: document.getElementById('t_title').value,
        priority: document.getElementById('t_pri').value,
        dueDate: document.getElementById('t_due').value,
        assignedTo: document.getElementById('t_assign').value,
        status: 'TODO',
        createdAt: new Date().toISOString()
    };
    state.tasks.unshift(newTask);
    save();
    closeModal();
    renderApp();
}

function handleAICmd() {
    const input = document.getElementById('ai-input').value;
    if (input) processAICommand(input);
}

function updateStatus(id, status) {
    const t = state.tasks.find(x => x.id === id);
    if (t) {
        t.status = status;
        save();
        renderApp();
    }
}

function toggleTheme() {
    document.body.classList.toggle('dark');
    state.config.theme = document.body.classList.contains('dark') ? 'dark' : 'light';
    save();
}

function logout() {
    sessionStorage.removeItem('AMBA_SESSION');
    location.reload();
}

// --- INITIALIZE ---
if (state.config.theme === 'dark') document.body.classList.add('dark');
renderApp();

</script>
</body>
</html>
