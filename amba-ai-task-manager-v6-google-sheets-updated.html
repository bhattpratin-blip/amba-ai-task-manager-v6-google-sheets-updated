<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amba AI Task Manager V6 - Google Sheets</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#18212f;--muted:#6b7280;--line:#e5e7eb;--primary:#4f46e5;--ai:#7c3aed;--danger:#dc2626;--shadow:0 10px 30px #00000012}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body.dark{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.ai-btn{background:var(--ai);color:#fff}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}textarea{min-height:95px;resize:vertical}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:var(--card);padding:32px;border-radius:20px;box-shadow:var(--shadow)}.login-card h1{text-align:center}.login-card p{text-align:center;color:var(--muted)}.group{margin:14px 0}.group label{display:block;font-weight:700;margin-bottom:6px}.demo{background:var(--bg);padding:14px;border-radius:12px;color:var(--muted);font-size:13px;margin-top:18px}
.shell{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{margin:0}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.stat,.panel,.task{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:28px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 370px;gap:18px}.panel{padding:18px}.toolbar{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:16px}.tasks{display:grid;gap:14px}.task{padding:18px}.task-head{display:flex;justify-content:space-between;gap:15px}.task h3{margin:0 0 8px}.task p{color:var(--muted);white-space:pre-wrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.pill{border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.high{background:#fee2e2;color:#991b1b}.medium{background:#fef3c7;color:#92400e}.low{background:#dcfce7;color:#166534}.status{background:#e0e7ff;color:#3730a3}.empty{text-align:center;padding:45px;color:var(--muted)}
.ai-panel{background:linear-gradient(135deg,#ede9fe,#f5f3ff);color:#312e81;border:1px solid #ddd6fe}.dark .ai-panel{background:#312e81;color:#ede9fe}.ai-panel h2{margin-top:0}.ai-chat{height:230px;overflow:auto;background:var(--card);border-radius:12px;padding:12px;margin:12px 0;color:var(--text)}.msg{padding:9px 11px;border-radius:10px;margin:7px 0;max-width:95%;font-size:14px}.msg.user{background:#e0e7ff;margin-left:auto}.msg.ai{background:#f3f4f6}.dark .msg.ai{background:#334155}.ai-input{display:flex;gap:8px}
.upload-box{border:2px dashed #a78bfa;border-radius:14px;padding:18px;background:#faf5ff}.dark .upload-box{background:#312e81}.upload-box h2{margin-top:0}.upload-row{display:flex;gap:10px;align-items:center}.upload-row input{flex:1}.sample{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}.allocation{display:grid;gap:10px}.employee-card{border:1px solid var(--line);border-radius:12px;padding:13px}.employee-card h3{margin:0 0 8px}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}
.notice{position:relative}.menu{display:none;position:absolute;right:0;top:48px;width:350px;max-width:calc(100vw - 25px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:10}.menu.open{display:block}.menu-head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.notice-item{padding:12px;border-bottom:1px solid var(--line);font-size:14px}.notice-item.unread{background:#eef2ff}.notice-item small{display:block;color:var(--muted);margin-top:4px}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;place-items:center;padding:20px;z-index:20}.modal-bg.open{display:grid}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.admin-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:750px){.top,.task-head{flex-direction:column;align-items:flex-start}.stats,.toolbar,.admin-form{grid-template-columns:1fr}.upload-row{flex-direction:column;align-items:stretch}.actions{width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzj-8D5NIf5qH2CRcYzFo25HhrHP0Zk3wUCGKkh_ChpUjUovaQJQFXCDrpfVbHYikFQ/exec";
const DB="amba_ai_task_manager_v6",SESSION="amba_ai_session_v6",REMEMBER="amba_ai_remember_v6";
let cloudReady=false;
let cloudSyncTimer=null;
let db=JSON.parse(localStorage.getItem(DB)||"null")||{users:[
{id:"u1",name:"Admin",email:"admin@amba.local",password:"Admin@123",role:"ADMIN"},
{id:"u2",name:"Rahul",email:"rahul@amba.local",password:"Employee@123",role:"EMPLOYEE"}],tasks:[],notifications:[]};
let session=JSON.parse(localStorage.getItem(SESSION)||sessionStorage.getItem(SESSION)||"null"),editing=null,deleting=null;
const user=()=>db.users.find(x=>x.id===session?.userId);
function localSave(){localStorage.setItem(DB,JSON.stringify(db));}
async function apiPost(payload){
  if(!API_URL || API_URL.includes("PASTE_YOUR")) return {success:false,message:"API URL not configured"};
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){console.error(e);return {success:false,error:e.toString()};}
}
async function syncDatabase(){
  localSave();
  if(!cloudReady) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(async()=>{
    const result=await apiPost({action:"syncDatabase",database:db});
    if(!result.success) toast("Cloud sync failed — local copy retained");
  },250);
}
const save=()=>{syncDatabase();};
const esc=x=>{let d=document.createElement("div");d.textContent=x??"";return d.innerHTML};
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.cssText="position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 17px;border-radius:10px;z-index:99";setTimeout(()=>t.style.display="none",2600)}
function notify(uid,msg){if(!uid)return;db.notifications.unshift({id:"n"+Date.now()+Math.random(),userId:uid,message:msg,read:false,date:new Date().toISOString()});save()}
function dateText(d){return d?new Date(d+"T00:00:00").toLocaleDateString("en-IN"):"No due date"}
function norm(v){return String(v??"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"")}
function parseDate(v){if(!v)return null;if(v instanceof Date)return v.toISOString().slice(0,10);let s=String(v).trim();let d=new Date(s);if(!isNaN(d))return d.toISOString().slice(0,10);let p=s.split(/[\/\-\.]/);if(p.length===3){if(p[0].length===4)return `${p[0]}-${String(p[1]).padStart(2,"0")}-${String(p[2]).padStart(2,"0")}`;return `${p[2]}-${String(p[1]).padStart(2,"0")}-${String(p[0]).padStart(2,"0")}`}return null}
function statusNorm(v){let s=norm(v);if(["done","completed","complete","closed"].includes(s))return"DONE";if(["inprogress","progress","working"].includes(s))return"IN_PROGRESS";return"TODO"}
function priorityNorm(v){let s=norm(v);if(s==="high"||s==="urgent")return"HIGH";if(s==="low")return"LOW";return"MEDIUM"}
function renderLogin(){app.innerHTML=`<main class="login"><section class="login-card"><h1>🤖 Amba AI Task Manager</h1><p>Smart task management with Excel work allocation</p><form id="loginForm"><div class="group"><label>Email</label><input id="email" type="email" required></div><div class="group"><label>Password</label><input id="password" type="password" required></div><div style="display:flex;align-items:center;gap:8px;margin:12px 0 18px"><input id="rememberMe" type="checkbox" style="width:auto"><label for="rememberMe" style="margin:0;font-weight:600">Remember Me</label></div><button class="primary" style="width:100%">Login</button></form><div class="demo"><b>Admin:</b> admin@amba.local / Admin@123<br><br><b>Employee:</b> rahul@amba.local / Employee@123</div></section></main>`;loginForm.onsubmit=e=>{e.preventDefault();let x=db.users.find(u=>u.email.toLowerCase()===email.value.toLowerCase()&&u.password===password.value);if(!x)return toast("Invalid login");session={userId:x.id};let remember=document.getElementById("rememberMe")?.checked;if(remember){localStorage.setItem(SESSION,JSON.stringify(session));localStorage.setItem(REMEMBER,"true")}else{sessionStorage.setItem(SESSION,JSON.stringify(session));localStorage.removeItem(SESSION);localStorage.removeItem(REMEMBER)}renderApp()}}
function renderApp(){let u=user();app.innerHTML=`<main class="shell"><header class="top"><div><h1>🤖 Amba AI Task Manager V6</h1><div class="muted">Welcome ${esc(u.name)} · ${u.role}</div></div><div class="actions"><div class="notice"><button class="secondary" id="noticeBtn">🔔 <span id="badge"></span></button><div class="menu" id="noticeMenu"><div class="menu-head"><b>Notifications</b><button class="secondary" id="readAll">Read all</button></div><div id="noticeList"></div></div></div><button class="secondary" id="theme">🌙</button><button class="secondary" id="cloudSync">☁️ Sync</button><button class="secondary" id="logout">Logout</button><button class="primary" id="add">+ Add Task</button></div></header>
<section class="stats"><div class="stat"><span>Total Tasks</span><strong id="total">0</strong></div><div class="stat"><span>Pending</span><strong id="pending">0</strong></div><div class="stat"><span>In Progress</span><strong id="progress">0</strong></div><div class="stat"><span>Completed</span><strong id="done">0</strong></div><div class="stat"><span>Overdue</span><strong id="overdue">0</strong></div></section>
${u.role==="ADMIN"?`<section class="panel upload-box" style="margin-bottom:18px"><h2>📊 Excel Work Allocation Upload</h2><p class="muted">Upload an Excel file to create and allocate tasks automatically by employee name.</p><div class="upload-row"><input type="file" id="excelFile" accept=".xlsx,.xls,.csv"><button class="ai-btn" id="uploadExcel">Upload & Allocate</button><button class="secondary" id="downloadTemplate">Download Template</button></div><div class="sample"><b>Recommended columns:</b> EMPLOYEE NAME, TASK / TITLE, DESCRIPTION, DUE DATE, PRIORITY, STATUS<br><b>Example:</b> RAHUL | CHECK OPD STOCK | Verify pharmacy stock | 20-07-2026 | HIGH | TODO</div><div id="uploadResult" class="muted" style="margin-top:10px"></div></section>`:""}
${u.role==="ADMIN"?`<section class="panel" style="margin-bottom:18px"><h2>👥 Create Employee</h2><form id="userForm" class="admin-form"><input id="newName" placeholder="Employee name" required><input id="newEmail" type="email" placeholder="Email" required><input id="newPass" placeholder="Temporary password" required><button class="primary">Create Employee</button></form></section>`:""}

<section class="panel" style="margin-bottom:18px">
<h2>📊 Reports & Analytics</h2>
<div class="toolbar" style="grid-template-columns:1fr 1fr 1fr 1fr auto auto">
<select id="reportEmployee"><option value="ALL">All Employees</option></select>
<input id="reportFrom" type="date" title="From date">
<input id="reportTo" type="date" title="To date">
<select id="reportType"><option value="ALL">All Tasks</option><option value="PENDING">Pending Only</option><option value="DONE">Completed Only</option><option value="OVERDUE">Overdue Only</option></select>
<button class="primary" id="generateReport">Generate Report</button>
<button class="success" id="exportReport">Export Excel</button>
</div>
<div id="reportSummary" class="stats" style="grid-template-columns:repeat(5,1fr);margin-top:14px"></div>
<div style="overflow:auto;margin-top:14px">
<table id="reportTable" style="width:100%;border-collapse:collapse">
<thead><tr><th style="text-align:left;padding:10px;border-bottom:1px solid var(--line)">Employee</th><th style="text-align:left;padding:10px;border-bottom:1px solid var(--line)">Task</th><th style="text-align:left;padding:10px;border-bottom:1px solid var(--line)">Due Date</th><th style="text-align:left;padding:10px;border-bottom:1px solid var(--line)">Priority</th><th style="text-align:left;padding:10px;border-bottom:1px solid var(--line)">Status</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>
<div class="grid"><section><div class="toolbar"><input id="search" placeholder="🔍 Search tasks..."><select id="fe"><option value="ALL">All Employees</option>${db.users.filter(x=>x.role==="EMPLOYEE").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><select id="fs"><option value="ALL">All Status</option><option value="TODO">To Do</option><option value="IN_PROGRESS">In Progress</option><option value="DONE">Done</option></select><select id="fp"><option value="ALL">All Priority</option><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option></select><select id="sort"><option value="new">Newest</option><option value="due">Due Soon</option><option value="late">Due Latest</option></select><button class="secondary" id="refresh">Refresh</button></div><div id="tasks" class="tasks"></div></section>
<aside><section class="panel ai-panel"><h2>🤖 AI Assistant</h2><div class="muted">Ask about tasks, workload, overdue work, or create tasks.</div><div id="chat" class="ai-chat"><div class="msg ai">Try: “Show Rahul's pending tasks” or “Create a task to check stock tomorrow with high priority”.</div></div><div class="ai-input"><input id="aiText" placeholder="Ask AI..."><button class="ai-btn" id="askAI">Ask</button></div></section><section class="panel" style="margin-top:18px"><h2>📊 Name-wise Work Allocation</h2><div id="allocation" class="allocation"></div></section><section class="panel" style="margin-top:18px"><h2>✨ AI Productivity Insights</h2><div id="insights"></div></section></aside></div></main>
<div id="taskModal" class="modal-bg"><div class="modal"><h2 id="modalTitle">Create Task</h2><div class="ai-panel" style="padding:14px;border-radius:12px;margin-bottom:15px"><b>✨ AI Quick Create</b><div class="ai-input" style="margin-top:10px"><input id="quick" placeholder="e.g. Assign Rahul to check stock tomorrow urgently"><button class="ai-btn" id="parse">Parse</button></div></div><form id="taskForm"><div class="group"><label>Title *</label><input id="title" required></div><div class="group"><label>Description</label><textarea id="desc"></textarea></div><div class="group"><label>Due Date</label><input id="due" type="date"></div><div class="group"><label>Priority</label><select id="pri"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div><div class="group"><label>Status</label><select id="sta"><option value="TODO">To Do</option><option value="IN_PROGRESS">In Progress</option><option value="DONE">Done</option></select></div>${u.role==="ADMIN"?`<div class="group"><label>Assign To</label><select id="assign"><option value="">Unassigned</option>${db.users.filter(x=>x.role==="EMPLOYEE").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>`:""}<div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Save Task</button></div></form></div></div>
<div id="deleteModal" class="modal-bg"><div class="modal"><h2>Delete Task?</h2><p>Are you sure you want to delete this task?</p><div class="modal-actions"><button class="secondary" id="cancelDelete">Cancel</button><button class="danger" id="confirmDelete">Delete</button></div></div></div></main>`;bind();renderTasks();renderNotifications();renderAllocation();renderInsights()}
function visible(){let u=user(),q=(search.value||"").toLowerCase(),a=db.tasks.filter(t=>u.role==="ADMIN"||t.createdBy===u.id||t.assignedTo===u.id);if(q)a=a.filter(t=>(t.title+" "+t.description).toLowerCase().includes(q));if(fe.value!=="ALL")a=a.filter(t=>t.assignedTo===fe.value);if(fs.value!=="ALL")a=a.filter(t=>t.status===fs.value);if(fp.value!=="ALL")a=a.filter(t=>t.priority===fp.value);if(sort.value==="due")a.sort((x,y)=>(x.dueDate||"9999").localeCompare(y.dueDate||"9999"));if(sort.value==="late")a.sort((x,y)=>(y.dueDate||"").localeCompare(x.dueDate||""));return a}
function renderTasks(){let a=visible(),today=new Date().toISOString().slice(0,10);total.textContent=a.length;pending.textContent=a.filter(x=>x.status==="TODO").length;progress.textContent=a.filter(x=>x.status==="IN_PROGRESS").length;done.textContent=a.filter(x=>x.status==="DONE").length;overdue.textContent=a.filter(x=>x.dueDate&&x.dueDate<today&&x.status!=="DONE").length;tasks.innerHTML=a.length?a.map(t=>{let ass=db.users.find(x=>x.id===t.assignedTo);return`<article class="task"><div class="task-head"><div><h3>${esc(t.title)}</h3><p>${esc(t.description||"No description")}</p></div><div class="actions"><button class="secondary" onclick="editTask('${t.id}')">Edit</button><button class="danger" onclick="askDelete('${t.id}')">Delete</button></div></div><div class="meta"><span class="pill ${t.priority.toLowerCase()}">${t.priority}</span><span class="pill status">${t.status==="TODO"?"To Do":t.status==="IN_PROGRESS"?"In Progress":"Done"}</span><span class="pill status">📅 ${dateText(t.dueDate)}</span><span class="pill status">👤 ${esc(ass?.name||"Unassigned")}</span></div></article>`}).join(""):'<div class="empty">No tasks found.</div>'}
function renderAllocation(){let a=visible(),users=db.users.filter(x=>x.role==="EMPLOYEE");allocation.innerHTML=users.map(u=>{let x=a.filter(t=>t.assignedTo===u.id),done=x.filter(t=>t.status==="DONE").length,pending=x.filter(t=>t.status!=="DONE").length,percent=x.length?Math.round(done/x.length*100):0;return`<div class="employee-card"><h3>👤 ${esc(u.name)}</h3><div class="muted">${x.length} total · ${pending} pending · ${done} completed</div><div class="bar" style="margin-top:10px"><i style="width:${percent}%"></i></div><div class="muted" style="margin-top:5px">${percent}% completed</div></div>`}).join("")||'<div class="empty">No employees yet.</div>'}
function renderInsights(){let a=visible(),today=new Date().toISOString().slice(0,10),over=a.filter(x=>x.dueDate&&x.dueDate<today&&x.status!=="DONE").length,high=a.filter(x=>x.priority==="HIGH"&&x.status!=="DONE").length;insights.innerHTML=`<p>📌 <b>${over}</b> overdue task(s)</p><p>🔥 <b>${high}</b> high-priority task(s) pending</p><p>✅ <b>${a.filter(x=>x.status==="DONE").length}</b> completed task(s)</p>${over?'<p>⚠️ Review overdue work allocation.</p>':'<p>🎉 No overdue tasks in this view.</p>'}`}
function bind(){cloudSync.onclick=async()=>{if(!API_URL||API_URL.includes("PASTE_YOUR"))return toast("Add Apps Script URL first");cloudReady=true;await syncDatabase();toast("Cloud sync requested")};logout.onclick=()=>{localStorage.removeItem(SESSION);sessionStorage.removeItem(SESSION);localStorage.removeItem(REMEMBER);session=null;renderLogin()};theme.onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("dark",document.body.classList.contains("dark"))};add.onclick=()=>openTask();cancel.onclick=closeTask;cancelDelete.onclick=()=>deleteModal.classList.remove("open");confirmDelete.onclick=deleteTask;[search,fe,fs,fp,sort].forEach(x=>x.addEventListener("input",()=>{renderTasks();renderAllocation();renderInsights()}));refresh.onclick=()=>{renderTasks();renderAllocation();renderInsights()};taskForm.onsubmit=saveTask;parse.onclick=quickAI;askAI.onclick=ask;aiText.onkeydown=e=>{if(e.key==="Enter")ask()};noticeBtn.onclick=()=>noticeMenu.classList.toggle("open");readAll.onclick=()=>{db.notifications.filter(n=>n.userId===user().id).forEach(n=>n.read=true);save();renderNotifications()};let uf=document.getElementById("userForm");if(uf)uf.onsubmit=createEmployee;let up=document.getElementById("uploadExcel");if(up)up.onclick=uploadExcel;let dt=document.getElementById("downloadTemplate");if(dt)dt.onclick=downloadTemplate;populateReportEmployees();let gr=document.getElementById("generateReport");if(gr)gr.onclick=generateReport;let er=document.getElementById("exportReport");if(er)er.onclick=exportReport;["reportEmployee","reportFrom","reportTo","reportType"].forEach(id=>{let el=document.getElementById(id);if(el)el.addEventListener("change",generateReport)});generateReport();let d=document.getElementById("delegateBtn");if(d)d.onclick=()=>{if(!fromEmp.value||!toEmp.value)return toast("Select employees");reassignEmployeeTasks(fromEmp.value,toEmp.value);}}
function openTask(id=null){editing=id;taskModal.classList.add("open");taskForm.reset();modalTitle.textContent=id?"Edit Task":"Create Task";if(id){let t=db.tasks.find(x=>x.id===id);title.value=t.title;desc.value=t.description;due.value=t.dueDate||"";pri.value=t.priority;sta.value=t.status;if(assign)assign.value=t.assignedTo||""}}
function closeTask(){taskModal.classList.remove("open");editing=null}
function saveTask(e){e.preventDefault();let obj={title:title.value.trim(),description:desc.value,dueDate:due.value||null,priority:pri.value,status:sta.value,assignedTo:document.getElementById("assign")?.value||null};if(editing){let t=db.tasks.find(x=>x.id===editing),old=t.assignedTo;Object.assign(t,obj);if(obj.assignedTo&&obj.assignedTo!==old)notify(obj.assignedTo,"New task assigned: "+t.title);toast("Task updated")}else{let t={id:"t"+Date.now(),...obj,createdBy:user().id,createdAt:Date.now()};db.tasks.unshift(t);if(obj.assignedTo)notify(obj.assignedTo,"New task assigned: "+t.title);toast("Task created")}save();closeTask();renderTasks();renderAllocation();renderInsights();renderNotifications()}
function editTask(id){openTask(id)}function askDelete(id){deleting=id;deleteModal.classList.add("open")}function deleteTask(){let t=db.tasks.find(x=>x.id===deleting);db.tasks=db.tasks.filter(x=>x.id!==deleting);if(t?.assignedTo)notify(t.assignedTo,"Task deleted: "+t.title);save();deleteModal.classList.remove("open");toast("Task deleted");renderTasks();renderAllocation();renderInsights();renderNotifications()}
function createEmployee(e){e.preventDefault();if(db.users.some(x=>x.email.toLowerCase()===newEmail.value.toLowerCase()))return toast("Email already exists");db.users.push({id:"u"+Date.now(),name:newName.value,email:newEmail.value,password:newPass.value,role:"EMPLOYEE"});save();e.target.reset();toast("Employee created");renderApp()}
function parseText(text){let l=text.toLowerCase(),today=new Date(),dueDate="";if(l.includes("today"))dueDate=today.toISOString().slice(0,10);if(l.includes("tomorrow")){today.setDate(today.getDate()+1);dueDate=today.toISOString().slice(0,10)}let priority=l.includes("urgent")||l.includes("high priority")?"HIGH":l.includes("low priority")?"LOW":"MEDIUM",assigned="";let m=text.match(/assign\s+([a-zA-Z ]+?)\s+to\s+/i);if(m)assigned=db.users.find(x=>x.name.toLowerCase()===m[1].trim().toLowerCase())?.id||"";let clean=text.replace(/assign\s+.+?\s+to\s+/i,"").replace(/\b(today|tomorrow|urgent|high priority|low priority)\b/gi,"").trim();return{title:clean||"AI Generated Task",description:text,dueDate,priority,assigned}}
function quickAI(){let x=parseText(quick.value);title.value=x.title;desc.value=x.description;due.value=x.dueDate;pri.value=x.priority;if(assign)assign.value=x.assigned;toast("AI parsed your task")}
function addMsg(text,who){chat.innerHTML+=`<div class="msg ${who}">${esc(text)}</div>`;chat.scrollTop=chat.scrollHeight}
function ask(){let q=aiText.value.trim();if(!q)return;addMsg(q,"user");aiText.value="";let l=q.toLowerCase(),a=visible(),today=new Date().toISOString().slice(0,10),ans;if(l.includes("overdue")){let x=a.filter(t=>t.dueDate&&t.dueDate<today&&t.status!=="DONE");ans=x.length?`I found ${x.length} overdue task(s): ${x.map(t=>t.title).join(", ")}.`:"Great! There are no overdue tasks."}else if(l.includes("high priority"))ans=`There are ${a.filter(t=>t.priority==="HIGH"&&t.status!=="DONE").length} pending high-priority task(s).`;else if(l.includes("completed")||l.includes("done"))ans=`${a.filter(t=>t.status==="DONE").length} task(s) are completed.`;else if(l.includes("work allocation")||l.includes("workload")||l.includes("employee")){let best=db.users.filter(x=>x.role==="EMPLOYEE").map(u=>({n:u.name,c:a.filter(t=>t.assignedTo===u.id&&t.status!=="DONE").length})).sort((x,y)=>y.c-x.c)[0];ans=best?`${best.n} currently has the highest pending workload with ${best.c} task(s).`:"No employee workload data available."}else if(l.includes("create")||l.includes("add task")||l.includes("assign")){let x=parseText(q);openTask();title.value=x.title;desc.value=x.description;due.value=x.dueDate;pri.value=x.priority;if(assign)assign.value=x.assigned;ans="I prepared a task form from your request. Review it and click Save Task."}else ans=`I can help with overdue tasks, workload, work allocation, high-priority tasks, completed tasks, and task creation.`;setTimeout(()=>addMsg(ans,"ai"),200)}

function reportTasks(){
 let u=user(),a=db.tasks.filter(t=>u.role==="ADMIN"||t.createdBy===u.id||t.assignedTo===u.id);
 let emp=document.getElementById("reportEmployee")?.value||"ALL",from=document.getElementById("reportFrom")?.value||"",to=document.getElementById("reportTo")?.value||"",type=document.getElementById("reportType")?.value||"ALL",today=new Date().toISOString().slice(0,10);
 if(emp!=="ALL")a=a.filter(t=>t.assignedTo===emp);
 if(from)a=a.filter(t=>!t.dueDate||t.dueDate>=from);
 if(to)a=a.filter(t=>!t.dueDate||t.dueDate<=to);
 if(type==="PENDING")a=a.filter(t=>t.status!=="DONE");
 if(type==="DONE")a=a.filter(t=>t.status==="DONE");
 if(type==="OVERDUE")a=a.filter(t=>t.dueDate&&t.dueDate<today&&t.status!=="DONE");
 return a;
}
function populateReportEmployees(){
 let s=document.getElementById("reportEmployee");if(!s)return;
 let current=s.value;
 s.innerHTML='<option value="ALL">All Employees</option>'+db.users.filter(x=>x.role==="EMPLOYEE").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 s.value=current||"ALL";
}
function generateReport(){
 let a=reportTasks(),today=new Date().toISOString().slice(0,10),completed=a.filter(t=>t.status==="DONE").length,pending=a.filter(t=>t.status==="TODO").length,progress=a.filter(t=>t.status==="IN_PROGRESS").length,overdue=a.filter(t=>t.dueDate&&t.dueDate<today&&t.status!=="DONE").length;
 let rate=a.length?Math.round(completed/a.length*100):0;
 reportSummary.innerHTML=`<div class="stat"><span>Total</span><strong>${a.length}</strong></div><div class="stat"><span>Pending</span><strong>${pending}</strong></div><div class="stat"><span>In Progress</span><strong>${progress}</strong></div><div class="stat"><span>Completed</span><strong>${completed}</strong></div><div class="stat"><span>Completion Rate</span><strong>${rate}%</strong></div>`;
 reportTable.querySelector("tbody").innerHTML=a.length?a.map(t=>{let e=db.users.find(x=>x.id===t.assignedTo);return`<tr><td style="padding:10px;border-bottom:1px solid var(--line)">${esc(e?.name||"Unassigned")}</td><td style="padding:10px;border-bottom:1px solid var(--line)">${esc(t.title)}</td><td style="padding:10px;border-bottom:1px solid var(--line)">${dateText(t.dueDate)}</td><td style="padding:10px;border-bottom:1px solid var(--line)">${t.priority}</td><td style="padding:10px;border-bottom:1px solid var(--line)">${t.status==="TODO"?"To Do":t.status==="IN_PROGRESS"?"In Progress":"Done"}${t.dueDate&&t.dueDate<today&&t.status!=="DONE"?" ⚠️":""}</td></tr>`}).join(""):'<tr><td colspan="5" class="empty">No report data found.</td></tr>';
 toast(`Report generated: ${a.length} task(s)`);
}
function exportReport(){
 let a=reportTasks(),today=new Date().toISOString().slice(0,10),rows=[["EMPLOYEE","TASK","DESCRIPTION","DUE DATE","PRIORITY","STATUS","OVERDUE"]];
 a.forEach(t=>{let e=db.users.find(x=>x.id===t.assignedTo);rows.push([e?.name||"UNASSIGNED",t.title,t.description||"",t.dueDate||"",t.priority,t.status,t.dueDate&&t.dueDate<today&&t.status!=="DONE"?"YES":"NO"])});
 let ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"TASK REPORT");XLSX.writeFile(wb,"Amba_Task_Report_"+new Date().toISOString().slice(0,10)+".xlsx");toast("Excel report downloaded");
}

function renderNotifications(){let a=db.notifications.filter(x=>x.userId===user().id),un=a.filter(x=>!x.read).length;badge.textContent=un||"";noticeList.innerHTML=a.length?a.slice(0,30).map(n=>`<div class="notice-item ${n.read?"":"unread"}">${esc(n.message)}<small>${new Date(n.date).toLocaleString("en-IN")}</small></div>`).join(""):'<div class="empty">No notifications</div>'}
function uploadExcel(){let f=excelFile.files[0];if(!f)return toast("Please select an Excel file");let reader=new FileReader();reader.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:"array",cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:""});if(!rows.length)return toast("Excel file is empty");let created=0,unmatched=[],assignedCount=0;rows.forEach((r,i)=>{let keys=Object.keys(r),get=(names)=>{let k=keys.find(x=>names.includes(norm(x)));return k?r[k]:""};let name=get(["employeename","employee","assignedto","assignee","staffname","name"]),title=get(["task","title","tasktitle","work","workallocation"]);if(!title)title=get(["description"]);if(!title)return;let desc=get(["description","details","remark","remarks","notes"]),due=parseDate(get(["duedate","date","deadline","targetdate"])),priority=priorityNorm(get(["priority","level"])),status=statusNorm(get(["status","taskstatus"]));let emp=db.users.find(u=>norm(u.name)===norm(name)||norm(u.email)===norm(name));if(name&&!emp){unmatched.push(`${name} (row ${i+2})`)}let t={id:"t"+Date.now()+Math.random(),title:String(title),description:String(desc||""),dueDate:due,priority,status,assignedTo:emp?.id||null,createdBy:user().id,createdAt:Date.now(),source:"EXCEL"};db.tasks.unshift(t);created++;if(emp){assignedCount++;notify(emp.id,"New task allocated from Excel: "+t.title)}});save();renderTasks();renderAllocation();renderInsights();renderNotifications();uploadResult.innerHTML=`✅ <b>${created}</b> task(s) imported · 👤 <b>${assignedCount}</b> allocated by employee name.${unmatched.length?`<br>⚠️ Unmatched names: ${esc(unmatched.join(", "))}`:""}`;toast("Excel work allocation imported")}catch(err){console.error(err);toast("Could not read Excel file")}};reader.readAsArrayBuffer(f)}
function downloadTemplate(){let rows=[["EMPLOYEE NAME","TASK / TITLE","DESCRIPTION","DUE DATE","PRIORITY","STATUS"],["RAHUL","CHECK OPD STOCK","Verify pharmacy stock","20-07-2026","HIGH","TODO"],["RAHUL","EXPIRY CHECK","Check expiry medicines","21-07-2026","MEDIUM","TODO"],["AMIT","PREPARE REPORT","Prepare monthly report","22-07-2026","LOW","IN_PROGRESS"]];let ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"WORK ALLOCATION");XLSX.writeFile(wb,"Amba_Work_Allocation_Template.xlsx")}

// === Employee Availability Feature ===
if(!db.employeeAvailability) db.employeeAvailability=[];
if(!db.reassignmentHistory) db.reassignmentHistory=[];
function reassignEmployeeTasks(fromId,toId){
  db.tasks.forEach(t=>{
    if(t.assignedTo===fromId && t.status!=="DONE"){
      db.reassignmentHistory.push({id:"r"+Date.now()+Math.random(),taskId:t.id,from:fromId,to:toId,date:new Date().toISOString()});
      t.assignedTo=toId;
      notify(toId,"Task delegated: "+t.title);
    }
  });
  save();
  renderTasks();renderAllocation();renderInsights();renderNotifications();
  toast("Tasks reassigned successfully");
}

async function loadCloudDatabase(){
  if(!API_URL || API_URL.includes("PASTE_YOUR")){
    cloudReady=false;
    if(session&&user())renderApp();else renderLogin();
    return;
  }
  try{
    const r=await fetch(API_URL);
    const remote=await r.json();
    if(remote && remote.users && remote.tasks && remote.notifications){
      db=remote;
      localSave();
      cloudReady=true;
    }
  }catch(e){
    console.warn("Cloud database unavailable; using local cache",e);
    cloudReady=false;
  }
  if(session&&user())renderApp();else renderLogin();
}
if(localStorage.getItem("dark")==="true")document.body.classList.add("dark");
loadCloudDatabase();
</script>
